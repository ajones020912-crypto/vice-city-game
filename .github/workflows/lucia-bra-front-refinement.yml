name: Refine Lucia bra front outlines and edging while preserving back and straps
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lucia-bra-front-refinement.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lucia-photo-reference
  cancel-in-progress: false
jobs:
  front:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --prefix "$RUNNER_TEMP/lucia-bra-front" --no-package-lock --ignore-scripts three@0.128.0 acorn@8
      - name: Replace circular front outlines without changing body back or straps
        run: |
          node <<'JS'
          const fs=require('fs'),acorn=require(process.env.RUNNER_TEMP+'/lucia-bra-front/node_modules/acorn');let s=fs.readFileSync('js/reference-characters.js','utf8');if(s.includes('// LUCIA_BRA_FRONT_REFINEMENT_V3'))process.exit(0);if(!s.includes('// LUCIA_TAILORED_BRA_V2'))throw Error('Installed tailored bra required');fs.writeFileSync('/tmp/lucia-front-before.js',s);function walk(n,fn){fn(n);for(const v of Object.values(n)){if(Array.isArray(v)){for(const x of v)if(x&&typeof x.type==='string')walk(x,fn);}else if(v&&typeof v.type==='string')walk(v,fn);}}const functions=[];walk(acorn.parse(s,{ecmaVersion:'latest'}),n=>{if(n.type==='FunctionDeclaration'&&n.id&&n.id.name==='addLuciaTailoredBra')functions.push(n);});if(functions.length!==1)throw Error('Tailored bra implementation changed');const f=functions[0],loops=f.body.body.filter(n=>n.type==='ForOfStatement'&&s.slice(n.start,n.end).includes('cx=side*.078'));if(loops.length!==1)throw Error('Reviewed elliptical cups changed');const loop=loops[0];
          const replacement=String.raw`const braFrontOutlines=[];for(const side of [-1,1]){const shape=new T.Shape();shape.moveTo(.012,.365);shape.quadraticCurveTo(.025,.315,.075,.305);shape.quadraticCurveTo(.125,.295,.153,.385);shape.quadraticCurveTo(.162,.420,.118,.470);shape.quadraticCurveTo(.078,.455,.032,.420);shape.quadraticCurveTo(.012,.399,.012,.365);const raw=shape.getPoints(12).map(p=>new T.Vector2(side*p.x,p.y)),unique=[...new Map(raw.map(p=>[p.x.toFixed(8)+','+p.y.toFixed(8),p])).values()].sort((a,b)=>a.x-b.x||a.y-b.y),cross=(a,b,c)=>(b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x),lower=[],upper=[];for(const p of unique){while(lower.length>=2&&cross(lower[lower.length-2],lower[lower.length-1],p)<=0)lower.pop();lower.push(p);}for(const p of unique.slice().reverse()){while(upper.length>=2&&cross(upper[upper.length-2],upper[upper.length-1],p)<=0)upper.pop();upper.push(p);}const hull=lower.slice(0,-1).concat(upper.slice(0,-1)),planes=[front];if(hull.length<12)throw Error('Cup outline is not sufficiently curved');for(let i=0;i<hull.length;i++){const a=hull[i],b=hull[(i+1)%hull.length],nx=b.y-a.y,ny=a.x-b.x;planes.push([nx,ny,0,nx*a.x+ny*a.y]);}patch(side<0?'left-cup':'right-cup',[planes]);braFrontOutlines.push({side,lower:shape.curves.slice(0,2).flatMap(c=>c.getPoints(16)).map(p=>new T.Vector2(side*p.x,p.y)),neckline:shape.curves.slice(2,4).flatMap(c=>c.getPoints(16)).map(p=>new T.Vector2(side*p.x,p.y))});}`;s=s.slice(0,loop.start)+replacement+s.slice(loop.end);function once(a,b){if(s.split(a).length!==2)throw Error('Reviewed garment fragment changed');s=s.replace(a,b);}once("patch('center-connector',[[...yRange(.350,.390),front,[1,0,0,.018],[-1,0,0,.018]]]);","patch('center-connector',[[...yRange(.325,.395),front,[1,.3714285714,0,.1557142857],[-1,.3714285714,0,.1557142857]]]);");
          const trim=String.raw`const trimMaterial=new T.MeshStandardMaterial({color:0x292b30,roughness:.90,metalness:0});for(const outline of braFrontOutlines)for(const [label,samples,radius]of [['underwire',outline.lower,.0012],['neckline',outline.neckline,.0007]]){const points=[];for(const p of samples){const q=hit(new T.Vector3(p.x,p.y,1),new T.Vector3(0,0,-1)),r=Math.hypot(q.x,q.z);q.x+=q.x/r*.003;q.z+=q.z/r*.003+.0013;if(!points.length||q.distanceToSquared(points[points.length-1])>1e-12)points.push(q);}if(points.length<4)throw Error('Front edging path missing');const curve=new T.CatmullRomCurve3(points,false,'centripetal'),geometry=new T.TubeGeometry(curve,72,radius,6,false),edging=new T.Mesh(geometry,trimMaterial);edging.name='lucia-bra-front-'+(outline.side<0?'left-':'right-')+label;edging.castShadow=true;edging.receiveShadow=true;group.add(edging);}u.luciaBraFrontRefined=true;`;once('u.spine.add(group);u.luciaFittedBra=true;',trim+'u.spine.add(group);u.luciaFittedBra=true;');s='// LUCIA_BRA_FRONT_REFINEMENT_V3\n'+s;acorn.parse(s,{ecmaVersion:'latest'});fs.writeFileSync('/tmp/lucia-front-after.js',s);
          JS
      - name: Check changed cup profiles preserved back body straps and moving rig
        run: |
          node <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert'),T=require(process.env.RUNNER_TEMP+'/lucia-bra-front/node_modules/three');if(!fs.existsSync('/tmp/lucia-front-after.js')){if(fs.readFileSync('js/reference-characters.js','utf8').includes('// LUCIA_BRA_FRONT_REFINEMENT_V3'))process.exit(0);throw Error('Candidate missing');}function load(file){const c={window:{},console,Math};vm.createContext(c);for(const p of ['js/characters.js',file])vm.runInContext(fs.readFileSync(p,'utf8'),c);return c.window.VCCharacters;}const old=load('/tmp/lucia-front-before.js'),cur=load('/tmp/lucia-front-after.js'),allowed=new Set(['lucia-bra-left-cup','lucia-bra-right-cup','lucia-bra-center-connector']);function signature(h){const out=[];h.traverse(o=>{if(allowed.has(o.name)||o.name.startsWith('lucia-bra-front-'))return;const row=[o.type,o.name,o.visible,o.position.toArray(),o.quaternion.toArray(),o.scale.toArray()];if(o.isMesh)row.push(Object.keys(o.geometry.attributes).sort().map(k=>[k,Array.from(o.geometry.attributes[k].array)]),o.geometry.index?Array.from(o.geometry.index.array):null,...(Array.isArray(o.material)?o.material:[o.material]).map(m=>[m.type,m.color?m.color.getHex():null,m.roughness,m.metalness,m.flatShading,m.skinning]));out.push(row);});return JSON.stringify(out);}for(const id of Object.keys(old.DESIGNS))if(id!=='luciaC')assert(signature(old.build(T,id))===signature(cur.build(T,id)),'Other character changed');const a=old.build(T,'luciaC',{merge:false}),b=cur.build(T,'luciaC',{merge:false}),u=b.userData;assert(signature(a)===signature(b),'Back straps body skin materials or rig changed');assert(u.luciaBraFrontRefined);for(const side of ['left','right']){const before=a.getObjectByName('lucia-bra-'+side+'-cup'),after=b.getObjectByName('lucia-bra-'+side+'-cup');assert(after&&after.material.color.getHex()===0x191a1e&&!after.material.transparent);assert(JSON.stringify(Array.from(before.geometry.attributes.position.array))!==JSON.stringify(Array.from(after.geometry.attributes.position.array)),'Cup outline unchanged');after.geometry.computeBoundingBox();assert(after.geometry.boundingBox.max.y<.475&&after.geometry.boundingBox.max.y>.455);for(const label of ['underwire','neckline'])assert(b.getObjectByName('lucia-bra-front-'+side+'-'+label));}b.updateMatrixWorld(true);let rays=0;for(const side of [-1,1])for(const y of [.350,.390,.430]){const origin=new T.Vector3(side*.080,y,1).applyMatrix4(u.spine.matrixWorld),direction=new T.Vector3(0,0,-1).transformDirection(u.spine.matrixWorld),cup=b.getObjectByName('lucia-bra-'+(side<0?'left-cup':'right-cup'));assert(new T.Raycaster(origin,direction,0,2).intersectObject(cup,false).length>0,'Cup coverage missing');rays++;}
          let poses=0;for(const merge of [false,true]){const h=cur.build(T,'luciaC',{merge}),u=h.userData;assert(u.luciaBraFrontRefined&&u.luciaTailoredBra&&u.guns.pistol&&u.guns.rifle);for(const angle of [-.7,0,.7]){u.spine.rotation.y=angle*.2;u.spine.rotation.x=angle*.1;u.A[0].sh.rotation.x=angle;u.A[1].sh.rotation.x=-angle;h.updateMatrixWorld(true);h.traverse(o=>{assert(o.matrixWorld.elements.every(Number.isFinite));if(o.isMesh)for(const k of ['position','normal'])if(o.geometry.attributes[k])assert(Array.from(o.geometry.attributes[k].array).every(Number.isFinite));});poses++;}}fs.copyFileSync('/tmp/lucia-front-after.js','js/reference-characters.js');fs.mkdirSync('status',{recursive:true});fs.writeFileSync('status/lucia-bra-front-refinement-check.json',JSON.stringify({passed:true,cupCoverageRays:rays,poseChecks:poses,circularCupOutlinesReplaced:true,taperedCenterPanel:true,frontUnderwireAndNecklineEdging:true,backAndExistingStrapGeometryUnchanged:true,bodyGeometrySkinToneMaterialsAndRigUnchanged:true,otherCharactersUnchanged:true,visualReference:'Black high-apex bra front flat lay: https://www.hankypanky.com/products/signature-lace-high-apex-unlined-bra-black ; silhouette reference only, opaque black retained, lace not copied.',scope:'Front garment geometry refinement only. Structural tests do not verify rendered realism, trim attachment, clipping, or live deployment.'},null,2)+'\n');
          JS
      - name: Publish only validated front revision
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'Main changed; rerun against latest revision.'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- js/reference-characters.js status/lucia-bra-front-refinement-check.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refine Lucia bra front cup silhouettes center panel and edging while preserving back'
          git push origin HEAD:main
