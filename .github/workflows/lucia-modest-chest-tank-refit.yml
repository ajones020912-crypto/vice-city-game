name: Lucia modest chest reduction and bridged tank refit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lucia-modest-chest-tank-refit.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refit:
    strategy:
      fail-fast: false
      matrix:
        target: [main, lucia-outfits]
    concurrency:
      group: lucia-u-neck-${{ matrix.target }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --prefix "$RUNNER_TEMP/lucia-small-refit" --no-package-lock --ignore-scripts three@0.128.0 acorn@8
      - name: Reduce localized chest fullness before existing garment fitting
        run: |
          node <<'JS'
          const fs=require('fs'),acorn=require(process.env.RUNNER_TEMP+'/lucia-small-refit/node_modules/acorn');let s=fs.readFileSync('js/reference-characters.js','utf8');if(s.includes('// LUCIA_MODEST_CHEST_REFIT_V1'))process.exit(0);if(!s.includes('// LUCIA_HANGING_TANK_BRIDGE_V2'))throw Error('Installed hanging tank bridge required');fs.writeFileSync('/tmp/lucia-small-before.js',s);function walk(n,f){f(n);for(const v of Object.values(n)){if(Array.isArray(v)){for(const x of v)if(x&&typeof x.type==='string')walk(x,f);}else if(v&&typeof v.type==='string')walk(v,f);}}const nodes=[];walk(acorn.parse(s,{ecmaVersion:'latest'}),n=>{if(n.type==='FunctionDeclaration'&&n.id&&n.id.name==='lucia')nodes.push(n);});if(nodes.length!==1)throw Error('Lucia builder changed');const node=nodes[0],calls=node.body.body.filter(n=>n.type==='ExpressionStatement'&&n.expression.type==='CallExpression'),bra=calls.filter(n=>n.expression.callee.name==='addLuciaTailoredBra'),contour=calls.filter(n=>n.expression.callee.name==='defineLuciaCenterContour');if(bra.length!==1||contour.length!==1||contour[0].start>=bra[0].start)throw Error('Reviewed pre-garment fitting order changed');const helper=String.raw`
           function reduceLuciaChestFullness(T,h){
            const u=h.userData,mesh=u.luciaCenterContour&&u.spine.children[u.luciaCenterContour.spineChildIndex];if(!mesh||!mesh.isMesh||mesh.material!==u.m.skin||h.getObjectByName('lucia-tailored-bra'))throw Error('Expected torso before base garment fitting');h.updateMatrixWorld(true);const g=mesh.geometry.clone(),p=g.attributes.position,oldNormals=g.attributes.normal.clone(),M=new T.Matrix4().copy(u.spine.matrixWorld).invert().multiply(mesh.matrixWorld),back=M.clone().invert(),v=new T.Vector3(),smooth=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t);},edited=new Set(),affected=new Set();let maxReduction=0;for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i).applyMatrix4(M);const weight=smooth((v.y-.275)/.045)*smooth((.490-v.y)/.045)*(1-smooth((Math.abs(v.x)-.120)/.040)),reduction=.10*Math.max(0,v.z-.085)*weight;if(reduction<=1e-8)continue;v.z-=reduction;maxReduction=Math.max(maxReduction,reduction);v.applyMatrix4(back);p.setXYZ(i,v.x,v.y,v.z);edited.add(i);affected.add(i);}if(edited.size<20||maxReduction<.003||maxReduction>.014)throw Error('Chest reduction outside modest range');for(let i=0,c=g.index?g.index.count:p.count;i<c;i+=3){const tri=[0,1,2].map(j=>g.index?g.index.getX(i+j):i+j);if(tri.some(k=>edited.has(k)))for(const k of tri)affected.add(k);}p.needsUpdate=true;g.computeVertexNormals();const n=g.attributes.normal,groups=new Map();for(const i of affected){const key=[p.getX(i),p.getY(i),p.getZ(i)].map(x=>Math.round(x*1e5)).join(',');if(!groups.has(key))groups.set(key,[]);groups.get(key).push(i);}for(const ids of groups.values()){const sum=new T.Vector3();for(const i of ids)sum.add(new T.Vector3().fromBufferAttribute(n,i));sum.normalize();for(const i of ids)n.setXYZ(i,sum.x,sum.y,sum.z);}for(let i=0;i<n.count;i++)if(!affected.has(i))n.setXYZ(i,oldNormals.getX(i),oldNormals.getY(i),oldNormals.getZ(i));n.needsUpdate=true;g.computeBoundingBox();g.computeBoundingSphere();mesh.geometry=g;u.luciaModestChestRefit={editedVertices:edited.size,maxProjectionReduction:maxReduction,excessProjectionReductionFactor:.10,projectionAnchor:.085,scope:'Localized front-chest depth only; not a percentage change in breast volume or overall torso size. Existing garment builders run afterwards with unchanged coverage boundaries.'};
           }
          `;s=s.slice(0,bra[0].start)+'reduceLuciaChestFullness(T,h);\n '+s.slice(bra[0].start);s=s.slice(0,node.start)+helper+s.slice(node.start);s='// LUCIA_MODEST_CHEST_REFIT_V1\n'+s;acorn.parse(s,{ecmaVersion:'latest'});fs.writeFileSync('/tmp/lucia-small-after.js',s);
          JS
      - name: Validate localized reduction and smaller bridged tank
        run: |
          node <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert'),T=require(process.env.RUNNER_TEMP+'/lucia-small-refit/node_modules/three');if(!fs.existsSync('/tmp/lucia-small-after.js')){assert(fs.readFileSync('js/reference-characters.js','utf8').includes('// LUCIA_MODEST_CHEST_REFIT_V1'));process.exit(0);}function load(file){const c={window:{},console,Math};vm.createContext(c);for(const p of ['js/characters.js',file])vm.runInContext(fs.readFileSync(p,'utf8'),c);return c.window.VCCharacters;}const old=load('/tmp/lucia-small-before.js'),cur=load('/tmp/lucia-small-after.js');function signature(h,skinOnly=false){const u=h.userData,torso=u.luciaCenterContour&&u.spine.children[u.luciaCenterContour.spineChildIndex],rows=[];h.traverse(o=>{if(skinOnly&&(o===torso||!o.isMesh||o.material!==u.m.skin))return;const row=[o.type,o.name,o.position.toArray(),o.quaternion.toArray(),o.scale.toArray()];if(o.isMesh)row.push(Object.keys(o.geometry.attributes).sort().map(k=>[k,Array.from(o.geometry.attributes[k].array)]),o.geometry.index?Array.from(o.geometry.index.array):null,...(Array.isArray(o.material)?o.material:[o.material]).map(m=>[m.type,m.color?m.color.getHex():null,m.roughness,m.transparent,m.opacity]));rows.push(row);});return JSON.stringify(rows);}for(const id of Object.keys(old.DESIGNS))if(id!=='luciaC')assert(signature(old.build(T,id))===signature(cur.build(T,id)),'Other character changed');const reports=[];for(const merge of [false,true]){const a=old.build(T,'luciaC',{merge}),h=cur.build(T,'luciaC',{merge}),u=h.userData,v=a.userData,torso=u.spine.children[u.luciaCenterContour.spineChildIndex],oldTorso=v.spine.children[v.luciaCenterContour.spineChildIndex];assert(signature(a,true)===signature(h,true),'Other skin geometry or proportions changed');assert(u.m.skin.color.getHex()===v.m.skin.color.getHex());const p=torso.geometry.attributes.position,q=oldTorso.geometry.attributes.position;assert(p.count===q.count);h.updateMatrixWorld(true);a.updateMatrixWorld(true);const inverse=new T.Matrix4().copy(u.spine.matrixWorld).invert(),M=inverse.clone().multiply(torso.matrixWorld),oldM=new T.Matrix4().copy(v.spine.matrixWorld).invert().multiply(oldTorso.matrixWorld);let reduced=0;for(let i=0;i<p.count;i++){const now=new T.Vector3().fromBufferAttribute(p,i).applyMatrix4(M),before=new T.Vector3().fromBufferAttribute(q,i).applyMatrix4(oldM);assert(Math.abs(now.x-before.x)<1e-6&&Math.abs(now.y-before.y)<1e-6&&now.z<=before.z+1e-6);if(before.z-now.z>1e-7){assert(Math.abs(before.x)<.160001&&before.y>.274999&&before.y<.490001&&before.z>.085&&before.z-now.z<.014);reduced++;}}assert(reduced>20&&u.luciaModestChestRefit);for(let i=0;i<2;i++){assert.deepStrictEqual(u.A[i].sh.position.toArray(),v.A[i].sh.position.toArray());assert.deepStrictEqual(u.A[i].el.position.toArray(),v.A[i].el.position.toArray());assert.deepStrictEqual(u.Lg[i].hp.position.toArray(),v.Lg[i].hp.position.toArray());}for(const key of ['neckHalf','neckDepth','strapWidth','strapCenter','hem'])assert(u.luciaTankUNeck[key]===v.luciaTankUNeck[key],'Tank style changed');assert(Math.abs(u.luciaTankUNeck.neckBase-v.luciaTankUNeck.neckBase)<.003);const bra=h.getObjectByName('lucia-tailored-bra'),briefs=h.getObjectByName('lucia-fitted-black-briefs'),tank=h.getObjectByName('lucia-dark-grey-tank-outfit'),body=h.getObjectByName('lucia-dark-grey-tank-top');assert(bra.visible&&briefs.visible&&tank.visible&&u.luciaTankVisible&&u.luciaOutfit===v.luciaOutfit);for(const garment of [bra,briefs])garment.traverse(o=>{if(o.isMesh)for(const m of Array.isArray(o.material)?o.material:[o.material])assert(!m.transparent&&m.opacity===1);});assert(signature(briefs)===signature(a.getObjectByName('lucia-fitted-black-briefs')),'Briefs changed');assert(body.material.color.getHex()===0x3b3d40&&body.material.bumpMap&&body.material.bumpScale===.00022&&u.luciaBroadTankChest.curvature===.2&&u.luciaBroadTankChest.dipParameter===.001);function hits(human,meshes,x,y){const spine=human.userData.spine,origin=new T.Vector3(x,y,1).applyMatrix4(spine.matrixWorld),direction=new T.Vector3(0,0,-1).transformDirection(spine.matrixWorld),inv=new T.Matrix4().copy(spine.matrixWorld).invert();return new T.Raycaster(origin,direction,0,3).intersectObjects(meshes,false).map(hit=>hit.point.clone().applyMatrix4(inv)).filter(p=>p.z>.025);}const under=[torso];bra.traverse(o=>{if(o.isMesh)under.push(o);});let tankReduction=0;const profiles=[];for(const y of [.32,.34,.36,.38,.40]){const xs=[-.08,-.035,0,.035,.08],points=xs.map(x=>hits(h,[body],x,y)[0]);if(points.some(p=>!p))continue;const z=points.map(p=>p.z);assert(Math.max(...z)-Math.min(...z)<.0045,'Separate cup-shaped fabric returned');for(let j=0;j<xs.length;j++){const beneath=hits(h,under,xs[j],y)[0];if(beneath)assert(z[j]-beneath.z>.001,'Refitted tank clips chest or bra');}const before=hits(a,[a.getObjectByName('lucia-dark-grey-tank-top')],0,y)[0];if(before)tankReduction=Math.max(tankReduction,before.z-z[2]);profiles.push({y,x:xs,z});}assert(profiles.length>=3&&tankReduction>.003,'Tank did not resize with chest');for(const angle of [-.7,0,.7]){u.A[0].sh.rotation.x=angle;u.A[1].sh.rotation.x=-angle;h.updateMatrixWorld(true);h.traverse(o=>{assert(o.matrixWorld.elements.every(Number.isFinite));if(o.isMesh)for(const k of ['position','normal','uv'])if(o.geometry.attributes[k])assert(Array.from(o.geometry.attributes[k].array).every(Number.isFinite));});}reports.push({merge,reducedVertices:reduced,tankProjectionReduction:tankReduction,profiles,fit:u.luciaModestChestRefit});}fs.copyFileSync('/tmp/lucia-small-after.js','js/reference-characters.js');fs.mkdirSync('status',{recursive:true});fs.writeFileSync('status/lucia-modest-chest-tank-refit-check.json',JSON.stringify({passed:true,branch:process.env.TARGET_BRANCH,reports,shouldersHipsLimbsSkinToneAndOtherCharactersUnchanged:true,braRegeneratedWithoutChangingCoverageRules:true,permanentBriefsUnchanged:true,bridgedTankAndMidpointNecklinePreserved:true,scope:'Localized chest fullness reduction followed by existing bra and tank generation. Garment coverage rules are unchanged. Numerical clearance samples and finite poses do not certify final rendered appearance, all-pose clipping, all alternate outfits or live deployment.'},null,2)+'\n');
          JS
      - name: Publish validated modest reduction and garment refit
        run: |
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/"$TARGET_BRANCH")" || { echo 'Branch changed; rerun against latest.'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- js/reference-characters.js status/lucia-modest-chest-tank-refit-check.json
          git diff --cached --quiet && exit 0
          git commit -m 'Slightly reduce Lucia chest fullness and refit permanent bra and bridged tank'
          git push origin HEAD:"refs/heads/$TARGET_BRANCH"
