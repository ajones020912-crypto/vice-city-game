name: Refine Jason reference inspired face body hair and outfit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/jason-reference-refinement.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  jason:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --prefix "$RUNNER_TEMP/jason-reference" --no-package-lock --ignore-scripts three@0.128.0
      - name: Prepare Jason only reference inspired model refinement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess
          p=Path('js/reference-characters.js');s=p.read_text();Path('/tmp/jason-reference-before.js').write_text(s)
          if 'function refineJasonReference(' in s: raise SystemExit('Jason reference pass already installed.')
          match=re.search(r'jasonC:\{[^\n]+',s)
          if not match: raise SystemExit('Jason reference preset not found.')
          old=match.group(0);new=old
          for a,b in [('skin:0xc98e68','skin:0xc59778'),('hair:0x2d211b','hair:0x34271e'),("top:{kind:'tee',color:0x626a68}","top:{kind:'tee',color:0x666b69}"),("legs:{kind:'trousers',color:0x6a593f}","legs:{kind:'trousers',color:0x6b5a45}")]:
           if new.count(a)!=1: raise SystemExit('Jason preset changed: '+a)
           new=new.replace(a,b,1)
          s=s[:match.start()]+new+s[match.end():]
          anchor='else jason(T,h);'
          if s.count(anchor)!=1: raise SystemExit('Expected one Jason builder branch.')
          s=s.replace(anchor,'else{jason(T,h);refineJasonReference(T,h);}',1)
          helper='''
           // Procedural, reference-inspired approximation. No Rockstar model or texture assets imported.
           function refineJasonReference(T,h){
            const u=h.userData,m=u.m;
            m.skin.flatShading=false;m.skin.roughness=.76;m.skin.needsUpdate=true;m.hair.color.setHex(0x34271e);m.brow.color.setHex(0x413026);m.iris.color.setHex(0x617b80);m.lip.color.setHex(0xa57365);m.lip.roughness=.63;m.shirt.roughness=.94;m.pants.roughness=.96;m.pants.flatShading=false;m.pants.needsUpdate=true;
            function smooth(o){o.geometry.computeVertexNormals();const p=o.geometry.attributes.position,n=o.geometry.attributes.normal,groups=new Map();for(let i=0;i<p.count;i++){const key=[p.getX(i),p.getY(i),p.getZ(i)].map(x=>Math.round(x*1e6)).join(',');if(!groups.has(key))groups.set(key,[]);groups.get(key).push(i);}const original=Float32Array.from(n.array);for(const ids of groups.values()){if(ids.length<2)continue;for(const i of ids){const base=new T.Vector3(original[i*3],original[i*3+1],original[i*3+2]),v=new T.Vector3();for(const j of ids){const q=new T.Vector3(original[j*3],original[j*3+1],original[j*3+2]);if(base.dot(q)>.6)v.add(q);}if(v.lengthSq()>1e-12){v.normalize();n.setXYZ(i,v.x,v.y,v.z);}}}n.needsUpdate=true;}
            function torso(o){o.updateMatrix();const old=o.geometry,g=old.clone(),p=g.attributes.position,to=o.matrix.clone(),from=to.clone().invert(),v=new T.Vector3();for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i).applyMatrix4(to);const chest=Math.exp(-Math.pow((v.y-.37)/.12,2)),waist=Math.exp(-Math.pow((v.y-.12)/.09,2));v.x*=1+.025*chest-.020*waist;v.z*=1+.015*chest-.010*waist;v.applyMatrix4(from);p.setXYZ(i,v.x,v.y,v.z);}p.needsUpdate=true;o.geometry=g;smooth(o);g.computeBoundingBox();g.computeBoundingSphere();old.dispose();}
            for(const o of u.spine.children)if(o.isMesh&&(o.material===m.skin||o.material===m.shirt||o.name==='jason-reference-shirt-graphic'))torso(o);
            for(const arm of u.A)for(const o of arm.sh.children)if(o.isMesh&&o.material===m.skin){o.scale.x*=1.025;o.scale.z*=1.025;}
            let lipCount=0;
            for(const o of u.headP.children.slice()){
             if(!o.isMesh)continue;
             if(o.material===m.hair){remove(o);continue;}
             if(o.material===m.skin&&o.geometry.type==='LatheGeometry'){const old=o.geometry,g=old.clone(),p=g.attributes.position;for(let i=0;i<p.count;i++){const y=p.getY(i),jaw=Math.exp(-Math.pow((y-.085)/.035,2)),cheek=Math.exp(-Math.pow((y-.15)/.045,2));p.setX(i,p.getX(i)*(1+.03*jaw+.01*cheek));if(p.getZ(i)>0)p.setZ(i,p.getZ(i)+.0015*jaw);}p.needsUpdate=true;o.geometry=g;smooth(o);g.computeBoundingBox();g.computeBoundingSphere();old.dispose();}
             if(o.material===m.lip){o.scale.x*=1.05;o.scale.y*=1.03;o.name='jason-reference-lip-'+lipCount++;}
             if(o.material===m.skin&&Math.abs(o.position.x)<.005&&o.position.z>.09&&o.position.y>.12&&o.position.y<.19){o.scale.x*=1.03;o.scale.z*=1.03;if(o.geometry.type==='SphereGeometry')o.name=o.position.y<.155?'jason-reference-nose-tip':'jason-reference-nose-bridge';}
             if(o.name==='jason-light-stubble'){o.material.opacity=.22;o.material.roughness=.95;}
             if(o.material===m.skin||o.material===m.lip)smooth(o);
            }
            const heads=u.headP.children.filter(o=>o.isMesh&&o.material===m.skin&&o.geometry.type==='LatheGeometry');for(const o of heads){o.updateMatrix();o.geometry.computeBoundingBox();}heads.sort((a,b)=>b.geometry.boundingBox.getSize(new T.Vector3()).y-a.geometry.boundingBox.getSize(new T.Vector3()).y);const head=heads[0];if(!head)throw Error('Expected Jason head surface');
            const bounds=head.geometry.boundingBox.clone().applyMatrix4(head.matrix),center=bounds.getCenter(new T.Vector3()),top=bounds.max.y+.004,layers=new Map(),hp=head.geometry.attributes.position,v=new T.Vector3();
            for(let i=0;i<hp.count;i++){v.fromBufferAttribute(hp,i).applyMatrix4(head.matrix);const key=Math.round(v.y*1e5);if(!layers.has(key))layers.set(key,{y:v.y,x:0,f:0,b:0});const r=layers.get(key);r.x=Math.max(r.x,Math.abs(v.x-center.x));r.f=Math.max(r.f,v.z-center.z);r.b=Math.max(r.b,center.z-v.z);}
            const profile=Array.from(layers.values()).sort((a,b)=>a.y-b.y);if(profile.length<4)throw Error('Insufficient Jason scalp samples');
            function radius(y){let i=0;while(i<profile.length-2&&y>profile[i+1].y)i++;const a=profile[i],b=profile[i+1],t=Math.max(0,Math.min(1,(y-a.y)/(b.y-a.y||1)));return {x:a.x+(b.x-a.x)*t,f:a.f+(b.f-a.f)*t,b:a.b+(b.b-a.b)*t};}
            const positions=[],uv=[],colors=[],indices=[],rows=22,cols=56;
            for(let i=0;i<=rows;i++)for(let j=0;j<cols;j++){const phi=j/cols*Math.PI*2,c=Math.cos(phi),end=top-.15+.05*Math.max(0,c)-.008*Math.max(0,-c),y=top+(end-top)*i/rows,r=radius(y-.002),grain=.0007*Math.sin(phi*21+i*.7);positions.push(center.x+Math.sin(phi)*(r.x+.004+grain),y,center.z+c*((c>=0?r.f:r.b)+.004+grain));uv.push(j/cols,i/rows);const fade=Math.max(0,Math.min(1,(i/rows-.55)/.45))*.30,color=new T.Color(0x34271e).lerp(new T.Color(0xc59778),fade);colors.push(color.r,color.g,color.b);}
            for(let i=0;i<rows;i++)for(let j=0;j<cols;j++){const a=i*cols+j,b=(i+1)*cols+j,c=i*cols+(j+1)%cols,d=(i+1)*cols+(j+1)%cols;indices.push(a,b,c,c,b,d);}const pole=positions.length/3;positions.push(center.x,top+.002,center.z);uv.push(.5,0);const crown=new T.Color(0x34271e);colors.push(crown.r,crown.g,crown.b);for(let j=0;j<cols;j++)indices.push(pole,j,(j+1)%cols);
            const scalp=new T.BufferGeometry();scalp.setAttribute('position',new T.Float32BufferAttribute(positions,3));scalp.setAttribute('normal',new T.Float32BufferAttribute(new Float32Array(positions.length),3));scalp.setAttribute('uv',new T.Float32BufferAttribute(uv,2));scalp.setAttribute('color',new T.Float32BufferAttribute(colors,3));scalp.setIndex(indices);scalp.addGroup(0,indices.length,0);scalp.computeVertexNormals();scalp.computeBoundingBox();scalp.computeBoundingSphere();const hair=new T.MeshStandardMaterial({color:0xffffff,vertexColors:true,roughness:.88});add(T,u.headP,scalp,[hair],'jason-fitted-short-hair');
            if(!refineJasonReference.weave){const n=128,data=new Uint8Array(n*n*4);for(let y=0;y<n;y++)for(let x=0;x<n;x++){const c=128+((x*31+y*17+x*y)%9)-4+((x+y)%5===0?5:0),i=(y*n+x)*4;data[i]=data[i+1]=data[i+2]=c;data[i+3]=255;}const t=new T.DataTexture(data,n,n,T.RGBAFormat);t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(4,4);t.magFilter=t.minFilter=T.LinearFilter;t.needsUpdate=true;refineJasonReference.weave=t;}
            m.shirt.bumpMap=refineJasonReference.weave;m.shirt.bumpScale=.00010;m.shirt.needsUpdate=true;m.pants.bumpMap=refineJasonReference.weave;m.pants.bumpScale=.00017;m.pants.needsUpdate=true;
            for(let k=0;k<u.Lg.length;k++){const side=k===0?-1:1,hp=u.Lg[k].hp;add(T,hp,new T.BoxGeometry(.022,.095,.105),m.pants,'jason-cargo-pocket',side*.092,-.18,0);add(T,hp,new T.BoxGeometry(.026,.018,.112),m.pants,'jason-cargo-pocket-flap',side*.094,-.132,0);}
            for(const joint of [u.hips,...u.Lg.flatMap(l=>[l.hp,l.kn])])for(const o of joint.children)if(o.isMesh&&o.material===m.pants)smooth(o);
            if(!refineJasonReference.print){const n=256,data=new Uint8Array(n*n*4),font={L:['10000','10000','10000','10000','10000','10000','11111'],E:['11111','10000','10000','11110','10000','10000','11111'],O:['01110','10001','10001','10001','10001','10001','01110'],N:['10001','11001','10101','10011','10001','10001','10001'],I:['11111','00100','00100','00100','00100','00100','11111'],D:['11110','10001','10001','10001','10001','10001','11110'],A:['01110','10001','10001','11111','10001','10001','10001']};const put=(x,y,c)=>{if(x<0||x>=n||y<0||y>=n)return;const i=(y*n+x)*4;data[i]=c[0];data[i+1]=c[1];data[i+2]=c[2];data[i+3]=255;};for(let y=70;y<204;y++)for(let x=38;x<218;x++){if(Math.abs(y-(88+8*Math.sin(x*.045)))<5)put(x,y,[87,144,158]);if(Math.pow((x-122)/66,2)+Math.pow((y-110)/7,2)<1)put(x,y,[211,174,107]);if(Math.pow((x-128)/45,2)+Math.pow((y-151)/32,2)<1)put(x,y,[155,164,149]);if(Math.pow((x-160)/23,2)+Math.pow((y-166)/19,2)<1)put(x,y,[168,174,157]);if((x-165)**2+(y-172)**2<6)put(x,y,[40,47,43]);}const word='LEONIDA';for(let k=0;k<word.length;k++)for(let y=0;y<7;y++)for(let x=0;x<5;x++)if(font[word[k]][y][x]==='1')for(let yy=0;yy<4;yy++)for(let xx=0;xx<4;xx++)put(44+k*24+x*4+xx,25+(6-y)*4+yy,k%2?[216,139,155]:[224,187,101]);const t=new T.DataTexture(data,n,n,T.RGBAFormat);t.magFilter=T.LinearFilter;t.minFilter=T.LinearMipmapLinearFilter;t.generateMipmaps=true;t.encoding=T.sRGBEncoding;t.needsUpdate=true;refineJasonReference.print=t;}
            const graphic=u.spine.children.find(o=>o.name==='jason-reference-shirt-graphic');if(!graphic)throw Error('Missing Jason tee graphic');graphic.material.map=refineJasonReference.print;graphic.material.needsUpdate=true;
            u.jasonReferenceRefined=true;
           }
          '''
          marker=' function jason(T,h){'
          if s.count(marker)!=1: raise SystemExit('Jason helper boundary changed.')
          s=s.replace(marker,helper+marker,1);Path('/tmp/jason-reference-after.js').write_text(s)
          subprocess.run(['node','--check','/tmp/jason-reference-after.js'],check=True)
          PY
      - name: Verify Jason update Lucia preservation and rig safety
        run: |
          node <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert'),T=require(process.env.RUNNER_TEMP+'/jason-reference/node_modules/three');
          function load(p){const c={window:{},console,Math};vm.createContext(c);vm.runInContext(fs.readFileSync('js/characters.js','utf8'),c);vm.runInContext(fs.readFileSync(p,'utf8'),c);return c.window.VCCharacters;}
          const old=load('/tmp/jason-reference-before.js'),cur=load('/tmp/jason-reference-after.js');assert(JSON.stringify(old.DESIGNS.luciaC)===JSON.stringify(cur.DESIGNS.luciaC));
          function signature(h){const out=[];h.traverse(o=>{if(!o.isMesh)return;out.push([o.name,o.position.toArray(),o.scale.toArray(),Array.from(o.geometry.attributes.position.array),...(Array.isArray(o.material)?o.material:[o.material]).map(m=>m.color?m.color.getHex():null)]);});return JSON.stringify(out);}
          for(const merge of [false,true])assert(signature(old.build(T,'luciaC',{merge}))===signature(cur.build(T,'luciaC',{merge})),'Lucia changed');
          const a=old.build(T,'jasonC'),b=cur.build(T,'jasonC'),rig=u=>[u.hips.position.toArray(),u.spine.position.toArray(),u.headP.position.toArray(),...u.A.flatMap(a=>[a.sh.position.toArray(),a.el.position.toArray()]),...u.Lg.flatMap(l=>[l.hp.position.toArray(),l.kn.position.toArray()])];assert(JSON.stringify(rig(a.userData))===JSON.stringify(rig(b.userData)));assert(b.userData.m.skin.color.getHex()===0xc59778);assert(b.getObjectByName('jason-fitted-short-hair'));assert(b.getObjectByName('jason-cargo-pocket'));assert(b.getObjectByName('jason-reference-shirt-graphic'));assert(b.getObjectByName('jason-light-stubble'));
          for(const merge of [false,true]){const h=cur.build(T,'jasonC',{merge}),u=h.userData;assert(u.jasonReferenceRefined&&u.faceUncovered&&u.guns.pistol&&u.guns.rifle);assert(h.getObjectByName('jason-fitted-short-hair').geometry.attributes.color);for(const angle of [-.7,0,.7]){u.A[0].sh.rotation.x=angle;u.A[1].el.rotation.x=-angle;u.Lg[0].hp.rotation.x=angle;u.Lg[1].kn.rotation.x=-angle;h.updateMatrixWorld(true);h.traverse(o=>{if(o.isMesh){assert(Array.from(o.geometry.attributes.position.array).every(Number.isFinite));assert(Array.from(o.geometry.attributes.normal.array).every(Number.isFinite));}});}const bounds=new T.Box3().setFromObject(h);assert(bounds.max.y-bounds.min.y<2.7);}
          fs.copyFileSync('/tmp/jason-reference-after.js','js/reference-characters.js');console.log('Jason geometry and rig checks passed; Lucia unchanged. Visual likeness and outfit appearance require in-game review.');
          JS
      - name: Commit Jason only after checks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add js/reference-characters.js
          git diff --cached --quiet && exit 0
          git commit -m 'Refine Jason face fitted short hair stubble natural tan athletic build and graphic cargo outfit'
          git push origin HEAD:main
