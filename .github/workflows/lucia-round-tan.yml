name: Lucia rounder contour and warmer tan
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lucia-round-tan.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lucia-round-tan
  cancel-in-progress: false
jobs:
  contour:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install matching Three.js for model tests
        timeout-minutes: 2
        continue-on-error: true
        run: npm install --prefix "$RUNNER_TEMP/lucia-round-check" --no-package-lock --ignore-scripts three@0.128.0
      - name: Refine contour and tan and validate models
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json, subprocess, tempfile
          p=Path('js/reference-characters.js');original=p.read_text(encoding='utf-8');s=original;q=Path('index.html');game=q.read_text(encoding='utf-8');report={'ok':False}
          try:
              if '// LUCIA_ROUND_TAN_V1' in s: raise RuntimeError('Rounded contour and tan already applied.')
              changes=[('skin:0xb9784e','skin:0xa86b43'),('chest=Math.exp(-Math.pow((y-.375)/.065,2))','chest=Math.exp(-Math.pow((y-.375)/.080,2))'),('xScale=1-.07*waist+.07*chest;','xScale=1-.07*waist+.17*chest;'),('lobes=Math.min(1,(Math.exp(-Math.pow((v.x-.065)/.065,2))+Math.exp(-Math.pow((v.x+.065)/.065,2)))/1.02)','lobes=Math.min(1,(Math.exp(-Math.pow((v.x-.070)/.075,2))+Math.exp(-Math.pow((v.x+.070)/.075,2)))/1.04)'),('old=mesh.geometry,g=old.clone(),a=g.attributes.position','old=mesh.geometry,g=roundLuciaGeometry(T,mesh,old,region,u),a=g.attributes.position'),('a.needsUpdate=true;g.computeVertexNormals();g.computeBoundingSphere();','a.needsUpdate=true;g.computeVertexNormals();smoothLuciaSeam(T,g);g.computeBoundingSphere();')]
              helpers=" function roundLuciaGeometry(T,mesh,old,region,u){\n  const p=old.parameters;\n  if(region!=='spine'||(mesh.material!==u.m.skin&&mesh.material!==u.m.shirt)||!p||!p.points||p.points.length<2)return old.clone();\n  const points=[];for(let i=0;i<p.points.length-1;i++){const a=p.points[i],b=p.points[i+1],n=Math.max(1,Math.ceil(Math.abs(b.y-a.y)/.0125));for(let j=0;j<n;j++){const t=j/n;points.push(new T.Vector2(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t))}}const last=p.points[p.points.length-1];points.push(new T.Vector2(last.x,last.y));\n  return new T.LatheGeometry(points,Math.max(40,p.segments||0),p.phiStart||0,p.phiLength===undefined?Math.PI*2:p.phiLength);\n }\n function smoothLuciaSeam(T,g){const p=g.parameters;if(!p||!p.points||Math.abs(p.phiLength-Math.PI*2)>.00001)return;const normals=g.attributes.normal,rows=p.points.length,offset=p.segments*rows,v=new T.Vector3();for(let i=0;i<rows;i++){v.set(normals.getX(i)+normals.getX(offset+i),normals.getY(i)+normals.getY(offset+i),normals.getZ(i)+normals.getZ(offset+i)).normalize();normals.setXYZ(i,v.x,v.y,v.z);normals.setXYZ(offset+i,v.x,v.y,v.z)}normals.needsUpdate=true}\n"
              test="const fs=require('fs'),vm=require('vm'),assert=require('assert'),T=require(process.env.RUNNER_TEMP+'/lucia-round-check/node_modules/three');function load(path){const box={window:{},console,Math};vm.createContext(box);vm.runInContext(fs.readFileSync('js/characters.js','utf8'),box);vm.runInContext(fs.readFileSync(path,'utf8'),box);return box.window.VCCharacters}const before=load(process.argv[1]),after=load(process.argv[2]);function sig(h,colors=true){const a=[];h.traverse(o=>{if(o.isMesh)a.push([o.name,Array.from(o.geometry.attributes.position.array),...(colors?(Array.isArray(o.material)?o.material:[o.material]).map(m=>m.color?m.color.getHex():null):[])])});return JSON.stringify(a)}function direct(h){return JSON.stringify(h.children.filter(o=>o.isMesh).map(o=>[o.name,Array.from(o.geometry.attributes.position.array)]))}for(const id of Object.keys(before.DESIGNS))if(id!=='luciaC')assert(sig(before.build(T,id))===sig(after.build(T,id)));\nconst old=before.build(T,'luciaC'),h=after.build(T,'luciaC'),b=old.userData,u=h.userData;assert(u.m.skin.color.getHex()===0xa86b43&&after.DESIGNS.luciaC.skin===0xa86b43);assert(sig(b.headP,false)===sig(u.headP,false));assert(direct(b.hips)===direct(u.hips));for(let i=0;i<2;i++)assert(direct(b.Lg[i].hp)===direct(u.Lg[i].hp));const tank=h.getObjectByName('lucia-dark-tank-top'),oldTank=old.getObjectByName('lucia-dark-tank-top');assert(tank&&u.m.shirt.color.getHex()===0x303338&&tank.geometry.parameters.segments>=40&&tank.geometry.attributes.position.count>oldTank.geometry.attributes.position.count);\nconst pick=r=>r.spine.children.find(o=>o.isMesh&&o.material===r.m.skin&&o.geometry.attributes.position);function measure(mesh){mesh.updateMatrix();const a=mesh.geometry.attributes.position,v=new T.Vector3();let lo=Infinity,hi=-Infinity,front=-Infinity;for(let i=0;i<a.count;i++){v.fromBufferAttribute(a,i).applyMatrix4(mesh.matrix);if(v.y>=.30&&v.y<=.44){lo=Math.min(lo,v.x);hi=Math.max(hi,v.x);front=Math.max(front,v.z)}}assert(Number.isFinite(lo+hi+front));return{width:hi-lo,front}}const prev=measure(pick(b)),next=measure(pick(u));assert(next.width>prev.width*1.06&&next.front>=prev.front-.005);assert(measure(tank).front>=next.front-.008);\nconst joints=r=>[r.hips.position.toArray(),r.spine.position.toArray(),r.headP.position.toArray(),...r.A.flatMap(x=>[x.sh.position.toArray(),x.el.position.toArray()]),...r.Lg.flatMap(x=>[x.hp.position.toArray(),x.kn.position.toArray()])];assert(JSON.stringify(joints(b))===JSON.stringify(joints(u)));for(const merge of[false,true]){const model=after.build(T,'luciaC',{merge}),r=model.userData;r.A[0].sh.rotation.x=.6;r.A[1].el.rotation.x=1;r.Lg[0].hp.rotation.x=-.5;r.Lg[1].kn.rotation.x=.7;model.updateMatrixWorld(true);assert(r.guns.pistol&&r.guns.rifle);model.traverse(o=>{if(o.isMesh)for(const key of['position','normal','uv'])if(o.geometry.attributes[key])assert(Array.from(o.geometry.attributes[key].array).every(Number.isFinite))})}console.log(JSON.stringify({rounder_denser_contour:true,bust_width_increased:true,forward_projection_retained:true,warmer_tan_skin:true,tank_refitted:true,lower_body_preserved:true,face_and_hair_geometry_preserved:true,animation_joints_preserved:true,other_characters_unchanged:true,merged_model_valid:true,finite_geometry:true,chest_measurements:{previous:prev,revised:next}}));"
              for old,new in changes:
                  if s.count(old)!=1: raise RuntimeError('Current model changed; refusing an ambiguous edit: '+old[:100])
                  s=s.replace(old,new,1)
              marker=' function shapeLucia(T,h){'
              if s.count(marker)!=1: raise RuntimeError('Cannot uniquely locate the shaping helper.')
              s=s.replace(marker,helpers+marker,1);s='// LUCIA_ROUND_TAN_V1'+chr(10)+s
              game,count=re.subn(r"(lucia:\{name:'LUCIA',[^\n]*?skin:)0xb9784e",r'\g<1>0xa86b43',game)
              if count!=1: raise RuntimeError('Lucia default skin setting changed.')
              with tempfile.TemporaryDirectory() as d:
                  a=Path(d)/'before.js';b=Path(d)/'after.js';a.write_text(original);b.write_text(s)
                  subprocess.run(['node','--check',str(b)],check=True,capture_output=True,timeout=30)
                  result=subprocess.run(['node','-e',test,str(a),str(b)],check=True,capture_output=True,text=True,timeout=90);report.update(json.loads(result.stdout))
                  checked=0
                  for js in re.findall(r'<script\b[^>]*>([\s\S]*?)</script>',game,re.I):
                      if not js.strip(): continue
                      path=Path(d)/'game.js';path.write_text(js);subprocess.run(['node','--check',str(path)],check=True,capture_output=True,timeout=30);checked+=1
                  if not checked: raise RuntimeError('No inline scripts found.')
              p.write_text(s,encoding='utf-8');q.write_text(game,encoding='utf-8');report.update(ok=True,checked_scripts=checked,scope='Lucia-only rounder, wider covered bust contour and warmer tan; lower-body shape and gameplay unchanged')
          except Exception as exc:
              report['error']=str(exc)
              if isinstance(exc,subprocess.CalledProcessError): report['stderr']=(exc.stderr.decode(errors='replace') if isinstance(exc.stderr,bytes) else str(exc.stderr or ''))[-3000:]
          Path('status').mkdir(exist_ok=True)
          Path('status/lucia-round-tan.json').write_text(json.dumps(report,indent=2)+chr(10),encoding='utf-8')
          print(json.dumps(report))
          PY
      - name: Commit validated contour or diagnostic report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- js/reference-characters.js index.html status/lucia-round-tan.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Round and widen Lucia contour and warm her tan'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Require successful model update
        run: node -e "if(!require('./status/lucia-round-tan.json').ok)process.exit(1)"
