name: Add fitted opaque black briefs without altering Lucia body or bra
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lucia-fitted-briefs.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lucia-photo-reference
  cancel-in-progress: false
jobs:
  garment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --prefix "$RUNNER_TEMP/lucia-briefs" --no-package-lock --ignore-scripts three@0.128.0 acorn@8
      - name: Prepare lower body garment using current body profiles and existing skeleton
        run: |
          node <<'JS'
          const fs=require('fs'),acorn=require(process.env.RUNNER_TEMP+'/lucia-briefs/node_modules/acorn');let s=fs.readFileSync('js/reference-characters.js','utf8');if(s.includes('// LUCIA_FITTED_BRIEFS_V1'))process.exit(0);if(!s.includes('// LUCIA_BRA_FRONT_REFINEMENT_V3'))throw Error('Approved current bra required');fs.writeFileSync('/tmp/lucia-briefs-before.js',s);function walk(n,fn){fn(n);for(const v of Object.values(n)){if(Array.isArray(v)){for(const x of v)if(x&&typeof x.type==='string')walk(x,fn);}else if(v&&typeof v.type==='string')walk(v,fn);}}const matches=[];walk(acorn.parse(s,{ecmaVersion:'latest'}),n=>{if(n.type==='FunctionDeclaration'&&n.id&&n.id.name==='lucia')matches.push(n);});if(matches.length!==1)throw Error('Lucia builder changed');const node=matches[0];
          const helper=String.raw`
           function addLuciaFittedBriefs(T,h){
            const u=h.userData;if(u.luciaFittedBriefs)return;const bridge=h.getObjectByName('lucia-pelvis-skin-bridge');if(!bridge||!bridge.isSkinnedMesh||bridge.skeleton.bones.length!==4||!u.luciaFittedBraMaterial)throw Error('Reviewed pelvis rig or bra material missing');h.updateMatrixWorld(true);const inverse=new T.Matrix4().copy(u.hips.matrixWorld).invert(),triangles=[];h.traverse(o=>{if(!o.isMesh||!(o===bridge||(o.material===u.m.skin&&(o.parent===u.spine||o.parent===u.hips||u.Lg.some(l=>o.parent===l.hp)))))return;const g=o.geometry,p=g.attributes.position,M=inverse.clone().multiply(o.matrixWorld),points=[];for(let i=0;i<p.count;i++)points.push(new T.Vector3().fromBufferAttribute(p,i).applyMatrix4(M).toArray());const count=g.index?g.index.count:p.count;for(let i=0;i<count;i+=3){const tri=[0,1,2].map(j=>points[g.index?g.index.getX(i+j):i+j]);if(Math.min(...tri.map(p=>p[1]))<=.081&&Math.max(...tri.map(p=>p[1]))>=-.206)triangles.push(tri);}});
            const profiles=[],lo=-.205,hi=.080,steps=112;for(let row=0;row<=steps;row++){const y=lo+(hi-lo)*row/steps,segments=[];let width=0;for(const tri of triangles){const hits=[];for(let j=0;j<3;j++){const a=tri[j],b=tri[(j+1)%3],dy=b[1]-a[1];if(Math.abs(dy)<1e-10)continue;const t=(y-a[1])/dy;if(t>=0&&t<=1)hits.push([a[0]+(b[0]-a[0])*t,a[2]+(b[2]-a[2])*t]);}let pair=null,length=0;for(let a=0;a<hits.length;a++)for(let b=a+1;b<hits.length;b++){const d=Math.hypot(hits[a][0]-hits[b][0],hits[a][1]-hits[b][1]);if(d>length){length=d;pair=[...hits[a],...hits[b]];}}if(pair&&length>1e-8){segments.push(pair);width=Math.max(width,Math.abs(pair[0]),Math.abs(pair[2]));}}if(width<.05||!segments.length)throw Error('Missing fitted hip profile');profiles.push({width,segments});}
            function section(profile,u){const x=u*.98*profile.width;let low=Infinity,high=-Infinity;for(const a of profile.segments){const dx=a[2]-a[0];if(Math.abs(dx)<1e-10){if(Math.abs(x-a[0])<1e-6){low=Math.min(low,a[1],a[3]);high=Math.max(high,a[1],a[3]);}continue;}const t=(x-a[0])/dx;if(t>=-1e-6&&t<=1+1e-6){const z=a[1]+(a[3]-a[1])*t;low=Math.min(low,z);high=Math.max(high,z);}}if(!Number.isFinite(low)||!Number.isFinite(high)||high<=low)throw Error('Incomplete garment fitting section');return {x,low,high};}
            const cols=48,rows=24,positions=[],weights=[],boneIndices=[],indices=[],hipToRoot=new T.Matrix4().copy(h.matrixWorld).invert().multiply(u.hips.matrixWorld),smooth=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t);};for(let side=0;side<2;side++)for(let j=0;j<=rows;j++)for(let i=0;i<=cols;i++){const t=i/cols*2-1,bottom=-.200+.180*Math.pow(Math.abs(t),1.3),y=.065+(bottom-.065)*j/rows,f=(y-lo)/(hi-lo)*steps,k=Math.max(0,Math.min(steps-1,Math.floor(f))),blend=f-k,a=section(profiles[k],t),b=section(profiles[k+1],t),x=a.x+(b.x-a.x)*blend,z=side===0?a.high+(b.high-a.high)*blend+.004:a.low+(b.low-a.low)*blend-.004,v=new T.Vector3(x,y,z).applyMatrix4(hipToRoot);positions.push(v.x,v.y,v.z);const spine=smooth((y-.010)/.105),legs=(1-spine)*(.30+.65*smooth((Math.abs(x)-.100)/.100))*smooth(-y/.110),right=smooth((x+.065)/.130);boneIndices.push(0,1,2,3);weights.push(1-spine-legs,spine,legs*(1-right),legs*right);}
            const perSide=(cols+1)*(rows+1),at=(side,j,i)=>side*perSide+j*(cols+1)+i;for(let side=0;side<2;side++)for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const a=at(side,j,i),b=at(side,j,i+1),c=at(side,j+1,i),d=at(side,j+1,i+1);if(side===0)indices.push(a,c,b,b,c,d);else indices.push(a,b,c,b,d,c);}for(let j=0;j<rows;j++){let a=at(0,j,0),b=at(1,j,0),c=at(0,j+1,0),d=at(1,j+1,0);indices.push(a,b,c,b,d,c);a=at(0,j,cols);b=at(1,j,cols);c=at(0,j+1,cols);d=at(1,j+1,cols);indices.push(a,c,b,b,c,d);}for(let i=21;i<27;i++){const a=at(0,rows,i),b=at(1,rows,i),c=at(0,rows,i+1),d=at(1,rows,i+1);indices.push(a,b,c,c,b,d);}
            const geometry=new T.BufferGeometry();geometry.setAttribute('position',new T.Float32BufferAttribute(positions,3));geometry.setAttribute('skinIndex',new T.Uint16BufferAttribute(boneIndices,4));geometry.setAttribute('skinWeight',new T.Float32BufferAttribute(weights,4));geometry.setIndex(indices);geometry.computeVertexNormals();geometry.computeBoundingBox();geometry.computeBoundingSphere();const material=u.luciaFittedBraMaterial.clone();material.skinning=true;material.side=T.DoubleSide;material.transparent=false;material.opacity=1;material.needsUpdate=true;const mesh=new T.SkinnedMesh(geometry,material);mesh.name='lucia-fitted-black-briefs';mesh.castShadow=true;mesh.receiveShadow=true;mesh.frustumCulled=false;h.add(mesh);mesh.bind(bridge.skeleton,bridge.bindMatrix);mesh.onBeforeRender=bridge.onBeforeRender;mesh.onBeforeRender();u.luciaFittedBriefs=true;
           }
          `;s=s.slice(0,node.body.end-1)+'\n addLuciaFittedBriefs(T,h);\n'+s.slice(node.body.end-1);s=s.slice(0,node.start)+helper+s.slice(node.start);s='// LUCIA_FITTED_BRIEFS_V1\n'+s;acorn.parse(s,{ecmaVersion:'latest'});fs.writeFileSync('/tmp/lucia-briefs-after.js',s);
          JS
      - name: Verify three garment openings coverage and preserved body bra and rig
        run: |
          node <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert'),T=require(process.env.RUNNER_TEMP+'/lucia-briefs/node_modules/three');if(!fs.existsSync('/tmp/lucia-briefs-after.js')){if(fs.readFileSync('js/reference-characters.js','utf8').includes('// LUCIA_FITTED_BRIEFS_V1'))process.exit(0);throw Error('Candidate missing');}function load(file){const c={window:{},console,Math};vm.createContext(c);for(const p of ['js/characters.js',file])vm.runInContext(fs.readFileSync(p,'utf8'),c);return c.window.VCCharacters;}const old=load('/tmp/lucia-briefs-before.js'),cur=load('/tmp/lucia-briefs-after.js');function signature(h){const out=[];h.traverse(o=>{if(o.name==='lucia-fitted-black-briefs')return;const row=[o.type,o.name,o.visible,o.position.toArray(),o.quaternion.toArray(),o.scale.toArray()];if(o.isMesh)row.push(Object.keys(o.geometry.attributes).sort().map(k=>[k,Array.from(o.geometry.attributes[k].array)]),o.geometry.index?Array.from(o.geometry.index.array):null,...(Array.isArray(o.material)?o.material:[o.material]).map(m=>[m.type,m.color?m.color.getHex():null,m.roughness,m.metalness,m.flatShading,m.skinning]));out.push(row);});return JSON.stringify(out);}for(const id of Object.keys(old.DESIGNS))if(id!=='luciaC')assert(signature(old.build(T,id))===signature(cur.build(T,id)),'Other character changed');const a=old.build(T,'luciaC',{merge:false}),b=cur.build(T,'luciaC',{merge:false}),u=b.userData,briefs=b.getObjectByName('lucia-fitted-black-briefs');assert(signature(a)===signature(b),'Existing body bra materials or rig changed');assert(briefs&&briefs.isSkinnedMesh&&briefs.skeleton===b.getObjectByName('lucia-pelvis-skin-bridge').skeleton&&briefs.material.color.getHex()===u.luciaFittedBraMaterial.color.getHex()&&!briefs.material.transparent&&briefs.material.opacity===1);
          const g=briefs.geometry,edges=new Map(),adj=Array.from({length:g.attributes.position.count},()=>new Set());for(let i=0;i<g.index.count;i+=3){const t=[0,1,2].map(j=>g.index.getX(i+j));for(let j=0;j<3;j++){const a=t[j],b=t[(j+1)%3],key=a<b?a+','+b:b+','+a;edges.set(key,(edges.get(key)||0)+1);adj[a].add(b);adj[b].add(a);}}assert([...edges.values()].every(n=>n===1||n===2));const visited=new Set([0]),queue=[0];while(queue.length)for(const j of adj[queue.pop()])if(!visited.has(j)){visited.add(j);queue.push(j);}assert(visited.size===adj.length,'Disconnected garment');const boundary=new Map();for(const [key,count]of edges)if(count===1){const [a,b]=key.split(',').map(Number);if(!boundary.has(a))boundary.set(a,new Set());if(!boundary.has(b))boundary.set(b,new Set());boundary.get(a).add(b);boundary.get(b).add(a);}assert([...boundary.values()].every(a=>a.size===2));const seen=new Set();let loops=0;for(const start of boundary.keys())if(!seen.has(start)){loops++;const q=[start];seen.add(start);while(q.length)for(const j of boundary.get(q.pop()))if(!seen.has(j)){seen.add(j);q.push(j);}}assert(loops===3,'Expected waist and two leg openings');const w=g.attributes.skinWeight;for(let i=0;i<w.count;i++)assert(Math.abs(w.getX(i)+w.getY(i)+w.getZ(i)+w.getW(i)-1)<1e-5);b.updateMatrixWorld(true);briefs.onBeforeRender();let rays=0;for(const side of [-1,1])for(const x of [-.07,0,.07])for(const y of [-.05,.015,.05]){const origin=new T.Vector3(x,y,side).applyMatrix4(u.hips.matrixWorld),direction=new T.Vector3(0,0,-side).transformDirection(u.hips.matrixWorld);assert(new T.Raycaster(origin,direction,0,2).intersectObject(briefs,false).length>0,'Front or back coverage missing');rays++;}
          let poses=0;for(const merge of [false,true]){const h=cur.build(T,'luciaC',{merge}),u=h.userData,m=h.getObjectByName('lucia-fitted-black-briefs');assert(m&&m.isSkinnedMesh&&u.luciaFittedBriefs&&u.luciaBraFrontRefined&&u.guns.pistol&&u.guns.rifle);for(const angle of [-.7,0,.7]){u.spine.rotation.y=angle*.2;u.Lg[0].hp.rotation.x=angle;u.Lg[1].hp.rotation.x=-angle;h.updateMatrixWorld(true);m.onBeforeRender();assert(Array.from(m.skeleton.boneMatrices).every(Number.isFinite));h.traverse(o=>{assert(o.matrixWorld.elements.every(Number.isFinite));if(o.isMesh)for(const k of ['position','normal'])if(o.geometry.attributes[k])assert(Array.from(o.geometry.attributes[k].array).every(Number.isFinite));});poses++;}}fs.copyFileSync('/tmp/lucia-briefs-after.js','js/reference-characters.js');fs.mkdirSync('status',{recursive:true});fs.writeFileSync('status/lucia-fitted-briefs-check.json',JSON.stringify({passed:true,style:'opaque black fitted briefs',boundaryLoops:loops,frontBackCoverageRays:rays,poseChecks:poses,sharesExistingPelvisSkeleton:true,bodyBraSkinToneMaterialsAndRigUnchanged:true,otherCharactersUnchanged:true,scope:'Body-section fitted garment with waistband opening, front/back panels, side joins, gusset and two leg openings. Structural tests do not verify rendered fit, gusset placement, animation clipping or live deployment.'},null,2)+'\n');
          JS
      - name: Publish only validated underwear addition
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'Main changed; rerun against latest revision.'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- js/reference-characters.js status/lucia-fitted-briefs-check.json
          git diff --cached --quiet && exit 0
          git commit -m 'Add opaque black fitted briefs preserving Lucia body bra and existing rig'
          git push origin HEAD:main
