name: Shrink home logo, buttons below
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shrink-home-logo.yml'
permissions:
  contents: write
concurrency:
  group: shrink-home-logo
  cancel-in-progress: true
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Smaller logo + buttons directly under it
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          new_css = '''
          /* ===== VC3D Homescreen (GTA VI–inspired) ===== */
          #overlay{background:radial-gradient(ellipse at 50% 30%,#3a1548cc 0%,#0a0e1cf2 55%,#050810f5 100%)}
          .home-card{width:min(420px,90vw);max-width:420px;padding:22px 22px 24px;background:linear-gradient(165deg,#0d1526f5 0%,#121f35f2 40%,#0a1220f8 100%);border:1px solid #ff4f9a44;border-radius:20px;box-shadow:0 28px 90px #000c,0 0 0 1px #ffffff08,inset 0 1px 0 #ffffff12;text-align:center;position:relative;overflow:hidden}
          .home-card:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,#ff2d88,#ffd23a,#48e0d1,#ff2d88);background-size:200% 100%;animation:homeShimmer 6s linear infinite}
          @keyframes homeShimmer{0%{background-position:0% 0}100%{background-position:200% 0}}
          .home-logo-wrap{position:relative;width:min(280px,72%);margin:4px auto 14px;aspect-ratio:1200/640;max-height:120px;overflow:hidden;border-radius:12px;background:linear-gradient(180deg,#2a0a4a,#ff6b3d 70%,#1a1030);box-shadow:0 8px 24px #0007,0 0 0 1px #ffffff15}
          .home-logo-wrap img,.home-logo-wrap object{width:100%;height:100%;object-fit:cover;display:block}
          .home-logo-fade{display:none}
          .home-kicker{display:none}
          .home-title{display:none}
          .home-sub{display:none}
          .home-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0;margin:0}
          .home-btn{margin:0;min-height:68px;text-align:left;padding:12px 14px;border-radius:12px;background:linear-gradient(135deg,#e83f8c,#ff6e9f);font-size:13px;letter-spacing:1px;border:1px solid #ffffff22;box-shadow:0 6px 20px #ff4f9a33;transition:transform .12s,box-shadow .12s,filter .12s}
          .home-btn:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 10px 28px #ff4f9a55}
          .home-btn.alt{background:linear-gradient(135deg,#167e83,#27b5a7);box-shadow:0 6px 20px #27b5a733}
          .home-btn.alt:hover{box-shadow:0 10px 28px #27b5a755}
          .home-btn small{display:block;color:#fff;opacity:.82;font-size:10px;font-weight:normal;letter-spacing:0;margin-top:4px}
          .home-btn.multiplayer-soon{position:relative;opacity:.7;cursor:not-allowed;background:linear-gradient(135deg,#294c59,#426875);padding-top:22px;box-shadow:none}
          .home-btn.multiplayer-soon:after{content:'COMING SOON';position:absolute;top:6px;right:7px;padding:3px 6px;border-radius:4px;background:#ffd23a;color:#17232b;font-size:8px;font-weight:900;letter-spacing:1px;box-shadow:0 2px 8px #0005}
          .home-btn.multiplayer-soon:hover{filter:none;transform:none;background:linear-gradient(135deg,#294c59,#426875);box-shadow:none}
          .continue-btn{grid-column:1/-1;min-height:44px;text-align:center;background:linear-gradient(135deg,#2c4a73,#3a5f94);box-shadow:0 4px 16px #0005}
          .home-status{margin:14px 0 0;color:#b8d3df;min-height:16px;font-size:11px}
          .home-foot{border-top:1px solid #ffffff14;margin:14px 0 0;padding-top:10px;color:#7a96a8;font-size:10px;letter-spacing:.3px}
          @media(max-width:560px){
            .home-card{padding:18px 16px 20px;width:min(360px,92vw)}
            .home-logo-wrap{max-height:100px;width:min(240px,70%)}
            .home-actions{grid-template-columns:1fr}
            .home-btn{min-height:58px}
            .continue-btn{grid-column:auto}
          }
          /* ===== end homescreen ===== */
          '''

          if 'VC3D Homescreen' in s:
              s2, n = re.subn(
                  r'/\* ===== VC3D Homescreen[\s\S]*?/\* ===== end homescreen ===== \*/',
                  new_css.strip(),
                  s,
                  count=1,
              )
              if n != 1:
                  raise SystemExit('Failed to replace homescreen CSS block')
              s = s2
              print('Replaced homescreen CSS')
          else:
              raise SystemExit('Homescreen CSS marker not found — run redesign workflow first')

          new_home = (
              '<div id="overlay"><div class="card home-card">'
              '<div class="home-logo-wrap">'
              '<img src="/assets/vc3d-logo.svg" alt="Vice City 3D" width="1200" height="640" draggable="false">'
              '<div class="home-logo-fade"></div>'
              '</div>'
              '<div class="home-kicker">Welcome to the coast</div>'
              '<h1 class="home-title">VICE CITY <span>3D</span></h1>'
              '<p class="home-sub">A living neon coastal city.</p>'
              '<div class="home-actions">'
              '<button id="start" class="home-btn">SINGLEPLAYER <small>Play your own save</small></button>'
              '<button id="multiplayerOpen" class="home-btn alt multiplayer-soon" type="button" disabled '
              'aria-label="Multiplayer — Coming Soon">'
              'MULTIPLAYER <small>Online play is in development</small></button>'
              '<button id="cont" class="home-btn continue-btn" style="display:none">CONTINUE SAVED GAME</button>'
              '</div>'
              '<div id="loadmsg" class="home-status"><small>Generating Vice City…</small></div>'
              '<div class="home-foot">WASD to move · Mouse to look · Desktop Chrome recommended</div>'
              '</div></div>'
          )

          old_home_re = re.compile(r'<div id="overlay">[\s\S]*?</div></div></div>', re.M)
          s2, n = old_home_re.subn(new_home, s, count=1)
          if n != 1:
              raise SystemExit(f'Could not replace overlay HTML (matches={n})')
          s = s2
          print('Updated homescreen HTML')

          if 'home-logo-wrap' not in s:
              raise SystemExit('logo wrap missing')

          p.write_text(s, encoding='utf-8')
          print(f'Done ({p.stat().st_size} bytes)')
          PY

      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'UI: smaller VC3D logo with Singleplayer/Multiplayer buttons directly below'
          git push origin HEAD:main
