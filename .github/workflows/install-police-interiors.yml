name: Install police station interiors
on:
  push:
    branches: [main]
    paths: ['js/police-interiors.js', '.github/workflows/install-police-interiors.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --prefix "$RUNNER_TEMP/vc-police" --no-package-lock --ignore-scripts acorn@8
      - name: Integrate native interiors and check walking routes
        run: |
          node <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert'),acorn=require(process.env.RUNNER_TEMP+'/vc-police/node_modules/acorn'),htmlFile='index.html',liquorFile='js/liquor-stores.js',html=fs.readFileSync(htmlFile,'utf8'),liquor=fs.readFileSync(liquorFile,'utf8'),moduleCode=fs.readFileSync('js/police-interiors.js','utf8'),status='status/police-interiors-check.json',report={passed:false,scope:'Syntax, real furniture collision route checks, registration and interaction unit tests. Browser rendering, placement, live deployment and gameplay remain unverified.'};
          function walk(n,f){f(n);for(const v of Object.values(n)){if(Array.isArray(v)){for(const x of v)if(x&&typeof x.type==='string')walk(x,f);}else if(v&&typeof v.type==='string')walk(v,f);}}
          function once(text,a,b){assert(text.split(a).length===2,'Missing or ambiguous integration point: '+a);return text.replace(a,b);}
          try{
           acorn.parse(moduleCode,{ecmaVersion:'latest'});let next=html,nextLiquor=liquor;assert(!html.includes('js/police-interiors.js'),'Police interiors already integrated');const loader=/<script\b[^>]*\bsrc=["'](?:\.\/)?js\/liquor-stores\.js(?:\?[^"']*)?["'][^>]*>[\s\S]*?<\/script>/g;const tags=[...html.matchAll(loader)];assert(tags.length===1,'Liquor add-on loader not uniquely resolved');next=next.slice(0,tags[0].index)+'<script src="js/police-interiors.js"></script>\n'+next.slice(tags[0].index);
           const scripts=[...next.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)].filter(m=>m[1].includes('function buildInterior('));assert(scripts.length===1);const s=scripts[0],ast=acorn.parse(s[1],{ecmaVersion:'latest'});let interior;walk(ast,n=>{if(n.type==='FunctionDeclaration'&&n.id.name==='buildInterior'){assert(!interior);interior=n;}});assert(interior);const old=s[1].slice(interior.start,interior.end);let patched=once(old,"safe:'#e6dfd0'","safe:'#e6dfd0',police:'#c5cdd1'");patched=once(patched,'safe:0xe6dfd0','safe:0xe6dfd0,police:0xc5cdd1');patched=once(patched,'safe:0xffffff','safe:0xffffff,police:0x21354b');patched=once(patched,'else floorMap=woodTex(5);',"else if(kind==='police')floorMap=checkerTex('#c9ced0','#b5bec4',8);else floorMap=woodTex(5);");patched=once(patched,'else{ // safehouse',"else if(kind==='police'){window.VCPolice.furnishInterior({T,g,bx,col,sign,M,cyl,o,clerk,makeHuman});}\n else{ // safehouse");const body=s[1].slice(0,interior.start)+patched+s[1].slice(interior.end),offset=s.index+s[0].indexOf(s[1]);next=next.slice(0,offset)+body+next.slice(offset+s[1].length);
           let install;walk(acorn.parse(liquor,{ecmaVersion:'latest'}),n=>{if(n.type==='FunctionDeclaration'&&n.id.name==='install')install=n;});assert(install);nextLiquor=liquor.slice(0,install.body.end-1)+'\nwindow.VCPolice.install(a);\n'+liquor.slice(install.body.end-1);acorn.parse(nextLiquor,{ecmaVersion:'latest'});for(const script of next.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi))if(script[1].trim())acorn.parse(script[1],{ecmaVersion:'latest'});
           const cols=[],point=()=>({set(){}}),human=()=>({position:point(),rotation:{},userData:{}}),o={cx:6000,cz:0,kind:'police',exit:{x:6000,z:6}},sandbox={addEventListener(){}};sandbox.window=sandbox;vm.createContext(sandbox);vm.runInContext(moduleCode,sandbox);const p={g:{add(){}},bx:()=>({rotation:{},position:point()}),col:(w,d,x,z,h)=>cols.push({x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2,h}),sign(){},M:()=>({}),o,clerk:human(),makeHuman:human};sandbox.VCPolice.furnishInterior(p);assert(o.police.cellsLocked&&o.police.rooms.length===4&&o.police.staff.length===3);const free=(x,z)=>Math.abs(x)<=9.3&&Math.abs(z)<=6.3&&!cols.some(b=>x+.42>b.x0&&x-.42<b.x1&&z+.42>b.z0&&z-.42<b.z1);function route(tx,tz){const start=[0,18],q=[start],seen=new Set(['0,18']);for(let i=0;i<q.length;i++){const [x,z]=q[i];if(Math.hypot(x*.25-tx,z*.25-tz)<.4)return true;for(const [dx,dz]of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,nz=z+dz,k=nx+','+nz;if(!seen.has(k)&&free(nx*.25,nz*.25)){seen.add(k);q.push([nx,nz]);}}}return false;}const routes={reception:route(-5,4.3),offices:route(-3,-5.6),dispatch:route(-3,-1),holdingCorridor:route(1.3,-3),exit:route(0,6)};assert(Object.values(routes).every(Boolean),'Furniture blocks a walking route: '+JSON.stringify(routes));assert(!free(2.8,-3),'Cell barrier has no collision');
           const a={INTKINDS:[],SHOP_NAMES:{},G:{state:'play'},pl:{alive:true,wanted:3,crime:22,x:5995,z:4.3,inside:{o}},hooks:{forceShopDoors(){},simulate(){}},doors:[],roads:[],BLD:[],ensureSafeForcedShop(shop){this.doors.push({kind:shop.k,x:shop.x,z:shop.z,ret:{x:shop.x,z:shop.z+4}});},showPrompt(){},toast(){},exitInterior(){this.didExit=true;}};sandbox.VCPolice.install(a);a.hooks.forceShopDoors();assert(a.INTKINDS.includes('police')&&a.G.policeInteriors.stations.length===3&&Object.values(a.G.policeInteriors.preservation).every(Boolean));assert(sandbox.VCPolice.handleKey({key:'r'})&&sandbox.VCPolice.handleKey({key:'e'}));a.pl.x=6000;a.pl.z=6;sandbox.VCPolice.handleKey({key:'e'});assert(a.didExit&&a.pl.wanted===3&&a.pl.crime===22);
           fs.writeFileSync(htmlFile,next);fs.writeFileSync(liquorFile,nextLiquor);Object.assign(report,{passed:true,routes,stationTargets:3,holdingCellsLocked:true,registerRobberySuppressed:true,wantedAndCrimeUnchanged:true,tests:['All JavaScript parses','Real furnishing collision layout has routes to reception offices dispatch cell corridor and exit','Cell barriers collide','Three station doors register without replacing roads buildings or doors','Native exit invoked','Police interactions do not clear wanted or crime']});
          }catch(error){fs.writeFileSync(htmlFile,html);fs.writeFileSync(liquorFile,liquor);Object.assign(report,{passed:false,error:String(error),stack:error.stack,baselinePreserved:true});}
          fs.mkdirSync('status',{recursive:true});fs.writeFileSync(status,JSON.stringify(report,null,2)+'\n');
          JS
      - name: Publish tested integration or diagnostics
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'Branch changed; rerun.'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- status/police-interiors-check.json
          if node -e "if(!require('./status/police-interiors-check.json').passed)process.exit(1)"; then git add -- index.html js/liquor-stores.js; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate enterable police station interiors or record validation error'
            git push origin HEAD:refs/heads/main
          fi
          node -e "if(!require('./status/police-interiors-check.json').passed)process.exit(1)"
