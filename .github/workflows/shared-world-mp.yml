name: Shared world multiplayer UI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shared-world-mp.yml'
      - 'scripts/patch-shared-world.js'
permissions:
  contents: write
concurrency:
  group: shared-world-mp
  cancel-in-progress: true
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Patch index.html (no room codes + online count)
        run: node scripts/patch-shared-world.js

      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Client: shared world multiplayer, no room codes, live online count'
          git push origin HEAD:main
