name: Lucia 25 percent bust projection and garment refit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lucia-bust-quarter-refit.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refit:
    strategy:
      fail-fast: false
      matrix:
        target: [main, lucia-outfits]
    concurrency:
      group: lucia-u-neck-${{ matrix.target }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --prefix "$RUNNER_TEMP/lucia-quarter" --no-package-lock --ignore-scripts three@0.128.0 acorn@8
      - name: Prepare quarter projection reduction before bra and tank generation
        run: |
          node <<'JS'
          const fs=require('fs'),acorn=require(process.env.RUNNER_TEMP+'/lucia-quarter/node_modules/acorn');let s=fs.readFileSync('js/reference-characters.js','utf8');if(s.includes('// LUCIA_BUST_QUARTER_REFIT_V1'))process.exit(0);if(!s.includes('// LUCIA_HANGING_TANK_BRIDGE_V2'))throw Error('Installed bridged tank required');fs.writeFileSync('/tmp/lucia-quarter-before.js',s);const call='addLuciaTailoredBra(T,h);',declaration='function addLuciaTailoredBra(T,h){';if(s.split(call).length!==2||s.split(declaration).length!==2)throw Error('Reviewed bra fitting hook changed');const helper=String.raw`
           function fitLuciaQuarterBust(T,h){
            const u=h.userData;if(u.luciaQuarterBust)return;if(!u.luciaCenterContour||h.getObjectByName('lucia-tailored-bra'))throw Error('Torso required before bra fitting');h.updateMatrixWorld(true);const inverse=new T.Matrix4().copy(u.spine.matrixWorld).invert(),smooth=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t);};let changed=0,core=0,maxReduction=0,meshes=0;for(const mesh of u.spine.children){if(!mesh.isMesh||mesh.material!==u.m.skin)continue;const g=mesh.geometry.clone(),p=g.attributes.position,oldNormals=g.attributes.normal.clone(),M=inverse.clone().multiply(mesh.matrixWorld),back=M.clone().invert(),v=new T.Vector3(),edited=new Set(),affected=new Set();for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i).applyMatrix4(M);const weight=smooth((v.y-.275)/.045)*smooth((.490-v.y)/.045)*(1-smooth((Math.abs(v.x)-.120)/.040))*smooth((v.z-.025)/.060);if(weight<=0)continue;const reduction=.25*v.z*weight;if(reduction<=1e-8)continue;if(weight>.999999)core++;v.z-=reduction;maxReduction=Math.max(maxReduction,reduction);v.applyMatrix4(back);p.setXYZ(i,v.x,v.y,v.z);edited.add(i);affected.add(i);}if(!edited.size)continue;for(let i=0,c=g.index?g.index.count:p.count;i<c;i+=3){const tri=[0,1,2].map(j=>g.index?g.index.getX(i+j):i+j);if(tri.some(k=>edited.has(k)))for(const k of tri)affected.add(k);}p.needsUpdate=true;g.computeVertexNormals();const n=g.attributes.normal,groups=new Map();for(const i of affected){const key=[p.getX(i),p.getY(i),p.getZ(i)].map(x=>Math.round(x*1e5)).join(',');if(!groups.has(key))groups.set(key,[]);groups.get(key).push(i);}for(const ids of groups.values()){const sum=new T.Vector3();for(const i of ids)sum.add(new T.Vector3().fromBufferAttribute(n,i));sum.normalize();for(const i of ids)n.setXYZ(i,sum.x,sum.y,sum.z);}for(let i=0;i<n.count;i++)if(!affected.has(i))n.setXYZ(i,oldNormals.getX(i),oldNormals.getY(i),oldNormals.getZ(i));n.needsUpdate=true;g.computeBoundingBox();g.computeBoundingSphere();mesh.geometry=g;changed+=edited.size;meshes++;}if(changed<20||core<10||maxReduction<.020||maxReduction>.060)throw Error('Quarter reduction outside intended localized range');u.luciaQuarterBust={changedVertices:changed,coreVertices:core,meshes,maxProjectionReduction:maxReduction,coreProjectionScale:.75,scope:'25 percent less forward depth relative to the spine in the fully weighted bust region, smoothly tapered at edges. Not a claim about cup size, breast volume or whole-torso dimensions. Existing garment fitters run afterwards without changing coverage rules.'};
           }
          `;s=s.replace(call,'fitLuciaQuarterBust(T,h); '+call);s=s.replace(declaration,helper+declaration);s='// LUCIA_BUST_QUARTER_REFIT_V1\n'+s;acorn.parse(s,{ecmaVersion:'latest'});fs.writeFileSync('/tmp/lucia-quarter-after.js',s);
          JS
      - name: Verify measured reduction refitted garments and preserved lower body
        run: |
          node <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert'),T=require(process.env.RUNNER_TEMP+'/lucia-quarter/node_modules/three');if(!fs.existsSync('/tmp/lucia-quarter-after.js')){assert(fs.readFileSync('js/reference-characters.js','utf8').includes('// LUCIA_BUST_QUARTER_REFIT_V1'));process.exit(0);}function load(file){const c={window:{},console,Math};vm.createContext(c);for(const p of ['js/characters.js',file])vm.runInContext(fs.readFileSync(p,'utf8'),c);return c.window.VCCharacters;}const old=load('/tmp/lucia-quarter-before.js'),cur=load('/tmp/lucia-quarter-after.js');function sig(root){const rows=[];root.traverse(o=>{const r=[o.type,o.name,o.visible,o.position.toArray(),o.quaternion.toArray(),o.scale.toArray()];if(o.isMesh)r.push(Object.keys(o.geometry.attributes).sort().map(k=>[k,Array.from(o.geometry.attributes[k].array)]),o.geometry.index?Array.from(o.geometry.index.array):null,...(Array.isArray(o.material)?o.material:[o.material]).map(m=>[m.type,m.color?m.color.getHex():null,m.roughness,m.transparent,m.opacity]));rows.push(r);});return JSON.stringify(rows);}for(const id of Object.keys(old.DESIGNS))if(id!=='luciaC')assert(sig(old.build(T,id))===sig(cur.build(T,id)),'Other character changed');const reports=[];for(const merge of [false,true]){const a=old.build(T,'luciaC',{merge}),h=cur.build(T,'luciaC',{merge}),u=h.userData,v=a.userData;assert(u.luciaQuarterBust&&u.m.skin.color.getHex()===v.m.skin.color.getHex());h.updateMatrixWorld(true);a.updateMatrixWorld(true);const inverse=new T.Matrix4().copy(u.spine.matrixWorld).invert(),oldInverse=new T.Matrix4().copy(v.spine.matrixWorld).invert();let reduced=0,core=0;assert(u.spine.children.length===v.spine.children.length);for(let k=0;k<u.spine.children.length;k++){const mesh=u.spine.children[k],before=v.spine.children[k];if(!mesh.isMesh||mesh.material!==u.m.skin)continue;const p=mesh.geometry.attributes.position,q=before.geometry.attributes.position,M=inverse.clone().multiply(mesh.matrixWorld),oldM=oldInverse.clone().multiply(before.matrixWorld);assert(p.count===q.count);for(let i=0;i<p.count;i++){const now=new T.Vector3().fromBufferAttribute(p,i).applyMatrix4(M),was=new T.Vector3().fromBufferAttribute(q,i).applyMatrix4(oldM);assert(Math.abs(now.x-was.x)<1e-6&&Math.abs(now.y-was.y)<1e-6&&now.z<=was.z+1e-6);if(was.z-now.z>1e-7){assert(was.y>.274999&&was.y<.490001&&Math.abs(was.x)<.160001&&was.z>.025);reduced++;}if(was.y>=.320001&&was.y<=.444999&&Math.abs(was.x)<=.119999&&was.z>=.085001){assert(Math.abs(now.z-was.z*.75)<1e-6,'Core reduction not 25 percent');core++;}}}assert(reduced>20&&core>10);for(let i=0;i<2;i++){assert(sig(u.A[i].sh)===sig(v.A[i].sh),'Shoulders arms or hands changed');assert(sig(u.Lg[i].hp)===sig(v.Lg[i].hp),'Hips legs or seat changed');}for(const name of ['lucia-pelvis-skin-bridge','lucia-fitted-black-briefs'])assert(sig(h.getObjectByName(name))===sig(a.getObjectByName(name)),'Lower body or briefs changed');const bra=h.getObjectByName('lucia-tailored-bra'),body=h.getObjectByName('lucia-dark-grey-tank-top');assert(bra.visible&&h.getObjectByName('lucia-fitted-black-briefs').visible&&u.luciaTankVisible&&h.getObjectByName('lucia-dark-grey-tank-outfit').visible&&u.luciaOutfit===v.luciaOutfit);bra.traverse(o=>{if(o.isMesh)for(const m of Array.isArray(o.material)?o.material:[o.material])assert(!m.transparent&&m.opacity===1);});assert(body.material.color.getHex()===0x3b3d40&&body.material.bumpMap&&body.material.bumpScale===.00022&&!body.material.transparent&&body.material.opacity===1);for(const key of ['neckHalf','neckDepth','strapWidth','strapCenter','hem'])assert(u.luciaTankUNeck[key]===v.luciaTankUNeck[key],'Tank style changed');assert(Math.abs(u.luciaTankUNeck.neckBase-v.luciaTankUNeck.neckBase)<.004);assert(u.luciaBroadTankChest.curvature===.2&&u.luciaBroadTankChest.dipParameter===.001);function hits(human,meshes,x,y){human.updateMatrixWorld(true);const spine=human.userData.spine,inv=new T.Matrix4().copy(spine.matrixWorld).invert(),origin=new T.Vector3(x,y,1).applyMatrix4(spine.matrixWorld),direction=new T.Vector3(0,0,-1).transformDirection(spine.matrixWorld);return new T.Raycaster(origin,direction,0,3).intersectObjects(meshes,false).map(hit=>hit.point.clone().applyMatrix4(inv)).filter(q=>q.z>.025);}const under=u.spine.children.filter(o=>o.isMesh&&o.material===u.m.skin);bra.traverse(o=>{if(o.isMesh)under.push(o);});let tankReduction=0,braCoverageChecks=0;const profiles=[];for(const y of [.32,.34,.36,.38,.40]){const xs=[-.08,-.035,0,.035,.08],points=xs.map(x=>hits(h,[body],x,y)[0]);if(points.some(q=>!q))continue;const z=points.map(q=>q.z);assert(Math.max(...z)-Math.min(...z)<.005,'Bridged tank returned to cup contours');for(let j=0;j<xs.length;j++){const beneath=hits(h,under,xs[j],y)[0];if(beneath)assert(z[j]-beneath.z>.001,'Tank intersects refitted bra or skin');}const was=hits(a,[a.getObjectByName('lucia-dark-grey-tank-top')],0,y)[0];if(was)tankReduction=Math.max(tankReduction,was.z-z[2]);profiles.push({y,x:xs,z});}for(const side of [-1,1])for(const y of [.35,.39,.43]){const meshes=[];bra.traverse(o=>{if(o.isMesh)meshes.push(o);});assert(hits(h,meshes,side*.08,y).length>0,'Permanent bra cup coverage missing');braCoverageChecks++;}assert(profiles.length>=3&&tankReduction>.015,'Tank did not noticeably resize');for(const angle of [-.7,0,.7]){u.A[0].sh.rotation.x=angle;u.A[1].sh.rotation.x=-angle;u.Lg[0].hp.rotation.x=angle;u.Lg[1].hp.rotation.x=-angle;h.updateMatrixWorld(true);h.traverse(o=>{assert(o.matrixWorld.elements.every(Number.isFinite));if(o.isMesh)for(const key of ['position','normal','uv'])if(o.geometry.attributes[key])assert(Array.from(o.geometry.attributes[key].array).every(Number.isFinite));});}reports.push({merge,reducedVertices:reduced,measuredCoreVertices:core,tankProjectionReduction:tankReduction,braCoverageChecks,profiles,fit:u.luciaQuarterBust});}fs.copyFileSync('/tmp/lucia-quarter-after.js','js/reference-characters.js');fs.mkdirSync('status',{recursive:true});fs.writeFileSync('status/lucia-bust-quarter-refit-check.json',JSON.stringify({passed:true,branch:process.env.TARGET_BRANCH,reports,measuredCoreProjectionReduction:.25,braAndTankRegenerated:true,permanentCoverageRulesUnchanged:true,hipsSeatBriefsShouldersAndRigPreserved:true,midpointNecklineRibbingAndBridgePreserved:true,scope:'Localized forward-depth metric, not cup size or volume. Numerical core measurement, neutral garment rays and finite-pose checks do not verify final rendered appearance, every animation collision, alternate outfit fit or live deployment.'},null,2)+'\n');
          JS
      - name: Publish measured reduction and garment refit
        run: |
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/"$TARGET_BRANCH")" || { echo 'Branch changed; rerun against latest.'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- js/reference-characters.js status/lucia-bust-quarter-refit-check.json
          git diff --cached --quiet && exit 0
          git commit -m 'Reduce Lucia bust forward projection 25 percent locally and refit bra and bridged tank'
          git push origin HEAD:"refs/heads/$TARGET_BRANCH"
