name: Lucia textured blue jean shorts over permanent briefs
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lucia-textured-jean-shorts.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shorts:
    strategy:
      fail-fast: false
      matrix:
        target: [main, lucia-outfits]
    concurrency:
      group: lucia-u-neck-${{ matrix.target }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --prefix "$RUNNER_TEMP/lucia-jeans" --no-package-lock --ignore-scripts three@0.128.0 acorn@8
      - name: Restore animated shorts with exterior fit and woven fabric maps
        run: |
          node <<'JS'
          const fs=require('fs'),acorn=require(process.env.RUNNER_TEMP+'/lucia-jeans/node_modules/acorn');let s=fs.readFileSync('js/reference-characters.js','utf8');if(s.includes('// LUCIA_TEXTURED_JEAN_SHORTS_V1'))process.exit(0);fs.writeFileSync('/tmp/lucia-jeans-before.js',s);function once(a,b){if(s.split(a).length!==2)throw Error('Reviewed garment hook changed: '+a);s=s.replace(a,b);}once('function hideLuciaClothingOnly(T,h){',"function hideLuciaClothingOnly(T,h){ {const d=h.getObjectByName('lucia-seamless-denim');if(!d||!d.isSkinnedMesh||!d.parent)throw Error('Animated denim template missing');h.userData.luciaJeanShortsTemplate={mesh:d,parent:d.parent};}");once('addLuciaFittedBriefs(T,h);','addLuciaFittedBriefs(T,h); addLuciaTexturedJeanShorts(T,h);');const helper=String.raw`
           function luciaJeanFabricMaps(T){
            if(luciaJeanFabricMaps.cache)return luciaJeanFabricMaps.cache;const size=512,color=new Uint8Array(size*size*4),height=new Uint8Array(size*size*4),rough=new Uint8Array(size*size*4),tau=Math.PI*2,byte=x=>Math.max(0,Math.min(255,Math.round(x)));for(let y=0;y<size;y++)for(let x=0;x<size;x++){const xx=x%size,yy=y%size,twill=((xx+2*yy)%16)<12?1:-1,fiber=Math.sin(tau*xx/4)*4+Math.sin(tau*yy/8)*3,grain=((xx*73+yy*151+xx*yy*3)%23)-11,wash=8*Math.sin(tau*xx/size)*Math.cos(tau*yy/size)+4*Math.cos(2*tau*yy/size),c=byte(215+15*twill+fiber+grain*.45+wash),b=byte(128+20*twill+fiber*1.5+grain*.35),r=byte(239+grain*.3-4*twill),i=(y*size+x)*4;color[i]=byte(c-3);color[i+1]=c;color[i+2]=byte(c+4);color[i+3]=255;height[i]=height[i+1]=height[i+2]=b;height[i+3]=255;rough[i]=rough[i+1]=rough[i+2]=r;rough[i+3]=255;}function texture(data,isColor){const t=new T.DataTexture(data,size,size,T.RGBAFormat);t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(4,2);t.magFilter=T.LinearFilter;t.minFilter=T.LinearMipmapLinearFilter;t.generateMipmaps=true;t.anisotropy=4;if(isColor)t.encoding=T.sRGBEncoding;t.needsUpdate=true;return t;}return luciaJeanFabricMaps.cache={color:texture(color,true),height:texture(height,false),rough:texture(rough,false)};
           }
           function addLuciaTexturedJeanShorts(T,h){
            const u=h.userData;if(u.luciaTexturedJeanShorts)return;const saved=u.luciaJeanShortsTemplate,briefs=h.getObjectByName('lucia-fitted-black-briefs');if(!saved||!briefs||!briefs.visible)throw Error('Denim template and permanent briefs required');const mesh=saved.mesh;saved.parent.add(mesh);mesh.visible=true;h.updateMatrixWorld(true);const inverse=new T.Matrix4().copy(u.hips.matrixWorld).invert(),M=inverse.clone().multiply(mesh.matrixWorld),back=M.clone().invert(),smooth=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t);},targets=[];h.traverse(o=>{if(!o.isMesh||o===mesh||!o.visible)return;if(o===briefs||o.name==='lucia-pelvis-skin-bridge'||(o.material===u.m.skin&&(o.parent===u.spine||o.parent===u.hips||u.Lg.some(l=>o.parent===l.hp))))targets.push(o);});const centers=u.Lg.map(l=>l.hp.getWorldPosition(new T.Vector3()).applyMatrix4(inverse).x),g=mesh.geometry.clone(),p=g.attributes.position,v=new T.Vector3();let expanded=0,hitsCount=0,maxExpansion=0;for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i).applyMatrix4(M);const split=smooth((-.080-v.y)/.140),cx=(v.x<0?Math.min(...centers):Math.max(...centers))*split,center=new T.Vector3(cx,v.y,0),radial=v.clone().sub(center);radial.y=0;const radius=radial.length();if(radius<.002)continue;radial.multiplyScalar(1/radius);const origin=center.clone().addScaledVector(radial,1.5).applyMatrix4(u.hips.matrixWorld),direction=radial.clone().negate().transformDirection(u.hips.matrixWorld),hits=new T.Raycaster(origin,direction,0,1.55).intersectObjects(targets,false);if(!hits.length)continue;const point=hits[0].point.clone().applyMatrix4(inverse),bodyRadius=point.sub(center).dot(radial);if(bodyRadius<=0)continue;hitsCount++;const fitted=Math.max(radius,bodyRadius+.008),delta=fitted-radius;if(delta>.090)throw Error('Unexpected shorts expansion; inspect template');if(delta>1e-7){v.copy(center).addScaledVector(radial,fitted);v.applyMatrix4(back);p.setXYZ(i,v.x,v.y,v.z);expanded++;maxExpansion=Math.max(maxExpansion,delta);}}if(hitsCount<50)throw Error('Insufficient body-fitting samples');p.needsUpdate=true;g.computeVertexNormals();g.computeBoundingBox();g.computeBoundingSphere();const uv=g.attributes.uv;if(!uv||uv.count!==p.count)throw Error('Existing denim UV mapping required');mesh.geometry=g;const original=mesh.material,material=original.clone(),maps=luciaJeanFabricMaps(T);material.onBeforeCompile=original.onBeforeCompile;material.customProgramCacheKey=original.customProgramCacheKey;material.color.setHex(0x4b739a);material.map=maps.color;material.bumpMap=maps.height;material.bumpScale=.00045;material.roughnessMap=maps.rough;material.roughness=.98;material.metalness=0;material.flatShading=false;material.skinning=true;material.transparent=false;material.opacity=1;material.needsUpdate=true;mesh.material=material;mesh.castShadow=true;mesh.receiveShadow=true;mesh.frustumCulled=false;mesh.onBeforeRender();u.luciaRemovedClothing=u.luciaRemovedClothing.filter(n=>n!=='lucia-seamless-denim');u.luciaBottomOutfit='blue-denim-shorts';u.luciaTexturedJeanShorts={textureSize:512,textureMethod:'generated diagonal denim weave with wash, height and roughness maps; not a photograph',bodyFitSamples:hitsCount,expandedVertices:expanded,maxExpansion,restPoseRadialClearance:.008,originalSkinWeightsUVsTopologyAndPocketCuffShaderPreserved:true,permanentBriefsRetained:true};delete u.luciaJeanShortsTemplate;
           }
          `;once('function addLuciaFittedBriefs(T,h){',helper+'function addLuciaFittedBriefs(T,h){');s='// LUCIA_TEXTURED_JEAN_SHORTS_V1\n'+s;acorn.parse(s,{ecmaVersion:'latest'});fs.writeFileSync('/tmp/lucia-jeans-after.js',s);
          JS
      - name: Validate visible shorts texture animation and preserved body and underwear
        run: |
          node <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert'),T=require(process.env.RUNNER_TEMP+'/lucia-jeans/node_modules/three');if(!fs.existsSync('/tmp/lucia-jeans-after.js')){assert(fs.readFileSync('js/reference-characters.js','utf8').includes('// LUCIA_TEXTURED_JEAN_SHORTS_V1'));process.exit(0);}function load(file){const c={window:{},console,Math};vm.createContext(c);for(const p of ['js/characters.js',file])vm.runInContext(fs.readFileSync(p,'utf8'),c);return c.window.VCCharacters;}const old=load('/tmp/lucia-jeans-before.js'),cur=load('/tmp/lucia-jeans-after.js');function sig(h){const rows=[];h.traverse(o=>{if(o.name==='lucia-seamless-denim')return;const row=[o.type,o.name,o.visible,o.position.toArray(),o.quaternion.toArray(),o.scale.toArray()];if(o.isMesh)row.push(Object.keys(o.geometry.attributes).sort().map(k=>[k,Array.from(o.geometry.attributes[k].array)]),o.geometry.index?Array.from(o.geometry.index.array):null,...(Array.isArray(o.material)?o.material:[o.material]).map(m=>[m.type,m.color?m.color.getHex():null,m.roughness,m.transparent,m.opacity]));rows.push(row);});return JSON.stringify(rows);}for(const id of Object.keys(old.DESIGNS))if(id!=='luciaC')assert(sig(old.build(T,id))===sig(cur.build(T,id)),'Other character changed');const reports=[];for(const merge of [false,true]){const a=old.build(T,'luciaC',{merge}),h=cur.build(T,'luciaC',{merge}),u=h.userData,d=h.getObjectByName('lucia-seamless-denim');assert(sig(a)===sig(h),'Body tank bra permanent briefs or other geometry changed');assert(d&&d.visible&&d.isSkinnedMesh&&d.material.skinning&&u.luciaBottomOutfit==='blue-denim-shorts'&&u.luciaTexturedJeanShorts);assert(h.getObjectByName('lucia-fitted-black-briefs').visible&&h.getObjectByName('lucia-tailored-bra').visible&&u.luciaTankVisible);assert(d.material.color.getHex()===0x4b739a&&!d.material.transparent&&d.material.opacity===1&&d.material.bumpScale===.00045);const p=d.geometry.attributes.position,w=d.geometry.attributes.skinWeight,uv=d.geometry.attributes.uv;assert(uv.count===p.count&&w.count===p.count);for(let i=0;i<w.count;i++)assert(Math.abs(w.getX(i)+w.getY(i)+w.getZ(i)+w.getW(i)-1)<1e-5);for(const texture of [d.material.map,d.material.bumpMap,d.material.roughnessMap]){assert(texture.isDataTexture&&texture.image.width===512&&texture.image.height===512&&texture.generateMipmaps&&texture.wrapS===T.RepeatWrapping);let lo=255,hi=0;const data=texture.image.data;for(let i=0;i<data.length;i+=4){lo=Math.min(lo,data[i]);hi=Math.max(hi,data[i]);assert(data[i+3]===255);}assert(hi-lo>10,'Fabric map has no variation');}const shader={uniforms:{},vertexShader:T.ShaderLib.standard.vertexShader,fragmentShader:T.ShaderLib.standard.fragmentShader};d.material.onBeforeCompile(shader,{});assert(shader.vertexShader.includes('vLuciaDenimBind=position;')&&shader.fragmentShader.includes('float cuff=')&&shader.fragmentShader.includes('float backPocket='),'Original pockets and cuffs lost');h.updateMatrixWorld(true);const inverse=new T.Matrix4().copy(u.hips.matrixWorld).invert(),M=inverse.clone().multiply(d.matrixWorld),bodyBox=new T.Box3();for(let i=0;i<p.count;i++)bodyBox.expandByPoint(new T.Vector3().fromBufferAttribute(p,i).applyMatrix4(M));assert(bodyBox.max.y>=.060&&bodyBox.min.y<=-.200&&bodyBox.min.y>-.55,'Shorts have unexpected length or waistband');let poses=0;for(const angle of [-.7,0,.7]){u.Lg[0].hp.rotation.x=angle;u.Lg[1].hp.rotation.x=-angle;u.Lg[0].kn.rotation.x=Math.abs(angle)*.7;u.spine.rotation.y=angle*.15;h.updateMatrixWorld(true);d.onBeforeRender();assert(Array.from(d.skeleton.boneMatrices).every(Number.isFinite));for(let i=0;i<p.count;i+=17)assert(d.boneTransform(i,new T.Vector3().fromBufferAttribute(p,i)).toArray().every(Number.isFinite));h.traverse(o=>{assert(o.matrixWorld.elements.every(Number.isFinite));if(o.isMesh)for(const key of ['position','normal','uv'])if(o.geometry.attributes[key])assert(Array.from(o.geometry.attributes[key].array).every(Number.isFinite));});poses++;}reports.push({merge,poses,hipSpaceBounds:{min:bodyBox.min.toArray(),max:bodyBox.max.toArray()},fit:u.luciaTexturedJeanShorts});}fs.copyFileSync('/tmp/lucia-jeans-after.js','js/reference-characters.js');fs.mkdirSync('status',{recursive:true});fs.writeFileSync('status/lucia-textured-jean-shorts-check.json',JSON.stringify({passed:true,branch:process.env.TARGET_BRANCH,reports,generatedDenimColorHeightAndRoughnessMaps:true,pocketsAndCuffsRetained:true,permanentUnderwearAndBodyUnchanged:true,tankAndBustStateUnchanged:true,scope:'Restored existing animated shorts with generated woven-denim maps and outward-only neutral-pose radial fitting around body and briefs. Structural and shader-template checks do not establish rendered fabric realism, complete garment clearance, all-animation clipping or live deployment. Texture is generated, not photographic.'},null,2)+'\n');
          JS
      - name: Publish validated textured jean shorts
        run: |
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/"$TARGET_BRANCH")" || { echo 'Branch changed; rerun against latest.'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- js/reference-characters.js status/lucia-textured-jean-shorts-check.json
          git diff --cached --quiet && exit 0
          git commit -m 'Dress Lucia in woven blue jean shorts over permanent briefs preserving body and tank'
          git push origin HEAD:"refs/heads/$TARGET_BRANCH"
