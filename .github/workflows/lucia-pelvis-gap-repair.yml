name: Fill Lucia central pelvis gap with a smooth rig-driven skin bridge
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lucia-pelvis-gap-repair.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lucia-photo-reference
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --prefix "$RUNNER_TEMP/lucia-pelvis-gap" --no-package-lock --ignore-scripts three@0.128.0 acorn@8
      - name: Prepare additive pelvis surface without editing existing geometry
        run: |
          node <<'JS'
          const fs=require('fs'),acorn=require(process.env.RUNNER_TEMP+'/lucia-pelvis-gap/node_modules/acorn');let s=fs.readFileSync('js/reference-characters.js','utf8');if(s.includes('// LUCIA_PELVIS_GAP_REPAIR_V1'))process.exit(0);if(!s.includes('// LUCIA_CLOTHING_ONLY_V1'))throw Error('Reviewed body configuration missing');fs.writeFileSync('/tmp/lucia-pelvis-before.js',s);function walk(n,fn){fn(n);for(const v of Object.values(n)){if(Array.isArray(v)){for(const x of v)if(x&&typeof x.type==='string')walk(x,fn);}else if(v&&typeof v.type==='string')walk(v,fn);}}const matches=[];walk(acorn.parse(s,{ecmaVersion:'latest'}),n=>{if(n.type==='FunctionDeclaration'&&n.id&&n.id.name==='lucia')matches.push(n);});if(matches.length!==1)throw Error('Ambiguous Lucia build function');const node=matches[0];
          const helper=String.raw`
           function installLuciaPelvisBridge(T,h){
            const u=h.userData;if(h.getObjectByName('lucia-pelvis-skin-bridge'))return;h.updateMatrixWorld(true);const geometry=new T.SphereGeometry(1,48,32),p=geometry.attributes.position,indices=[],weights=[],toRoot=new T.Matrix4().copy(h.matrixWorld).invert().multiply(u.hips.matrixWorld),v=new T.Vector3(),smooth=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t);};
            for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);v.set(v.x*.170,v.y*.160-.010,v.z*.117-.007);const spine=smooth((v.y-.010)/.105),legs=(1-spine)*.30*smooth((-.040-v.y)/.110),right=smooth((v.x+.065)/.130);indices.push(0,1,2,3);weights.push(1-spine-legs,spine,legs*(1-right),legs*right);v.applyMatrix4(toRoot);p.setXYZ(i,v.x,v.y,v.z);}p.needsUpdate=true;geometry.setAttribute('skinIndex',new T.Uint16BufferAttribute(indices,4));geometry.setAttribute('skinWeight',new T.Float32BufferAttribute(weights,4));geometry.computeVertexNormals();geometry.computeBoundingBox();geometry.computeBoundingSphere();
            const material=u.m.skin.clone();material.skinning=true;material.flatShading=false;material.needsUpdate=true;const mesh=new T.SkinnedMesh(geometry,material);mesh.name='lucia-pelvis-skin-bridge';mesh.castShadow=true;mesh.receiveShadow=true;mesh.frustumCulled=false;h.add(mesh);
            const joints=[u.hips,u.spine,u.Lg[0].hp,u.Lg[1].hp],bones=joints.map((joint,i)=>{const bone=new T.Bone();bone.name='lucia-pelvis-follow-bone-'+i;bone.matrixAutoUpdate=false;h.add(bone);return bone;}),inverseRoot=new T.Matrix4();
            function synchronize(){inverseRoot.copy(h.matrixWorld).invert();for(let i=0;i<bones.length;i++){bones[i].matrix.copy(inverseRoot).multiply(joints[i].matrixWorld);bones[i].matrixWorld.copy(joints[i].matrixWorld);bones[i].matrixWorldNeedsUpdate=false;}}
            h.updateMatrixWorld(true);synchronize();const skeleton=new T.Skeleton(bones);mesh.bind(skeleton);mesh.onBeforeRender=function(){synchronize();skeleton.update();};mesh.onBeforeRender();u.luciaPelvisGapBridge=true;
           }
          `;s=s.slice(0,node.body.end-1)+'\n installLuciaPelvisBridge(T,h);\n'+s.slice(node.body.end-1);s=s.slice(0,node.start)+helper+s.slice(node.start);s='// LUCIA_PELVIS_GAP_REPAIR_V1\n'+s;acorn.parse(s,{ecmaVersion:'latest'});fs.writeFileSync('/tmp/lucia-pelvis-after.js',s);
          JS
      - name: Verify closed surface gap coverage and preserved model and animations
        run: |
          node <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert'),acorn=require(process.env.RUNNER_TEMP+'/lucia-pelvis-gap/node_modules/acorn'),T=require(process.env.RUNNER_TEMP+'/lucia-pelvis-gap/node_modules/three');if(!fs.existsSync('/tmp/lucia-pelvis-after.js')){if(fs.readFileSync('js/reference-characters.js','utf8').includes('// LUCIA_PELVIS_GAP_REPAIR_V1'))process.exit(0);throw Error('Candidate missing');}function load(file){const c={window:{},console,Math,T,clamp:(x,a,b)=>Math.max(a,Math.min(b,x))};vm.createContext(c);for(const p of ['js/characters.js',file])vm.runInContext(fs.readFileSync(p,'utf8'),c);return c;}const before=load('/tmp/lucia-pelvis-before.js'),after=load('/tmp/lucia-pelvis-after.js'),old=before.window.VCCharacters,cur=after.window.VCCharacters;
          function signature(h){const out=[];h.traverse(o=>{if(o.isMesh&&o.name!=='lucia-pelvis-skin-bridge')out.push([o.name,o.visible,o.position.toArray(),o.quaternion.toArray(),o.scale.toArray(),Object.keys(o.geometry.attributes).sort().map(k=>[k,Array.from(o.geometry.attributes[k].array)]),o.geometry.index?Array.from(o.geometry.index.array):null,...(Array.isArray(o.material)?o.material:[o.material]).map(m=>[m.type,m.color?m.color.getHex():null,m.roughness,m.metalness,m.flatShading])]);});return JSON.stringify(out);}for(const id of Object.keys(old.DESIGNS))if(id!=='luciaC')assert(signature(old.build(T,id))===signature(cur.build(T,id)),'Unrelated character changed');const a=old.build(T,'luciaC'),b=cur.build(T,'luciaC'),bridge=b.getObjectByName('lucia-pelvis-skin-bridge');assert(signature(a)===signature(b),'Existing model geometry or materials changed');assert(bridge&&bridge.isSkinnedMesh&&bridge.material.skinning&&bridge.material.color.getHex()===b.userData.m.skin.color.getHex());
          const g=bridge.geometry,p=g.attributes.position,w=g.attributes.skinWeight,lookup=new Map(),ids=[],adj=[],edges=new Map();for(let i=0;i<p.count;i++){const key=[p.getX(i),p.getY(i),p.getZ(i)].map(v=>Math.round(v*1e6)).join(',');if(!lookup.has(key)){lookup.set(key,lookup.size);adj.push(new Set());}ids.push(lookup.get(key));assert(Math.abs(w.getX(i)+w.getY(i)+w.getZ(i)+w.getW(i)-1)<1e-5);}for(let i=0;i<g.index.count;i+=3){const tri=[0,1,2].map(j=>ids[g.index.getX(i+j)]);if(new Set(tri).size<3)continue;for(let j=0;j<3;j++){const a=tri[j],b=tri[(j+1)%3],key=a<b?a+','+b:b+','+a;edges.set(key,(edges.get(key)||0)+1);adj[a].add(b);adj[b].add(a);}}assert([...edges.values()].every(n=>n===2),'Bridge surface is not closed');const seen=new Set([0]),queue=[0];while(queue.length)for(const j of adj[queue.pop()])if(!seen.has(j)){seen.add(j);queue.push(j);}assert(seen.size===lookup.size,'Bridge contains disconnected parts');
          b.updateMatrixWorld(true);bridge.onBeforeRender();let coverageRays=0;for(const y of [-.09,-.04,0,.04,.08,.11])for(const side of [-1,1]){const origin=new T.Vector3(0,y,side).applyMatrix4(b.userData.hips.matrixWorld),direction=new T.Vector3(0,0,-side).transformDirection(b.userData.hips.matrixWorld),ray=new T.Raycaster(origin,direction,0,2);assert(ray.intersectObject(bridge,false).length>0,'Central gap is not covered');coverageRays++;}
          const joints=h=>{const u=h.userData;return [u.hips.position.toArray(),u.spine.position.toArray(),u.headP.position.toArray(),...u.A.flatMap(x=>[x.sh.position.toArray(),x.el.position.toArray()]),...u.Lg.flatMap(x=>[x.hp.position.toArray(),x.kn.position.toArray()])];};assert(JSON.stringify(joints(a))===JSON.stringify(joints(b)));function walk(n,fn){fn(n);for(const v of Object.values(n)){if(Array.isArray(v)){for(const x of v)if(x&&typeof x.type==='string')walk(x,fn);}else if(v&&typeof v.type==='string')walk(v,fn);}}const animators=[];for(const m of fs.readFileSync('index.html','utf8').matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)){if(!m[1].trim())continue;walk(acorn.parse(m[1],{ecmaVersion:'latest'}),n=>{if(n.type==='FunctionDeclaration'&&n.id&&n.id.name==='animHuman')animators.push(m[1].slice(n.start,n.end));});}assert(animators.length===1);vm.runInContext(animators[0],after);for(const p of ['js/one-hand-hit.js','js/gun-animation.js'])vm.runInContext(fs.readFileSync(p,'utf8'),after);const animate=after.window.VCGunAnimation.wrap(after.window.VCOneHandHit.wrap(after.animHuman),T);let cases=0;for(const merge of [false,true]){const h=cur.build(T,'luciaC',{merge}),u=h.userData,m=h.getObjectByName('lucia-pelvis-skin-bridge');assert(m&&m.isSkinnedMesh&&u.luciaPelvisGapBridge&&u.guns.pistol&&u.guns.rifle);for(const state of [{speed:0,weapon:null,punch:0},{speed:2,weapon:null,punch:0},{speed:7,weapon:null,punch:0},{speed:0,weapon:null,punch:1},{speed:0,weapon:'pistol',aim:true},{speed:0,weapon:'rifle',aim:true}]){for(let i=0;i<90;i++){animate(h,1/60,state);h.updateMatrixWorld(true);m.onBeforeRender();}assert(Array.from(m.skeleton.boneMatrices).every(Number.isFinite));for(let i=0;i<m.geometry.attributes.position.count;i+=17){const v=new T.Vector3().fromBufferAttribute(m.geometry.attributes.position,i).applyMatrix4(m.bindMatrix),sum=new T.Vector3(),indices=m.geometry.attributes.skinIndex,weights=m.geometry.attributes.skinWeight;for(let j=0;j<4;j++){const id=indices.array[i*4+j],weight=weights.array[i*4+j],M=new T.Matrix4().copy(m.skeleton.bones[id].matrixWorld).multiply(m.skeleton.boneInverses[id]);sum.addScaledVector(v.clone().applyMatrix4(M),weight);}sum.applyMatrix4(m.bindMatrixInverse);assert(sum.toArray().every(Number.isFinite));}cases++;}}
          fs.copyFileSync('/tmp/lucia-pelvis-after.js','js/reference-characters.js');fs.mkdirSync('status',{recursive:true});fs.writeFileSync('status/lucia-pelvis-gap-check.json',JSON.stringify({passed:true,animationCases:cases,coverageRays,closedConnectedBridgeSurface:true,normalizedFourJointSkinWeights:true,existingBodyGeometryAndMaterialsUnchanged:true,rigOffsetsUnchanged:true,currentSkinColorPreserved:true,otherCharactersUnchanged:true,scope:'Additive closed pelvis bridge, bind-pose center-ray coverage and structural animation checks. This is not a full-body topology weld; rendered blends, pose-dependent gaps and live deployment not verified.'},null,2)+'\n');
          JS
      - name: Publish only validated pelvis repair
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'Main changed; rerun against latest revision.'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- js/reference-characters.js status/lucia-pelvis-gap-check.json
          git diff --cached --quiet && exit 0
          git commit -m 'Fill Lucia central pelvis gap with closed skin-matched rig-driven bridge'
          git push origin HEAD:main
