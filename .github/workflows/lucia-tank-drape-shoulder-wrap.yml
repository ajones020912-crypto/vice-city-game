name: Lucia tank chest drape and outside shoulder wrap
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lucia-tank-drape-shoulder-wrap.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fit:
    strategy:
      fail-fast: false
      matrix:
        target: [main, lucia-outfits]
    concurrency:
      group: lucia-u-neck-${{ matrix.target }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --prefix "$RUNNER_TEMP/lucia-drape" --no-package-lock --ignore-scripts three@0.128.0 acorn@8
      - name: Prepare spanning fabric and shoulder wrap without changing underlying garments or skin
        run: |
          node <<'JS'
          const fs=require('fs'),acorn=require(process.env.RUNNER_TEMP+'/lucia-drape/node_modules/acorn');let s=fs.readFileSync('js/reference-characters.js','utf8');if(s.includes('// LUCIA_TANK_DRAPE_SHOULDER_WRAP_V1'))process.exit(0);if(!s.includes('// LUCIA_MIDPOINT_U_NECK_V3'))throw Error('Midpoint U-neck required');fs.writeFileSync('/tmp/lucia-drape-before.js',s);function walk(n,f){f(n);for(const v of Object.values(n)){if(Array.isArray(v)){for(const x of v)if(x&&typeof x.type==='string')walk(x,f);}else if(v&&typeof v.type==='string')walk(v,f);}}const nodes=[];walk(acorn.parse(s,{ecmaVersion:'latest'}),n=>{if(n.type==='FunctionDeclaration'&&n.id&&n.id.name==='refineLuciaTankUNeck')nodes.push(n);});if(nodes.length!==1)throw Error('Tank builder changed');const node=nodes[0];let f=s.slice(node.start,node.end);function once(a,b){if(f.split(a).length!==2)throw Error('Reviewed tank fragment changed: '+a.slice(0,100));f=f.replace(a,b);}const helper=String.raw`
            const drapeSources=triangles.slice(),bra=h.getObjectByName('lucia-tailored-bra');assertFit(!!bra,'Retained bra required');bra.traverse(o=>{if(o.isMesh){collect(o,drapeSources);collect(o,support);}});let peakY=.385,peakZ=-Infinity;for(const tri of drapeSources)for(const q of tri)if(q.p.y>=.290&&q.p.y<=.460&&Math.abs(q.p.x)<=.145&&q.p.z>peakZ){peakZ=q.p.z;peakY=q.p.y;}const sections=new Map();function upperSection(y){const key=Math.round(y*1000),level=key/1000;if(sections.has(key))return sections.get(key);const points=[];for(const tri of drapeSources){if(level<Math.min(...tri.map(q=>q.p.y))-1e-8||level>Math.max(...tri.map(q=>q.p.y))+1e-8)continue;for(let k=0;k<3;k++){const a=tri[k].p,b=tri[(k+1)%3].p;if(Math.abs(a.y-level)<1e-8)points.push([a.x,a.z]);if((a.y<level&&b.y>level)||(b.y<level&&a.y>level)){const t=(level-a.y)/(b.y-a.y);points.push([a.x+(b.x-a.x)*t,a.z+(b.z-a.z)*t]);}}}points.sort((a,b)=>a[0]-b[0]||b[1]-a[1]);const unique=[];for(const p of points)if(!unique.length||p[0]-unique[unique.length-1][0]>1e-7)unique.push(p);const hull=[];for(const p of unique){while(hull.length>=2){const a=hull[hull.length-2],b=hull[hull.length-1];if((b[0]-a[0])*(p[1]-b[1])-(b[1]-a[1])*(p[0]-b[0])<0)break;hull.pop();}hull.push(p);}assertFit(hull.length>=2,'Chest drape section missing');sections.set(key,hull);return hull;}function upperZ(x,y){const hull=upperSection(y);if(x<=hull[0][0])return hull[0][1];for(let i=1;i<hull.length;i++)if(x<=hull[i][0]){const a=hull[i-1],b=hull[i],t=(x-a[0])/(b[0]-a[0]);return a[1]+(b[1]-a[1])*t;}return hull[hull.length-1][1];}function clothDrapeZ(x,y){const surface=upperZ(x,y),bottom=hem+.005;if(y<=bottom||y>=peakY)return surface;const t=(y-bottom)/(peakY-bottom);return Math.max(surface,upperZ(x,bottom)*(1-t)+upperZ(x,peakY)*t);}function clothNormals(g){g.computeVertexNormals();const p=g.attributes.position,n=g.attributes.normal,buckets=new Map();for(let i=0;i<p.count;i++){const key=[p.getX(i),p.getY(i),p.getZ(i)].map(x=>Math.round(x*1e5)).join(',');if(!buckets.has(key))buckets.set(key,[]);buckets.get(key).push(i);}for(const ids of buckets.values()){const sum=new T.Vector3();for(const i of ids)sum.add(new T.Vector3().fromBufferAttribute(n,i));sum.normalize();for(const i of ids)n.setXYZ(i,sum.x,sum.y,sum.z);}n.needsUpdate=true;}
          `;once('function clip(poly,plane){',helper+'function clip(poly,plane){');once('const p=q.p.clone().addScaledVector(q.n,.010);positions.push(p.x,p.y,p.z);','const p=q.p.clone().addScaledVector(q.n,.010);if(q.p.z>.015)p.z=Math.max(p.z,clothDrapeZ(p.x,p.y)+.012);positions.push(p.x,p.y,p.z);');once('bodyGeometry.computeBoundingBox();','clothNormals(bodyGeometry);bodyGeometry.computeBoundingBox();');once('function surface(origin,direction){','function surface(origin,direction,optional=false){');once("assertFit(!!best,'Shoulder fabric support missing');return best;","if(!best&&optional)return null;assertFit(!!best,'Shoulder fabric support missing');return best;");once('const cols=6,rows=48,p=[],n=[],uv=[],index=[];','const cols=12,rows=96,p=[],n=[],uv=[],index=[];');once('z=front.p.z+(back.p.z-front.p.z)*j/rows,q=surface(new T.Vector3(x,top+.5,z),new T.Vector3(0,-1,0)),v=q.p.clone().addScaledVector(q.n,.010);','zStart=Math.max(front.p.z+.010,clothDrapeZ(x,y)+.012),zEnd=back.p.z-.010,z=zStart+(zEnd-zStart)*j/rows,q=surface(new T.Vector3(x,top+.5,z),new T.Vector3(0,-1,0),true),v=new T.Vector3(x,Math.max(y,q?q.p.y+.008:y),z);');once('n.push(q.n.x,q.n.y,q.n.z);','n.push(0,1,0);');once('g.setIndex(index);g.computeBoundingBox();','g.setIndex(index);clothNormals(g);g.computeBoundingBox();');once('u.luciaDarkGreyOuterTank.meshCount=3;','u.luciaTankDrapeShoulderWrap={peakY,frontStyle:"continuous tension envelope across chest with straight fall toward hem",shoulderStyle:"front-to-back shoulder wrap above skin and bra",strapVerticalClearance:.008};u.luciaDarkGreyOuterTank.meshCount=3;');s='// LUCIA_TANK_DRAPE_SHOULDER_WRAP_V1\n'+s.slice(0,node.start)+f+s.slice(node.end);acorn.parse(s,{ecmaVersion:'latest'});fs.writeFileSync('/tmp/lucia-drape-after.js',s);
          JS
      - name: Validate chest bridging shoulder clearance and unchanged base
        run: |
          node <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert'),T=require(process.env.RUNNER_TEMP+'/lucia-drape/node_modules/three');if(!fs.existsSync('/tmp/lucia-drape-after.js')){assert(fs.readFileSync('js/reference-characters.js','utf8').includes('// LUCIA_TANK_DRAPE_SHOULDER_WRAP_V1'));process.exit(0);}function load(file){const c={window:{},console,Math};vm.createContext(c);for(const p of ['js/characters.js',file])vm.runInContext(fs.readFileSync(p,'utf8'),c);return c.window.VCCharacters;}const old=load('/tmp/lucia-drape-before.js'),cur=load('/tmp/lucia-drape-after.js');function signature(h){const rows=[];h.traverse(o=>{if(o.userData.luciaOuterTank)return;const r=[o.type,o.name,o.visible,o.position.toArray(),o.quaternion.toArray(),o.scale.toArray()];if(o.isMesh)r.push(Object.keys(o.geometry.attributes).sort().map(k=>[k,Array.from(o.geometry.attributes[k].array)]),o.geometry.index?Array.from(o.geometry.index.array):null,...(Array.isArray(o.material)?o.material:[o.material]).map(m=>[m.type,m.color?m.color.getHex():null,m.roughness,m.metalness,m.transparent,m.opacity,m.skinning]));rows.push(r);});return JSON.stringify(rows);}for(const id of Object.keys(old.DESIGNS))if(id!=='luciaC')assert(signature(old.build(T,id))===signature(cur.build(T,id)),'Other character changed');let poses=0;const reports=[];for(const merge of [false,true]){const a=old.build(T,'luciaC',{merge}),h=cur.build(T,'luciaC',{merge}),u=h.userData,group=h.getObjectByName('lucia-dark-grey-tank-outfit'),body=h.getObjectByName('lucia-dark-grey-tank-top');assert(signature(a)===signature(h),'Body shoulders rig bra underwear or other outfit changed');assert.deepStrictEqual(JSON.parse(JSON.stringify(u.luciaTankUNeck)),JSON.parse(JSON.stringify(a.userData.luciaTankUNeck)),'Midpoint neckline or strap width changed');assert(group.visible&&u.luciaTankVisible&&u.luciaOutfit===a.userData.luciaOutfit);assert(h.getObjectByName('lucia-tailored-bra').visible&&h.getObjectByName('lucia-fitted-black-briefs').visible);h.updateMatrixWorld(true);a.updateMatrixWorld(true);const inverse=new T.Matrix4().copy(u.spine.matrixWorld).invert(),skin=[];h.traverse(o=>{if(o.isMesh&&o.material===u.m.skin&&(o.parent===u.spine||u.A.some(arm=>o.parent===arm.sh)))skin.push(o);});h.getObjectByName('lucia-tailored-bra').traverse(o=>{if(o.isMesh)skin.push(o);});function ray(human,point,direction,meshes){const spine=human.userData.spine,origin=point.clone().applyMatrix4(spine.matrixWorld),dir=direction.clone().transformDirection(spine.matrixWorld);return new T.Raycaster(origin,dir,0,3).intersectObjects(meshes,false);}function front(human,x,y,mesh){const hits=ray(human,new T.Vector3(x,y,1),new T.Vector3(0,0,-1),[mesh]),inv=new T.Matrix4().copy(human.userData.spine.matrixWorld).invert();return hits.map(hit=>hit.point.clone().applyMatrix4(inv)).filter(p=>p.z>.02)[0];}let chestSamples=0,maxCentreLift=0,minChestGap=Infinity;for(const y of [.28,.32,.36,.38,.40,.42,.44])for(const x of [-.08,-.04,0,.04,.08]){const q=front(h,x,y,body);if(!q)continue;const hits=ray(h,new T.Vector3(x,y,1),new T.Vector3(0,0,-1),skin);if(hits.length){const under=hits[0].point.clone().applyMatrix4(inverse);minChestGap=Math.min(minChestGap,q.z-under.z);assert(q.z-under.z>.001,'Tank clips underlying chest or bra');chestSamples++;}if(x===0){const before=front(a,x,y,a.getObjectByName('lucia-dark-grey-tank-top'));if(before)maxCentreLift=Math.max(maxCentreLift,q.z-before.z);}}assert(chestSamples>=15&&maxCentreLift>.002,'Insufficient chest bridging');let strapSamples=0,minStrapGap=Infinity;for(const side of ['left','right']){const strap=h.getObjectByName('lucia-dark-grey-tank-'+side+'-shoulder-strap'),g=strap.geometry,p=g.attributes.position,M=inverse.clone().multiply(strap.matrixWorld),samples=[];assert(g.index.count===12*96*6);for(let i=0;i<p.count;i+=17)samples.push(new T.Vector3().fromBufferAttribute(p,i).applyMatrix4(M));for(let i=0;i<g.index.count;i+=93){const q=new T.Vector3();for(let j=0;j<3;j++)q.add(new T.Vector3().fromBufferAttribute(p,g.index.getX(i+j)).applyMatrix4(M));samples.push(q.multiplyScalar(1/3));}for(const q of samples){const hits=ray(h,new T.Vector3(q.x,u.luciaTankUNeck.shoulderY+1,q.z),new T.Vector3(0,-1,0),skin);if(!hits.length)continue;const top=hits[0].point.clone().applyMatrix4(inverse),gap=q.y-top.y;assert(gap>.004,'Strap cuts into shoulder or bra');minStrapGap=Math.min(minStrapGap,gap);strapSamples++;}}assert(strapSamples>120,'Insufficient shoulder-wrap samples');group.traverse(o=>{if(o.isMesh)assert(o.material.color.getHex()===0x3b3d40&&!o.material.transparent&&o.material.opacity===1&&o.material.bumpMap&&o.material.bumpScale===.00022);});reports.push({merge,chestSamples,maxCentreLift,minChestGap,strapSamples,minStrapGap});for(const angle of [-.7,0,.7]){u.spine.rotation.y=angle*.2;u.A[0].sh.rotation.x=angle;u.A[1].sh.rotation.x=-angle;h.updateMatrixWorld(true);h.traverse(o=>{assert(o.matrixWorld.elements.every(Number.isFinite));if(o.isMesh)for(const k of ['position','normal','uv'])if(o.geometry.attributes[k])assert(Array.from(o.geometry.attributes[k].array).every(Number.isFinite));});poses++;}}fs.copyFileSync('/tmp/lucia-drape-after.js','js/reference-characters.js');fs.mkdirSync('status',{recursive:true});fs.writeFileSync('status/lucia-tank-drape-shoulder-wrap-check.json',JSON.stringify({passed:true,branch:process.env.TARGET_BRANCH,reports,poseChecks:poses,midpointUNeckAndRibbingPreserved:true,bodyShouldersRigAndBaseGarmentsUnchangedByTankFix:true,otherCharactersUnchanged:true,scope:'Chest and shoulder clearance samples are neutral-pose checks. Finite animation samples do not prove all-pose clipping freedom, seamless garment joins, rendered cloth realism or live deployment. Shoulder widening is a separate installer.'},null,2)+'\n');
          JS
      - name: Publish validated drape and strap correction
        run: |
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/"$TARGET_BRANCH")" || { echo 'Target branch changed; rerun against latest.'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- js/reference-characters.js status/lucia-tank-drape-shoulder-wrap-check.json
          git diff --cached --quiet && exit 0
          git commit -m 'Drape Lucia tank across chest and wrap straps outside shoulders and bra'
          git push origin HEAD:"refs/heads/$TARGET_BRANCH"
