name: Dark green traffic-light poles
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dark-green-signal-poles.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recolor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Recolor only signal supports and check JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          anchor='const metal=[.9,.58,.035],black=[.025,.032,.038];'
          if s.count(anchor)!=1: raise SystemExit('Expected one traffic-light material declaration; refusing ambiguous edit.')
          s=s.replace(anchor,anchor+'const signalPoleGreen=[.025,.12,.065];',1)
          lines=s.splitlines(keepends=True)
          changed=0
          for i,line in enumerate(lines):
              if 'bakeG(' in line and ',metal)' in line and any(token in line for token in ['px,0,pz','(hx+px)/2','hx,baseY+1.72,hz']):
                  lines[i]=line.replace(',metal)',',signalPoleGreen)')
                  changed+=1
          if changed!=4: raise SystemExit(f'Expected four signal support lines, found {changed}; no file written.')
          s=''.join(lines)
          checked=0
          with tempfile.TemporaryDirectory() as d:
              for code in re.findall(r'<script\b[^>]*>([\s\S]*?)</script>',s,re.I):
                  if not code.strip(): continue
                  f=Path(d)/'check.js'
                  f.write_text(code,encoding='utf-8')
                  subprocess.run(['node','--check',str(f)],check=True)
                  checked+=1
          if not checked: raise SystemExit('No inline scripts checked; no file written.')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit pole color change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Paint traffic-light poles and support arms dark green'
          git push origin HEAD:main
