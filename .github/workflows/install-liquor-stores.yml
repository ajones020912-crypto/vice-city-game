name: Install integrated liquor stores
on:
  push:
    branches: [main]
    paths: ['js/liquor-stores.js', 'scripts/install-liquor-stores.cjs', 'scripts/test-liquor-stores.cjs', '.github/workflows/install-liquor-stores.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: vice-city-liquor-install-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install validation and browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/vc-liquor-feature" --no-package-lock --ignore-scripts acorn@8 playwright@1.58.2 three@0.128.0
          node "$RUNNER_TEMP/vc-liquor-feature/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Guarded integration and actual browser smoke test
        id: checks
        continue-on-error: true
        run: |
          node --check js/liquor-stores.js
          node --check scripts/install-liquor-stores.cjs
          node --check scripts/test-liquor-stores.cjs
          node scripts/install-liquor-stores.cjs
          node scripts/test-liquor-stores.cjs
      - name: Publish tested integration or preserve original game with diagnostics
        if: always() && steps.checks.outcome != 'skipped'
        env:
          CHECK_OUTCOME: ${{ steps.checks.outcome }}
        run: |
          if test "$CHECK_OUTCOME" != success; then
            git restore -- index.html
            mkdir -p status
            if ! test -f status/liquor-stores-check.json; then echo '{"passed":false,"stage":"syntax or setup","baselinePreserved":true}' > status/liquor-stores-check.json; fi
            node -e "const fs=require('fs'),p='status/liquor-stores-check.json',r=JSON.parse(fs.readFileSync(p));r.passed=false;r.baselinePreserved=true;fs.writeFileSync(p,JSON.stringify(r,null,2)+'\n')"
          fi
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'Branch changed; rerun against current inspected source.'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- status/liquor-stores-check.json
          if test "$CHECK_OUTCOME" = success; then git add -- index.html; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Enable tested liquor stores and alcohol effects or record diagnostics without changing game'
            git push origin HEAD:refs/heads/main
          fi
          node -e "if(!require('./status/liquor-stores-check.json').passed)process.exit(1)"
