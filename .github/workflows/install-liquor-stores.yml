name: Install integrated liquor stores
on:
  push:
    branches: [main]
    paths: ['index.html', 'js/liquor-stores.js', 'js/reference-characters.js', 'scripts/install-liquor-stores.cjs', 'scripts/test-liquor-stores.cjs', '.github/workflows/install-liquor-stores.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: vice-city-liquor-install-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install validation and browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/vc-liquor-feature" --no-package-lock --ignore-scripts acorn@8 playwright@1.58.2 three@0.128.0
          node "$RUNNER_TEMP/vc-liquor-feature/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Guarded integration and actual browser smoke test
        run: |
          node --check js/liquor-stores.js
          node --check js/reference-characters.js
          node --check scripts/install-liquor-stores.cjs
          node --check scripts/test-liquor-stores.cjs
          node scripts/install-liquor-stores.cjs
          git diff --exit-code -- index.html
          node scripts/test-liquor-stores.cjs
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquor-stores-check
          path: status/liquor-stores-check.json
          if-no-files-found: ignore
