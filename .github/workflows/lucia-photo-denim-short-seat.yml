name: Lucia photo denim shorter legs and fuller seat coverage
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lucia-photo-denim-short-seat.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shorts:
    strategy:
      fail-fast: false
      matrix:
        target: [main, lucia-outfits]
    concurrency:
      group: lucia-u-neck-${{ matrix.target }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          npm install --prefix "$RUNNER_TEMP/lucia-photo-denim" --no-package-lock --ignore-scripts three@0.128.0 acorn@8
          python -m pip install 'Pillow>=10,<13'
      - name: Download CC0 source and simplify into local JPEG with provenance
        run: |
          python <<'PY'
          import hashlib, io, json, pathlib, urllib.request
          from PIL import Image, ImageEnhance, ImageFilter, ImageStat
          status=pathlib.Path('status/lucia-photo-denim-download.json');status.parent.mkdir(exist_ok=True)
          report={'passed':False,'source':'https://polyhaven.com/a/denim_fabric','author':'Rob Tuytel','license':'CC0-1.0'}
          try:
              def get(url):
                  req=urllib.request.Request(url,headers={'User-Agent':'ViceCityGameAssetPreparation/1.0'})
                  with urllib.request.urlopen(req,timeout=60) as response:
                      return response.read(20000000)
              catalog=json.loads(get('https://api.polyhaven.com/files/denim_fabric'))
              candidates=[]
              def walk(value,trail=''):
                  if isinstance(value,dict):
                      if isinstance(value.get('url'),str):
                          url=value['url'];key=trail.lower()
                          if '1k' in key and 'jpg' in key and any(k in key for k in ['diff','albedo','color']) and url.startswith('https://dl.polyhaven.org/'):
                              candidates.append(url)
                      for key,item in value.items():
                          walk(item,trail+'/'+key)
                  elif isinstance(value,list):
                      for item in value: walk(item,trail)
              walk(catalog)
              if not candidates: raise RuntimeError('Official 1K JPG diffuse map not found; refusing guessed asset URL')
              url=sorted(set(candidates))[0];raw=get(url)
              image=Image.open(io.BytesIO(raw)).convert('RGB')
              if min(image.size)<256: raise RuntimeError('Source image unexpectedly small')
              image=image.resize((256,256),Image.Resampling.LANCZOS).filter(ImageFilter.GaussianBlur(.25))
              image=ImageEnhance.Contrast(image).enhance(1.08)
              image=ImageEnhance.Color(image).enhance(.90)
              if max(ImageStat.Stat(image).stddev)<5: raise RuntimeError('Source texture lacks visible detail')
              target=pathlib.Path('assets/textures/lucia-denim-photo.jpg');target.parent.mkdir(parents=True,exist_ok=True)
              image.save(target,'JPEG',quality=84,optimize=True)
              if target.stat().st_size>80000: raise RuntimeError('Simplified image exceeds size budget')
              report.update(passed=True,downloadURL=url,sourceSHA256=hashlib.sha256(raw).hexdigest(),processedSHA256=hashlib.sha256(target.read_bytes()).hexdigest(),size=[256,256],bytes=target.stat().st_size,processing='Lanczos downscale, mild blur, restrained contrast and saturation; JPEG quality 84')
              pathlib.Path('assets/textures/lucia-denim-photo-source.json').write_text(json.dumps(report,indent=2)+'\n')
          except Exception as exc:
              report['error']=str(exc)
          status.write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Prepare denser shortened shorts and verify preservation and rear coverage
        run: |
          node <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert'),acorn=require(process.env.RUNNER_TEMP+'/lucia-photo-denim/node_modules/acorn'),T=require(process.env.RUNNER_TEMP+'/lucia-photo-denim/node_modules/three'),file='js/reference-characters.js',baseline=fs.readFileSync(file,'utf8'),status='status/lucia-photo-denim-short-seat-check.json',report={passed:false,branch:process.env.TARGET_BRANCH,scope:'Photo asset and neutral sampled seat coverage with finite-pose checks; rendered appearance and all-animation clipping still require in-game review.'};try{assert(JSON.parse(fs.readFileSync('status/lucia-photo-denim-download.json','utf8')).passed,'Photo download or simplification failed; see download report');if(baseline.includes('// LUCIA_PHOTO_DENIM_SHORT_SEAT_V1')){assert(fs.existsSync(status)&&JSON.parse(fs.readFileSync(status,'utf8')).passed);process.exit(0);}report.phase='prepare';const hook='addLuciaTexturedJeanShorts(T,h);';assert(baseline.split(hook).length===2,'Installed textured shorts hook missing or ambiguous');const helper=String.raw`
           function fitLuciaPhotoDenim(T,h){
