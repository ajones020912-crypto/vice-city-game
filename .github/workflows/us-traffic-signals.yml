name: Install one-sided US traffic signals
on:
  push:
    branches: [main]
    paths: ['.github/workflows/us-traffic-signals.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: us-traffic-signals
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Update only traffic signal models
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, re, tempfile, os
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if '// US_ONE_SIDED_SIGNALS_V1' in s:
              print('US signal update already applied.')
              raise SystemExit(0)
          blob=subprocess.check_output(['git','hash-object','index.html'],text=True).strip()
          if blob!='82fc7891fd141ddff67aa3332b19b18f9bd6c10c':
              raise SystemExit('Game changed since review; refusing to overwrite it.')
          def replace_once(old,new):
              global s
              if s.count(old)!=1: raise SystemExit('Unexpected patch anchor: '+old[:80])
              s=s.replace(old,new,1)
          def replace_function(name,new):
              global s
              start=s.index('function '+name+'('); brace=s.index('{',start)
              depth=0; quote=None; comment=None; i=brace
              while i<len(s):
                  ch=s[i]; pair=s[i:i+2]
                  if comment=='line':
                      if ch=='\n': comment=None
                  elif comment=='block':
                      if pair=='*/': comment=None; i+=1
                  elif quote:
                      if ch=='\\': i+=1
                      elif ch==quote: quote=None
                  elif pair=='//': comment='line'; i+=1
                  elif pair=='/*': comment='block'; i+=1
                  elif ch in "'\"`": quote=ch
                  elif ch=='{': depth+=1
                  elif ch=='}':
                      depth-=1
                      if depth==0:
                          s=s[:start]+new+s[i+1:]
                          return
                  i+=1
              raise SystemExit('Cannot locate function end: '+name)
          replace_once(" for(const n of G.sigNodes){for(const[sx,sz]of[[1,1],[-1,-1]]){const x=n.x+sx*(n.v.hw+1.6),z=n.z+sz*(n.h.hw+1.6);bakeG('plain',GEO.cyl6,x,0,z,0,.1,5.8,.1,[.2,.22,.24]);bakeG('plain',GEO.box,x-sx*2.2,5.6,z,0,4.4,.14,.14,[.2,.22,.24]);bakeG('plain',GEO.box,x,5.6,z-sz*2.2,0,.14,.14,4.4,[.2,.22,.24]);addCol(x-.2,z-.2,x+.2,z+.2,6)}}",' // Overhead US signal poles and arms are built with their one-sided heads in buildSignals().')
          build_signals=r'''function buildSignals(){
           // US_ONE_SIDED_SIGNALS_V1
           const count=G.sigNodes.length*12;
           sigMesh=new T.InstancedMesh(new T.CircleGeometry(1,24),new T.MeshBasicMaterial({toneMapped:false,side:T.FrontSide}),count);
           defMat('usSignalHood',new T.MeshStandardMaterial({vertexColors:true,color:0xffffff,roughness:.9,metalness:.08,side:T.DoubleSide}),false,true);
           const hood=new T.CylinderGeometry(.29,.29,.36,18,1,true,Math.PI*5/12,Math.PI*7/6);hood.rotateX(Math.PI/2);
           const ring=new T.RingGeometry(.235,.285,24),m=new T.Matrix4(),q=new T.Quaternion(),v=new T.Vector3(),sc=new T.Vector3(),up=new T.Vector3(0,1,0);let i=0;
           G.usSignalHeads=[];
           for(const nd of G.sigNodes){nd.si=i;
            for(const axis of['h','v'])for(const dir of[1,-1]){
             const hx=axis==='h'?nd.x+dir*(nd.v.hw+1.8):nd.x-dir*nd.v.w*.25;
             const hz=axis==='h'?nd.z+dir*nd.h.w*.25:nd.z+dir*(nd.h.hw+1.8);
             const px=axis==='h'?hx:nd.x-dir*(nd.v.hw+1.8);
             const pz=axis==='h'?nd.z+dir*(nd.h.hw+1.8):hz;
             const nx=axis==='h'?-dir:0,nz=axis==='v'?-dir:0,angle=Math.atan2(nx,nz),baseY=5.7;
             const metal=[.9,.58,.035],black=[.025,.032,.038];
             bakeG('plain',GEO.cyl6,px,0,pz,0,.14,8.15,.14,metal);
             bakeG('plain',GEO.cyl6,px,0,pz,0,.27,.48,.27,metal);addCol(px-.2,pz-.2,px+.2,pz+.2,8.15);
             const dx=hx-px,dz=hz-pz,span=Math.hypot(dx,dz);
             bakeG('plain',GEO.box,(hx+px)/2,7.95,(hz+pz)/2,Math.atan2(dx,dz),.18,.18,span+.4,metal);
             bakeG('plain',GEO.cyl6,hx,baseY+1.72,hz,0,.065,.60,.065,metal);
             bakeG('plain',GEO.box,hx,baseY,hz,angle,.72,1.72,.36,metal);
             bakeG('plain',GEO.box,hx+nx*.19,baseY+.06,hz+nz*.19,angle,.62,1.60,.018,black);
             bakeG('plain',GEO.box,hx-nx*.205,baseY+.6,hz-nz*.205,angle,.12,.50,.035,[.15,.17,.14]);
             q.setFromAxisAngle(up,angle);
             for(let color=0;color<3;color++){
              const y=baseY+1.42-color*.56;
              bakeG('plain',ring,hx+nx*.218,y,hz+nz*.218,angle,1,1,1,black);
              bakeG('usSignalHood',hood,hx+nx*.405,y,hz+nz*.405,angle,1,1,1,black);
              v.set(hx+nx*.223,y,hz+nz*.223);sc.set(.225,.225,1);m.compose(v,q,sc);sigMesh.setMatrixAt(i++,m);
             }
             G.usSignalHeads.push({x:hx,z:hz,axis,dir,nx,nz});
            }
           }
           sigMesh.frustumCulled=false;world.add(sigMesh);updateSignals(0);
          }'''
          update_signals=r'''function updateSignals(t){
           if(!sigMesh)return;
           for(const nd of G.sigNodes){let i=nd.si;
            for(const axis of['h','v'])for(const dir of[1,-1]){
             const active=sigState(nd,t,axis);
             for(let lamp=0;lamp<3;lamp++){
              const c=SCOL[lamp],k=lamp===active?1:.035;
              sigMesh.setColorAt(i++,_ic.setRGB(c[0]*k,c[1]*k,c[2]*k));
             }
            }
           }
           if(sigMesh.instanceColor)sigMesh.instanceColor.needsUpdate=true;
          }'''
          replace_function('buildSignals',build_signals)
          replace_function('updateSignals',update_signals)
          for code in re.findall(r'<script\b[^>]*>([\s\S]*?)</script>',s,re.I):
              if not code.strip(): continue
              with tempfile.NamedTemporaryFile(mode='w',suffix='.js',delete=False) as f:
                  f.write(code); name=f.name
              try: subprocess.run(['node','--check',name],check=True)
              finally: os.unlink(name)
          p.write_text(s,encoding='utf-8')
          print('Validated one-sided US traffic signals; timing, audio, graphics and vehicle fixes preserved.')
          PY
      - name: Commit the validated traffic signal update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git commit -m 'Use one-sided yellow US traffic signals with overhead arms and black visors'
          git push origin HEAD:main
