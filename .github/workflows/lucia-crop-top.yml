name: Lucia cropped tank
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lucia-crop-top.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  crop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Shorten tank and move hem
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, tempfile
          p=Path('js/reference-characters.js')
          s=p.read_text(encoding='utf-8')
          if '// LUCIA_CROPPED_TANK_V1' in s: raise SystemExit(0)
          replacements=[
              ('const profile=[[.143,.025],[.14,.055],[.132,.14],[.145,.26],','const profile=[[.1406667,.22],[.145,.26],'),
              ("new T.TorusGeometry(.143,.0035,6,28),m.trim,'lucia-tank-hem',0,.03,0","new T.TorusGeometry(.1406667,.0035,6,28),m.trim,'lucia-tank-hem',0,.2235,0")
          ]
          for old,new in replacements:
              if s.count(old)!=1: raise SystemExit('Tank geometry changed; refusing ambiguous edit: '+old)
              s=s.replace(old,new,1)
          s='// LUCIA_CROPPED_TANK_V1\n'+s
          with tempfile.TemporaryDirectory() as d:
              check=Path(d)/'check.js'
              check.write_text(s,encoding='utf-8')
              subprocess.run(['node','--check',str(check)],check=True)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit crop-top change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add js/reference-characters.js
          git diff --cached --quiet && exit 0
          git commit -m 'Shorten Lucia dark tank into a crop top'
          git push origin HEAD:main
