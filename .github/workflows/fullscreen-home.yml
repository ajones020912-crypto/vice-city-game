name: Fullscreen homescreen
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fullscreen-home.yml'
permissions:
  contents: write
concurrency:
  group: fullscreen-home
  cancel-in-progress: true
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make homescreen fill the entire viewport
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          new_css = r'''
          /* ===== VC3D Homescreen (fullscreen) ===== */
          #overlay{
            position:fixed;inset:0;z-index:50;
            display:flex;align-items:center;justify-content:center;
            background:
              radial-gradient(ellipse 90% 60% at 50% 35%,#5a1a6aaa 0%,transparent 55%),
              linear-gradient(180deg,#1a0a2ef0 0%,#0a0e1cf8 45%,#050810fc 100%);
            backdrop-filter:blur(2px);
          }
          .home-card{
            width:100%;height:100%;max-width:none;max-height:none;
            margin:0;padding:0;
            display:flex;flex-direction:column;align-items:center;justify-content:center;
            gap:0;
            background:transparent;border:none;border-radius:0;
            box-shadow:none;text-align:center;position:relative;overflow:hidden;
          }
          .home-card:before{display:none}
          .home-logo-wrap{
            position:relative;
            width:min(520px,78vw);
            aspect-ratio:1200/640;
            max-height:min(240px,32vh);
            margin:0 auto 28px;
            overflow:hidden;border-radius:16px;
            background:linear-gradient(180deg,#2a0a4a,#ff6b3d 70%,#1a1030);
            box-shadow:0 16px 50px #000a,0 0 0 1px #ffffff18,0 0 80px #ff4f9a33;
          }
          .home-logo-wrap img,.home-logo-wrap object{
            width:100%;height:100%;object-fit:cover;display:block;
          }
          .home-logo-fade{display:none}
          .home-kicker{display:none}
          .home-title{display:none}
          .home-sub{display:none}
          .home-actions{
            display:grid;grid-template-columns:1fr 1fr;gap:14px;
            width:min(420px,86vw);padding:0;margin:0;
          }
          .home-btn{
            margin:0;min-height:76px;text-align:left;padding:16px 18px;border-radius:14px;
            background:linear-gradient(135deg,#e83f8c,#ff6e9f);
            font-size:15px;letter-spacing:1.2px;
            border:1px solid #ffffff28;
            box-shadow:0 10px 32px #ff4f9a44;
            transition:transform .14s,box-shadow .14s,filter .14s;
          }
          .home-btn:hover{
            filter:brightness(1.1);transform:translateY(-2px);
            box-shadow:0 14px 40px #ff4f9a66;
          }
          .home-btn.alt{
            background:linear-gradient(135deg,#167e83,#27b5a7);
            box-shadow:0 10px 32px #27b5a744;
          }
          .home-btn.alt:hover{box-shadow:0 14px 40px #27b5a766}
          .home-btn small{
            display:block;color:#fff;opacity:.85;font-size:11px;
            font-weight:normal;letter-spacing:0;margin-top:5px;
          }
          .home-btn.multiplayer-soon{
            position:relative;opacity:.72;cursor:not-allowed;
            background:linear-gradient(135deg,#294c59,#426875);
            padding-top:26px;box-shadow:none;
          }
          .home-btn.multiplayer-soon:after{
            content:'COMING SOON';position:absolute;top:8px;right:10px;
            padding:4px 8px;border-radius:4px;background:#ffd23a;color:#17232b;
            font-size:9px;font-weight:900;letter-spacing:1.2px;box-shadow:0 2px 8px #0005;
          }
          .home-btn.multiplayer-soon:hover{
            filter:none;transform:none;
            background:linear-gradient(135deg,#294c59,#426875);box-shadow:none;
          }
          .continue-btn{
            grid-column:1/-1;min-height:48px;text-align:center;
            background:linear-gradient(135deg,#2c4a73,#3a5f94);
            box-shadow:0 6px 20px #0006;
          }
          .home-status{
            margin:22px 0 0;color:#b8d3df;min-height:18px;font-size:13px;
            text-shadow:0 1px 8px #000a;
          }
          .home-foot{
            position:absolute;left:0;right:0;bottom:22px;
            border:none;margin:0;padding:0;
            color:#8aa3b5;font-size:12px;letter-spacing:.4px;
            text-shadow:0 1px 6px #0008;
          }
          @media(max-width:560px){
            .home-logo-wrap{width:min(300px,82vw);max-height:min(140px,22vh);margin-bottom:20px}
            .home-actions{grid-template-columns:1fr;width:min(300px,88vw);gap:10px}
            .home-btn{min-height:64px}
            .continue-btn{grid-column:auto}
            .home-foot{bottom:14px;font-size:11px;padding:0 12px}
          }
          /* ===== end homescreen ===== */
          '''

          if 'VC3D Homescreen' not in s and 'end homescreen' not in s:
              raise SystemExit('Homescreen CSS marker not found')

          s2, n = re.subn(
              r'/\* ===== VC3D Homescreen[\s\S]*?/\* ===== end homescreen ===== \*/',
              new_css.strip(),
              s,
              count=1,
          )
          if n != 1:
              s2, n = re.subn(
                  r'/\* ===== VC3D Homescreen[\s\S]*?end homescreen ===== \*/',
                  new_css.strip(),
                  s,
                  count=1,
              )
          if n != 1:
              raise SystemExit(f'Failed to replace homescreen CSS (matches={n})')
          s = s2
          print('Replaced homescreen CSS with fullscreen layout')

          p.write_text(s, encoding='utf-8')
          print(f'Done ({p.stat().st_size} bytes)')
          PY

      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'UI: fullscreen homescreen — logo + buttons centered over full viewport'
          git push origin HEAD:main
