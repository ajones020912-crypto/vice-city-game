name: Lucia ribbed U-neck tank with connected shoulder straps
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lucia-tank-u-neck-straps.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refine:
    strategy:
      fail-fast: false
      matrix:
        target: [main, lucia-outfits]
    concurrency:
      group: lucia-u-neck-${{ matrix.target }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --prefix "$RUNNER_TEMP/lucia-neck" --no-package-lock --ignore-scripts three@0.128.0 acorn@8
      - name: Prepare fitted U-neck body and shoulder ribbons without changing skin or bra
        run: |
          node <<'JS'
          const fs=require('fs'),acorn=require(process.env.RUNNER_TEMP+'/lucia-neck/node_modules/acorn');let s=fs.readFileSync('js/reference-characters.js','utf8');if(s.includes('// LUCIA_U_NECK_STRAPS_V1'))process.exit(0);if(!s.includes('// LUCIA_TANK_SUBTLE_RIBBING_V1'))throw Error('Installed ribbed tank required');fs.writeFileSync('/tmp/lucia-neck-before.js',s);function walk(n,f){f(n);for(const v of Object.values(n)){if(Array.isArray(v)){for(const x of v)if(x&&typeof x.type==='string')walk(x,f);}else if(v&&typeof v.type==='string')walk(v,f);}}const nodes=[];walk(acorn.parse(s,{ecmaVersion:'latest'}),n=>{if(n.type==='FunctionDeclaration'&&n.id&&n.id.name==='lucia')nodes.push(n);});if(nodes.length!==1)throw Error('Lucia builder changed');const node=nodes[0],helper=String.raw`
           function refineLuciaTankUNeck(T,h){
            const u=h.userData,group=h.getObjectByName('lucia-dark-grey-tank-outfit'),old=h.getObjectByName('lucia-dark-grey-tank-top'),torso=u.luciaCenterContour&&u.spine.children[u.luciaCenterContour.spineChildIndex];if(!group||!old||!torso||torso.material!==u.m.skin)throw Error('Reviewed tank or torso missing');h.updateMatrixWorld(true);const inverse=new T.Matrix4().copy(u.spine.matrixWorld).invert(),oldM=inverse.clone().multiply(old.matrixWorld),oldBox=new T.Box3().setFromBufferAttribute(old.geometry.attributes.position).applyMatrix4(oldM),shoulders=u.A.map(a=>a.sh.getWorldPosition(new T.Vector3()).applyMatrix4(inverse)),shoulderY=(shoulders[0].y+shoulders[1].y)/2,shoulderX=(Math.abs(shoulders[0].x)+Math.abs(shoulders[1].x))/2,hem=oldBox.min.y,top=shoulderY+.020,neckHalf=.085,neckBase=shoulderY-.155,neckDepth=.135,armCenter=shoulderX+.035,armRadius=Math.max(.080,shoulderX-.060),strapCenter=Math.max(.110,Math.min(.120,shoulderX-.045)),halfWidth=.013;assertFit(hem<neckBase-.025&&top>neckBase+.1,'Unexpected tank proportions');function assertFit(ok,message){if(!ok)throw Error(message);}const triangles=[],support=[];function collect(o,out){const g=o.geometry,p=g.attributes.position,n=g.attributes.normal,M=inverse.clone().multiply(o.matrixWorld),N=new T.Matrix3().getNormalMatrix(M),vertices=[];for(let i=0;i<p.count;i++)vertices.push({p:new T.Vector3().fromBufferAttribute(p,i).applyMatrix4(M),n:new T.Vector3().fromBufferAttribute(n,i).applyMatrix3(N).normalize()});for(let i=0,c=g.index?g.index.count:p.count;i<c;i+=3)out.push([0,1,2].map(j=>vertices[g.index?g.index.getX(i+j):i+j]));}collect(torso,triangles);h.traverse(o=>{if(o.isMesh&&o.material===u.m.skin&&(o.parent===u.spine||u.A.some(a=>o.parent===a.sh)))collect(o,support);});
            function clip(poly,plane){const out=[];for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length],da=plane[0]*a.p.x+plane[1]*a.p.y+plane[2]*a.p.z-plane[3],db=plane[0]*b.p.x+plane[1]*b.p.y+plane[2]*b.p.z-plane[3];if(da<=0)out.push(a);if((da<=0)!==(db<=0)){const t=da/(da-db);out.push({p:a.p.clone().lerp(b.p,t),n:a.n.clone().lerp(b.n,t).normalize()});}}return out;}function subtract(poly,planes){let inside=poly;const outside=[];for(const plane of planes){if(inside.length<3)break;const part=clip(inside,plane.map(v=>-v));if(part.length>=3)outside.push(part);inside=clip(inside,plane);}return outside;}function bowl(center,radius,base,depth){const planes=[];for(let i=0;i<=32;i++){const x=center-radius*1.6+radius*3.2*i/32,y=base+depth*Math.pow((x-center)/radius,2),slope=2*depth*(x-center)/(radius*radius);planes.push([slope,-1,0,slope*x-y]);}return planes;}const holes=[[[0,0,-1,0],...bowl(0,neckHalf,neckBase,neckDepth)],[[0,0,1,0],...bowl(0,.090,shoulderY-.085,.120)],bowl(armCenter,armRadius,shoulderY-.130,.180),bowl(-armCenter,armRadius,shoulderY-.130,.180)];const positions=[],normals=[],uvs=[];function vertex(q){const p=q.p.clone().addScaledVector(q.n,.010);positions.push(p.x,p.y,p.z);normals.push(q.n.x,q.n.y,q.n.z);return Math.atan2(p.x,p.z)/(Math.PI*2)+.5;}for(const tri of triangles){let poly=clip(tri,[[0,-1,0,-hem]][0]);poly=clip(poly,[0,1,0,top]);if(poly.length<3)continue;let pieces=[poly];for(const hole of holes)pieces=pieces.flatMap(p=>subtract(p,hole));for(const piece of pieces)for(let i=1;i<piece.length-1;i++){const face=[piece[0],piece[i],piece[i+1]],a=face[1].p.clone().sub(face[0].p),b=face[2].p.clone().sub(face[0].p);if(a.cross(b).lengthSq()<1e-16)continue;const us=face.map(vertex),seam=Math.max(...us)-Math.min(...us)>.5;for(let j=0;j<3;j++)uvs.push(us[j]+(seam&&us[j]<.5?1:0),face[j].p.y/.55);}}assertFit(positions.length>300,'Tank body missing');const material=(Array.isArray(old.material)?old.material[0]:old.material).clone();assertFit(material.bumpMap&&material.color.getHex()===0x3b3d40,'Ribbed fabric missing');const bodyGeometry=new T.BufferGeometry();bodyGeometry.setAttribute('position',new T.Float32BufferAttribute(positions,3));bodyGeometry.setAttribute('normal',new T.Float32BufferAttribute(normals,3));bodyGeometry.setAttribute('uv',new T.Float32BufferAttribute(uvs,2));bodyGeometry.computeBoundingBox();bodyGeometry.computeBoundingSphere();
            const ray=new T.Ray(),point=new T.Vector3(),bary=new T.Vector3();function surface(origin,direction){ray.set(origin,direction);let best=null,distance=Infinity;for(const t of support){if(!ray.intersectTriangle(t[0].p,t[1].p,t[2].p,false,point))continue;const d=origin.distanceToSquared(point);if(d<distance){distance=d;T.Triangle.getBarycoord(point,t[0].p,t[1].p,t[2].p,bary);best={p:point.clone(),n:t[0].n.clone().multiplyScalar(bary.x).addScaledVector(t[1].n,bary.y).addScaledVector(t[2].n,bary.z).normalize()};}}assertFit(!!best,'Shoulder fabric support missing');return best;}function strap(side){const cols=6,rows=48,p=[],n=[],uv=[],index=[];for(let j=0;j<=rows;j++)for(let i=0;i<=cols;i++){const x=side*strapCenter-halfWidth+2*halfWidth*i/cols,armCut=shoulderY-.130+.180*Math.pow((Math.abs(x)-armCenter)/armRadius,2),y=Math.min(top-.008,armCut-.012),front=surface(new T.Vector3(x,y,1),new T.Vector3(0,0,-1)),back=surface(new T.Vector3(x,y,-1),new T.Vector3(0,0,1)),z=front.p.z+(back.p.z-front.p.z)*j/rows,q=surface(new T.Vector3(x,top+.5,z),new T.Vector3(0,-1,0)),v=q.p.clone().addScaledVector(q.n,.010);p.push(v.x,v.y,v.z);n.push(q.n.x,q.n.y,q.n.z);uv.push((x-side*strapCenter)/.9+.5,j/rows*.45);}for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const a=j*(cols+1)+i,b=a+1,c=a+cols+1,d=c+1;index.push(a,b,c,b,d,c);}const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(p,3));g.setAttribute('normal',new T.Float32BufferAttribute(n,3));g.setAttribute('uv',new T.Float32BufferAttribute(uv,2));g.setIndex(index);g.computeBoundingBox();g.computeBoundingSphere();return g;}const left=strap(-1),right=strap(1);for(const child of group.children.slice())group.remove(child);function addPart(name,geometry){const mesh=new T.Mesh(geometry,material);mesh.name=name;mesh.userData.luciaOuterTank=true;mesh.castShadow=true;mesh.receiveShadow=true;group.add(mesh);}addPart('lucia-dark-grey-tank-top',bodyGeometry);addPart('lucia-dark-grey-tank-left-shoulder-strap',left);addPart('lucia-dark-grey-tank-right-shoulder-strap',right);u.luciaTankUNeck={neckBase,neckDepth,neckHalf,shoulderY,strapCenter,strapWidth:halfWidth*2,hem};u.luciaDarkGreyOuterTank.meshCount=3;if(u.luciaTankRibbing)u.luciaTankRibbing.meshes=3;
           }
          `;s=s.slice(0,node.body.end-1)+'\n refineLuciaTankUNeck(T,h);\n'+s.slice(node.body.end-1);s=s.slice(0,node.start)+helper+s.slice(node.start);s='// LUCIA_U_NECK_STRAPS_V1\n'+s;acorn.parse(s,{ecmaVersion:'latest'});fs.writeFileSync('/tmp/lucia-neck-after.js',s);
          JS
      - name: Verify U-neck opening visible shoulder ribbons and preserved base
        run: |
          node <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert'),T=require(process.env.RUNNER_TEMP+'/lucia-neck/node_modules/three');if(!fs.existsSync('/tmp/lucia-neck-after.js')){assert(fs.readFileSync('js/reference-characters.js','utf8').includes('// LUCIA_U_NECK_STRAPS_V1'));process.exit(0);}function load(file){const c={window:{},console,Math};vm.createContext(c);for(const p of ['js/characters.js',file])vm.runInContext(fs.readFileSync(p,'utf8'),c);return c.window.VCCharacters;}const old=load('/tmp/lucia-neck-before.js'),cur=load('/tmp/lucia-neck-after.js');function signature(h){const rows=[];h.traverse(o=>{if(o.userData.luciaOuterTank)return;const r=[o.type,o.name,o.visible,o.position.toArray(),o.quaternion.toArray(),o.scale.toArray()];if(o.isMesh)r.push(Object.keys(o.geometry.attributes).sort().map(k=>[k,Array.from(o.geometry.attributes[k].array)]),o.geometry.index?Array.from(o.geometry.index.array):null,...(Array.isArray(o.material)?o.material:[o.material]).map(m=>[m.type,m.color?m.color.getHex():null,m.roughness,m.metalness,m.transparent,m.opacity,m.skinning]));rows.push(r);});return JSON.stringify(rows);}for(const id of Object.keys(old.DESIGNS))if(id!=='luciaC')assert(signature(old.build(T,id))===signature(cur.build(T,id)),'Other character changed');let poses=0,neckChecks=0;for(const merge of [false,true]){const a=old.build(T,'luciaC',{merge}),h=cur.build(T,'luciaC',{merge}),u=h.userData,group=h.getObjectByName('lucia-dark-grey-tank-outfit'),body=h.getObjectByName('lucia-dark-grey-tank-top'),fit=u.luciaTankUNeck;assert(signature(a)===signature(h),'Underlying body bra underwear swimsuit or rig changed');assert(group.visible&&u.luciaTankVisible&&u.luciaOutfit===a.userData.luciaOutfit);assert(h.getObjectByName('lucia-tailored-bra').visible&&h.getObjectByName('lucia-fitted-black-briefs').visible);for(const side of ['left','right']){const strap=h.getObjectByName('lucia-dark-grey-tank-'+side+'-shoulder-strap');assert(strap&&strap.geometry.index.count===6*48*6&&strap.geometry.boundingBox.max.y>fit.shoulderY-.02,'Shoulder strap missing');assert(strap.geometry.boundingBox.max.z-strap.geometry.boundingBox.min.z>.06,'Strap must extend from front to back');}h.updateMatrixWorld(true);function frontHits(x,y){const origin=new T.Vector3(x,y,1).applyMatrix4(u.spine.matrixWorld),direction=new T.Vector3(0,0,-1).transformDirection(u.spine.matrixWorld),inv=new T.Matrix4().copy(u.spine.matrixWorld).invert();return new T.Raycaster(origin,direction,0,2).intersectObject(body,false).filter(hit=>hit.point.clone().applyMatrix4(inv).z>.02);}assert(frontHits(0,fit.neckBase-.020).length>0,'Front panel below neckline missing');assert(frontHits(0,fit.neckBase+.070).length===0,'U-neck centre not open');assert(frontHits(.075,fit.neckBase+.070).length>0,'U-neck must rise at sides');neckChecks+=3;group.traverse(o=>{if(o.isMesh){assert(o.material.color.getHex()===0x3b3d40&&!o.material.transparent&&o.material.opacity===1&&o.material.bumpMap&&o.material.bumpScale===.00022);assert(Array.from(o.geometry.attributes.uv.array).every(Number.isFinite));}});for(const angle of [-.7,0,.7]){u.spine.rotation.y=angle*.2;u.A[0].sh.rotation.x=angle;u.A[1].sh.rotation.x=-angle;h.updateMatrixWorld(true);h.traverse(o=>{assert(o.matrixWorld.elements.every(Number.isFinite));if(o.isMesh)for(const k of ['position','normal'])if(o.geometry.attributes[k])assert(Array.from(o.geometry.attributes[k].array).every(Number.isFinite));});poses++;}}fs.copyFileSync('/tmp/lucia-neck-after.js','js/reference-characters.js');fs.mkdirSync('status',{recursive:true});fs.writeFileSync('status/lucia-u-neck-straps-check.json',JSON.stringify({passed:true,branch:process.env.TARGET_BRANCH,neckline:'rounded U-neck',shoulderStraps:2,strapStyle:'flat front-to-back shoulder ribbons',neckOpeningChecks:neckChecks,poseChecks:poses,defaultTankEnabled:true,darkGreyRibbingPreserved:true,baseGarmentsBodySkinToneAndRigUnchanged:true,otherCharactersUnchanged:true,scope:'Fitted torso panels with front U-neck and arm openings plus two shoulder ribbons. Structural and ray tests do not prove rendered realism, seamless attachment in every pose, GPU appearance or live deployment.'},null,2)+'\n');
          JS
      - name: Publish validated tank shape to selected branch
        run: |
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/"$TARGET_BRANCH")" || { echo 'Target branch changed; rerun against latest.'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- js/reference-characters.js status/lucia-u-neck-straps-check.json
          git diff --cached --quiet && exit 0
          git commit -m 'Give Lucia ribbed tank a rounded U-neck and connected shoulder straps'
          git push origin HEAD:"refs/heads/$TARGET_BRANCH"
