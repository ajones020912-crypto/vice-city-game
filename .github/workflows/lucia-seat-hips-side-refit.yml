name: Lucia fuller seat subtle hips and underwear side refit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lucia-seat-hips-side-refit.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refit:
    strategy:
      fail-fast: false
      matrix:
        target: [main, lucia-outfits]
    concurrency:
      group: lucia-u-neck-${{ matrix.target }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --prefix "$RUNNER_TEMP/lucia-seat" --no-package-lock --ignore-scripts three@0.128.0 acorn@8
      - name: Prepare continuous seat and hip change before seam blending and underwear fitting
        run: |
          node <<'JS'
          const fs=require('fs'),acorn=require(process.env.RUNNER_TEMP+'/lucia-seat/node_modules/acorn');let s=fs.readFileSync('js/reference-characters.js','utf8');if(s.includes('// LUCIA_FULLER_SEAT_SUBTLE_HIPS_V1'))process.exit(0);if(!s.includes('// LUCIA_SMALLER_CONNECTED_BRIEFS_V2')||!s.includes('// LUCIA_PELVIS_SEAM_BLEND_V1'))throw Error('Connected briefs and repaired pelvis required');fs.writeFileSync('/tmp/lucia-seat-before.js',s);function walk(n,f){f(n);for(const v of Object.values(n)){if(Array.isArray(v)){for(const x of v)if(x&&typeof x.type==='string')walk(x,f);}else if(v&&typeof v.type==='string')walk(v,f);}}const nodes=[];walk(acorn.parse(s,{ecmaVersion:'latest'}),n=>{if(n.type==='FunctionDeclaration'&&n.id&&n.id.name==='lucia')nodes.push(n);});if(nodes.length!==1)throw Error('Lucia builder changed');const node=nodes[0],calls=node.body.body.filter(n=>n.type==='ExpressionStatement'&&n.expression.type==='CallExpression'),hooks=calls.filter(n=>n.expression.callee.name==='blendLuciaPelvisSeams'),briefs=calls.filter(n=>n.expression.callee.name==='addLuciaFittedBriefs');if(hooks.length!==1||briefs.length!==1||hooks[0].start>=briefs[0].start)throw Error('Reviewed seam and garment order changed');const helper=String.raw`
           function fitLuciaFullerSeat(T,h){
            const u=h.userData,bridge=h.getObjectByName('lucia-pelvis-skin-bridge');if(!bridge||!bridge.isSkinnedMesh||h.getObjectByName('lucia-fitted-black-briefs'))throw Error('Repaired pelvis required before briefs fitting');h.updateMatrixWorld(true);const inverse=new T.Matrix4().copy(u.hips.matrixWorld).invert(),smooth=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t);};let changed=0,maxRear=0,maxWidth=0;h.traverse(mesh=>{if(!mesh.isMesh||!(mesh===bridge||(mesh.material===u.m.skin&&(mesh.parent===u.spine||mesh.parent===u.hips||u.Lg.some(l=>mesh.parent===l.hp)))))return;const g=mesh.geometry.clone(),p=g.attributes.position,oldNormals=g.attributes.normal.clone(),M=inverse.clone().multiply(mesh.matrixWorld),back=M.clone().invert(),v=new T.Vector3(),edited=new Set(),affected=new Set();for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i).applyMatrix4(M);const hip=smooth((v.y+.280)/.160)*smooth((.180-v.y)/.120),rear=smooth((-v.z-.015)/.070),seat=Math.exp(-Math.pow((v.y+.055)/.135,4)),lobe=.65+.35*Math.exp(-Math.pow((Math.abs(v.x)-.085)/.090,2)),dx=v.x*.020*hip,dz=-.022*hip*rear*seat*lobe;if(Math.abs(dx)+Math.abs(dz)<1e-9)continue;v.x+=dx;v.z+=dz;maxRear=Math.max(maxRear,-dz);maxWidth=Math.max(maxWidth,Math.abs(dx));v.applyMatrix4(back);p.setXYZ(i,v.x,v.y,v.z);edited.add(i);affected.add(i);}if(!edited.size)return;for(let i=0,c=g.index?g.index.count:p.count;i<c;i+=3){const tri=[0,1,2].map(j=>g.index?g.index.getX(i+j):i+j);if(tri.some(k=>edited.has(k)))for(const k of tri)affected.add(k);}p.needsUpdate=true;g.computeVertexNormals();const n=g.attributes.normal,groups=new Map();for(const i of affected){const key=[p.getX(i),p.getY(i),p.getZ(i)].map(x=>Math.round(x*1e5)).join(',');if(!groups.has(key))groups.set(key,[]);groups.get(key).push(i);}for(const ids of groups.values()){const sum=new T.Vector3();for(const i of ids)sum.add(new T.Vector3().fromBufferAttribute(n,i));sum.normalize();for(const i of ids)n.setXYZ(i,sum.x,sum.y,sum.z);}for(let i=0;i<n.count;i++)if(!affected.has(i))n.setXYZ(i,oldNormals.getX(i),oldNormals.getY(i),oldNormals.getZ(i));n.needsUpdate=true;g.computeBoundingBox();g.computeBoundingSphere();mesh.geometry=g;changed+=edited.size;});if(changed<100||maxRear<.010||maxRear>.023||maxWidth>.0055)throw Error('Seat or hip change outside intended range');smoothLuciaSkinSurface(T,h,true);u.luciaFullerSeatSubtleHips={changedVertices:changed,maximumRearAddition:maxRear,maximumSideAddition:maxWidth,maximumHipWidthFactor:1.020,scope:'Continuous lower-body deformation including repaired pelvis bridge, followed by hip/thigh smoothing and existing seam blend; existing briefs fitter subsequently regenerates panels and side bands with unchanged coverage rules.'};
           }
          `;s=s.slice(0,hooks[0].start)+'fitLuciaFullerSeat(T,h);\n '+s.slice(hooks[0].start);s=s.slice(0,node.start)+helper+s.slice(node.start);s='// LUCIA_FULLER_SEAT_SUBTLE_HIPS_V1\n'+s;acorn.parse(s,{ecmaVersion:'latest'});fs.writeFileSync('/tmp/lucia-seat-after.js',s);
          JS
      - name: Validate seat hips repaired bridge underwear sides and preserved upper body
        run: |
          node <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert'),T=require(process.env.RUNNER_TEMP+'/lucia-seat/node_modules/three');if(!fs.existsSync('/tmp/lucia-seat-after.js')){assert(fs.readFileSync('js/reference-characters.js','utf8').includes('// LUCIA_FULLER_SEAT_SUBTLE_HIPS_V1'));process.exit(0);}function load(file){const c={window:{},console,Math};vm.createContext(c);for(const p of ['js/characters.js',file])vm.runInContext(fs.readFileSync(p,'utf8'),c);return c.window.VCCharacters;}const old=load('/tmp/lucia-seat-before.js'),cur=load('/tmp/lucia-seat-after.js');function sig(root){const rows=[];root.traverse(o=>{const r=[o.type,o.name,o.visible,o.position.toArray(),o.quaternion.toArray(),o.scale.toArray()];if(o.isMesh)r.push(Object.keys(o.geometry.attributes).sort().map(k=>[k,Array.from(o.geometry.attributes[k].array)]),o.geometry.index?Array.from(o.geometry.index.array):null,...(Array.isArray(o.material)?o.material:[o.material]).map(m=>[m.type,m.color?m.color.getHex():null,m.roughness,m.transparent,m.opacity]));rows.push(r);});return JSON.stringify(rows);}for(const id of Object.keys(old.DESIGNS))if(id!=='luciaC')assert(sig(old.build(T,id))===sig(cur.build(T,id)));const joints=h=>{const u=h.userData;return [u.hips,u.spine,u.headP,...u.A.flatMap(a=>[a.sh,a.el]),...u.Lg.flatMap(l=>[l.hp,l.kn])].map(o=>[o.position.toArray(),o.quaternion.toArray(),o.scale.toArray()]);};const reports=[];for(const merge of [false,true]){const a=old.build(T,'luciaC',{merge}),h=cur.build(T,'luciaC',{merge}),u=h.userData,v=a.userData,bridge=h.getObjectByName('lucia-pelvis-skin-bridge'),oldBridge=a.getObjectByName('lucia-pelvis-skin-bridge'),briefs=h.getObjectByName('lucia-fitted-black-briefs'),oldBriefs=a.getObjectByName('lucia-fitted-black-briefs');assert(u.luciaFullerSeatSubtleHips&&u.luciaHipThighSmoothed&&u.luciaPelvisGapBridge&&u.luciaPelvisSeamBlend);assert.deepStrictEqual(joints(h),joints(a),'Rig or arm clearance offsets changed');for(const name of ['lucia-tailored-bra','lucia-dark-grey-tank-outfit'])assert(sig(h.getObjectByName(name))===sig(a.getObjectByName(name)),'Upper clothing changed');assert(u.m.skin.color.getHex()===v.m.skin.color.getHex()&&u.luciaOutfit===v.luciaOutfit&&u.luciaTankVisible);assert(briefs.visible&&briefs.isSkinnedMesh&&briefs.skeleton===bridge.skeleton&&!briefs.material.transparent&&briefs.material.opacity===1&&briefs.material.color.getHex()===oldBriefs.material.color.getHex());for(const key of ['skinIndex','skinWeight'])assert.deepStrictEqual(Array.from(bridge.geometry.attributes[key].array),Array.from(oldBridge.geometry.attributes[key].array),'Pelvis repair weights changed');assert.deepStrictEqual(Array.from(bridge.geometry.index.array),Array.from(oldBridge.geometry.index.array),'Repaired bridge topology changed');assert.deepStrictEqual(Array.from(briefs.geometry.index.array),Array.from(oldBriefs.geometry.index.array),'Underwear coverage topology changed');h.updateMatrixWorld(true);a.updateMatrixWorld(true);const inverse=new T.Matrix4().copy(u.hips.matrixWorld).invert(),triangles=[];let rearBefore=Infinity,rearAfter=Infinity,widthBefore=0,widthAfter=0;function envelope(human){const user=human.userData,inv=new T.Matrix4().copy(user.hips.matrixWorld).invert();let rear=Infinity,width=0;human.traverse(o=>{if(!o.isMesh||!(o.name==='lucia-pelvis-skin-bridge'||(o.material===user.m.skin&&(o.parent===user.spine||o.parent===user.hips||user.Lg.some(l=>o.parent===l.hp)))))return;const p=o.geometry.attributes.position,M=inv.clone().multiply(o.matrixWorld),q=new T.Vector3();for(let i=0;i<p.count;i++){q.fromBufferAttribute(p,i).applyMatrix4(M);if(q.y>=-.15&&q.y<=.08){rear=Math.min(rear,q.z);width=Math.max(width,Math.abs(q.x));}}});return {rear,width};}const eb=envelope(a),ea=envelope(h);rearBefore=eb.rear;rearAfter=ea.rear;widthBefore=eb.width;widthAfter=ea.width;assert(rearAfter<rearBefore-.008,'Seat not fuller');assert(widthAfter>widthBefore+.0005&&widthAfter<widthBefore*1.035,'Hip width change not subtle');h.traverse(o=>{if(!o.isMesh||!(o===bridge||(o.material===u.m.skin&&(o.parent===u.spine||o.parent===u.hips||u.Lg.some(l=>o.parent===l.hp)))))return;const g=o.geometry,p=g.attributes.position,M=inverse.clone().multiply(o.matrixWorld),points=[];for(let i=0;i<p.count;i++)points.push(new T.Vector3().fromBufferAttribute(p,i).applyMatrix4(M));for(let i=0,c=g.index?g.index.count:p.count;i<c;i+=3){const tri=[0,1,2].map(j=>points[g.index?g.index.getX(i+j):i+j]);if(Math.min(...tri.map(q=>q.y))<=.071&&Math.max(...tri.map(q=>q.y))>=.030)triangles.push(tri);}});const widths=new Map();function width(y){const key=Math.round(y*1e7);if(widths.has(key))return widths.get(key);let w=0;for(const tri of triangles)for(let j=0;j<3;j++){const a=tri[j],b=tri[(j+1)%3],dy=b.y-a.y;if(Math.abs(dy)<1e-10)continue;const t=(y-a.y)/dy;if(t>=0&&t<=1)w=Math.max(w,Math.abs(a.x+(b.x-a.x)*t));}widths.set(key,w);return w;}const p=briefs.geometry.attributes.position,M=inverse.clone().multiply(briefs.matrixWorld);assert(p.count===2*49*25);let minimumSideClearance=Infinity,sideChecks=0;for(let side=0;side<2;side++)for(let row=0;row<=24;row++)for(const col of [0,48]){const q=new T.Vector3().fromBufferAttribute(p,side*49*25+row*49+col).applyMatrix4(M),w=width(q.y),gap=Math.abs(q.x)-w;assert(w>.05&&gap>.004,'Underwear side band clips hip');minimumSideClearance=Math.min(minimumSideClearance,gap);sideChecks++;}let coverageChecks=0;for(const side of [-1,1])for(const x of [-.07,0,.07])for(const y of [-.05,.015,.05]){const origin=new T.Vector3(x,y,side).applyMatrix4(u.hips.matrixWorld),direction=new T.Vector3(0,0,-side).transformDirection(u.hips.matrixWorld);assert(new T.Raycaster(origin,direction,0,2).intersectObject(briefs,false).length>0,'Front/back underwear coverage missing');coverageChecks++;}for(const angle of [-.7,0,.7]){u.Lg[0].hp.rotation.x=angle;u.Lg[1].hp.rotation.x=-angle;u.spine.rotation.y=angle*.2;h.updateMatrixWorld(true);bridge.onBeforeRender();briefs.onBeforeRender();assert(Array.from(bridge.skeleton.boneMatrices).every(Number.isFinite));h.traverse(o=>{assert(o.matrixWorld.elements.every(Number.isFinite));if(o.isMesh)for(const key of ['position','normal','uv','skinWeight'])if(o.geometry.attributes[key])assert(Array.from(o.geometry.attributes[key].array).every(Number.isFinite));});}reports.push({merge,rearBefore,rearAfter,widthBefore,widthAfter,minimumSideClearance,sideChecks,coverageChecks,fit:u.luciaFullerSeatSubtleHips});}fs.copyFileSync('/tmp/lucia-seat-after.js','js/reference-characters.js');fs.mkdirSync('status',{recursive:true});fs.writeFileSync('status/lucia-seat-hips-side-refit-check.json',JSON.stringify({passed:true,branch:process.env.TARGET_BRANCH,reports,pelvisRepairTopologyAndWeightsPreserved:true,existingHipThighSmoothingAndSeamBlendApplied:true,underwearCoverageTopologyAndOpacityPreserved:true,upperClothingRigAndSkinToneUnchanged:true,scope:'Fuller posterior and up to two-percent localized hip width, with existing briefs refitted including exterior side bands. Numerical coverage and side-clearance checks are neutral-pose checks. Finite skeletal poses do not prove rendered seam quality, all-pose clipping, alternate outfit fit or live deployment.'},null,2)+'\n');
          JS
      - name: Publish validated seat hips and underwear refit
        run: |
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/"$TARGET_BRANCH")" || { echo 'Branch changed; rerun against latest.'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- js/reference-characters.js status/lucia-seat-hips-side-refit-check.json
          git diff --cached --quiet && exit 0
          git commit -m 'Enlarge Lucia seat subtly widen hips and smooth refitted underwear sides'
          git push origin HEAD:"refs/heads/$TARGET_BRANCH"
