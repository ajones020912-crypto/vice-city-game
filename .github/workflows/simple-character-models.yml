name: Simple 3D character models
on:
  push:
    branches: [main]
    paths: ['.github/workflows/simple-character-models.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: simple-character-models
  cancel-in-progress: false
jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply character-only hook and write readable result
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, os, json
          p=Path('index.html')
          report={'ok':False,'stage':'read'}
          try:
              s=p.read_text(encoding='utf-8')
              report['source_blob']=subprocess.check_output(['git','hash-object','index.html'],text=True).strip()
              report['stage']='patch'
              if 'SIMPLE_CHARACTER_MODELS_V2' in s or '<!-- SIMPLE_CHARACTER_MODELS_V1 -->' in s:
                  report.update(ok=True,result='already_applied')
              else:
                  pattern=r'\bfunction\s+makeHuman\s*\(\s*o\s*\)\s*\{'
                  if len(re.findall(pattern,s))!=1: raise RuntimeError('Expected exactly one makeHuman(o) declaration.')
                  if 'function makeOriginalHumanBeforeSimple(' in s: raise RuntimeError('Original builder name already exists.')
                  wrapper=r'''// SIMPLE_CHARACTER_MODELS_V2
          function makeHuman(o){
           const root=makeOriginalHumanBeforeSimple(o),u=root.userData;
           const cache=makeHuman._simpleGeometryCache||(makeHuman._simpleGeometryCache=new WeakMap());
           const weapons=new Set();for(const g of Object.values(u.guns||{})){if(g&&g.traverse)g.traverse(n=>weapons.add(n))}
           let changed=0;
           root.traverse(n=>{
            if(!n.isMesh||n.isSkinnedMesh||weapons.has(n)||!n.geometry)return;
            const old=n.geometry;if(old.type==='BoxGeometry'||old.type==='BoxBufferGeometry')return;
            let box=cache.get(old);
            if(!box){old.computeBoundingBox();const b=old.boundingBox;if(!b)return;const size=b.getSize(new T.Vector3()),center=b.getCenter(new T.Vector3());
             if(![size.x,size.y,size.z,center.x,center.y,center.z].every(Number.isFinite))return;
             box=new T.BoxGeometry(Math.max(.001,size.x),Math.max(.001,size.y),Math.max(.001,size.z));box.translate(center.x,center.y,center.z);cache.set(old,box)
            }
            n.geometry=box;changed++;
           });
           root.userData.simpleCharacterModels=true;root.userData.simplifiedMeshCount=changed;
           return root;
          }
          '''
                  updated=re.sub(pattern,lambda m:wrapper+'function makeOriginalHumanBeforeSimple(o){',s,count=1)
                  report['stage']='syntax_check'
                  checked=0
                  for code in re.findall(r'<script\b[^>]*>([\s\S]*?)</script>',updated,re.I):
                      if not code.strip(): continue
                      with tempfile.NamedTemporaryFile(mode='w',suffix='.js',delete=False) as f:
                          f.write(code);name=f.name
                      try:
                          result=subprocess.run(['node','--check',name],capture_output=True,text=True)
                          if result.returncode: raise RuntimeError(result.stderr[:3000])
                      finally: os.unlink(name)
                      checked+=1
                  if not checked: raise RuntimeError('No inline JavaScript found.')
                  p.write_text(updated,encoding='utf-8')
                  report.update(ok=True,result='applied',checked_scripts=checked)
          except Exception as exc:
              report['error']=str(exc)
          Path('character-model-status.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report))
          PY
      - name: Commit character changes or diagnostic result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- index.html character-model-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply simple character models or record precise patch diagnostic'
          git push origin HEAD:main
      - name: Mark an unsuccessful patch as failed
        run: node -e "if(!require('./character-model-status.json').ok)process.exit(1)"
