name: Lucia ten percent bust longer tank and slight stomach fullness
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lucia-bust-ten-longer-tank-stomach.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refit:
    strategy:
      fail-fast: false
      matrix:
        target: [main, lucia-outfits]
    concurrency:
      group: lucia-u-neck-${{ matrix.target }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --prefix "$RUNNER_TEMP/lucia-ten" --no-package-lock --ignore-scripts three@0.128.0 acorn@8
      - name: Prepare current-relative bust increase subtle abdomen and lower hem
        run: |
          node <<'JS'
          const fs=require('fs'),acorn=require(process.env.RUNNER_TEMP+'/lucia-ten/node_modules/acorn');let s=fs.readFileSync('js/reference-characters.js','utf8');if(s.includes('// LUCIA_BUST_TEN_LONGER_TANK_STOMACH_V1'))process.exit(0);if(!s.includes('// LUCIA_BUST_QUARTER_REFIT_V1')||!s.includes('// LUCIA_HANGING_TANK_BRIDGE_V2'))throw Error('Current reduced bust and bridged tank required');fs.writeFileSync('/tmp/lucia-ten-before.js',s);function once(a,b){if(s.split(a).length!==2)throw Error('Reviewed fitting hook changed: '+a);s=s.replace(a,b);}once('addLuciaTailoredBra(T,h);','fitLuciaTenBustAndStomach(T,h); addLuciaTailoredBra(T,h);');const helper=String.raw`
           function fitLuciaTenBustAndStomach(T,h){
            const u=h.userData;if(u.luciaTenBustAndStomach)return;if(!u.luciaQuarterBust||h.getObjectByName('lucia-tailored-bra'))throw Error('Apply after reduced torso and before bra');h.updateMatrixWorld(true);const inverse=new T.Matrix4().copy(u.spine.matrixWorld).invert(),smooth=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t);};let chestVertices=0,bellyVertices=0,maxChestAddition=0,maxBellyAddition=0;for(const mesh of u.spine.children){if(!mesh.isMesh||mesh.material!==u.m.skin)continue;const g=mesh.geometry.clone(),p=g.attributes.position,oldNormals=g.attributes.normal.clone(),M=inverse.clone().multiply(mesh.matrixWorld),back=M.clone().invert(),v=new T.Vector3(),edited=new Set(),affected=new Set();for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i).applyMatrix4(M);const ax=Math.abs(v.x),chestWeight=smooth((v.y-.275)/.045)*smooth((.490-v.y)/.045)*(1-smooth((ax-.120)/.040))*smooth((v.z-.025)/.060),bellyWeight=smooth((v.y-.060)/.060)*smooth((.275-v.y)/.055)*(1-smooth((ax-.070)/.090))*smooth((v.z-.015)/.050),chest=.10*v.z*chestWeight,belly=.006*bellyWeight;if(chest+belly<=1e-8)continue;if(chest>1e-8)chestVertices++;if(belly>1e-8)bellyVertices++;maxChestAddition=Math.max(maxChestAddition,chest);maxBellyAddition=Math.max(maxBellyAddition,belly);v.z+=chest+belly;v.applyMatrix4(back);p.setXYZ(i,v.x,v.y,v.z);edited.add(i);affected.add(i);}if(!edited.size)continue;for(let i=0,c=g.index?g.index.count:p.count;i<c;i+=3){const tri=[0,1,2].map(j=>g.index?g.index.getX(i+j):i+j);if(tri.some(k=>edited.has(k)))for(const k of tri)affected.add(k);}p.needsUpdate=true;g.computeVertexNormals();const n=g.attributes.normal,groups=new Map();for(const i of affected){const key=[p.getX(i),p.getY(i),p.getZ(i)].map(x=>Math.round(x*1e5)).join(',');if(!groups.has(key))groups.set(key,[]);groups.get(key).push(i);}for(const ids of groups.values()){const sum=new T.Vector3();for(const i of ids)sum.add(new T.Vector3().fromBufferAttribute(n,i));sum.normalize();for(const i of ids)n.setXYZ(i,sum.x,sum.y,sum.z);}for(let i=0;i<n.count;i++)if(!affected.has(i))n.setXYZ(i,oldNormals.getX(i),oldNormals.getY(i),oldNormals.getZ(i));n.needsUpdate=true;g.computeBoundingBox();g.computeBoundingSphere();mesh.geometry=g;}if(chestVertices<20||bellyVertices<10||maxChestAddition<.005||maxChestAddition>.025||maxBellyAddition<.002||maxBellyAddition>.006001)throw Error('Torso adjustment outside intended range');u.luciaTenBustAndStomach={chestVertices,bellyVertices,maxChestAddition,maxBellyAddition,coreBustProjectionScale:1.10,maximumBellyAddition:.006,relativeTo:'current torso after the existing quarter-bust reduction',scope:'Localized forward-depth change, not breast volume or whole-torso scaling. Abdomen addition tapers to zero before the lower pelvis and bust.'};
           }
          `;once('function addLuciaTailoredBra(T,h){',helper+'function addLuciaTailoredBra(T,h){');function walk(n,f){f(n);for(const v of Object.values(n)){if(Array.isArray(v)){for(const x of v)if(x&&typeof x.type==='string')walk(x,f);}else if(v&&typeof v.type==='string')walk(v,f);}}const nodes=[];walk(acorn.parse(s,{ecmaVersion:'latest'}),n=>{if(n.type==='FunctionDeclaration'&&n.id&&n.id.name==='refineLuciaTankUNeck')nodes.push(n);});if(nodes.length!==1)throw Error('Tank generator changed');const node=nodes[0];let f=s.slice(node.start,node.end);const anchor='hem=oldBox.min.y,';if(f.split(anchor).length!==2)throw Error('Hem definition changed');f=f.replace(anchor,'hem=Math.max(oldBox.min.y-.080,new T.Box3().setFromBufferAttribute(torso.geometry.attributes.position).applyMatrix4(inverse.clone().multiply(torso.matrixWorld)).min.y+.012),');s=s.slice(0,node.start)+f+s.slice(node.end);s='// LUCIA_BUST_TEN_LONGER_TANK_STOMACH_V1\n'+s;acorn.parse(s,{ecmaVersion:'latest'});fs.writeFileSync('/tmp/lucia-ten-after.js',s);
          JS
      - name: Verify measured torso adjustment longer covered tank and protected body
        run: |
          node <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert'),T=require(process.env.RUNNER_TEMP+'/lucia-ten/node_modules/three');if(!fs.existsSync('/tmp/lucia-ten-after.js')){assert(fs.readFileSync('js/reference-characters.js','utf8').includes('// LUCIA_BUST_TEN_LONGER_TANK_STOMACH_V1'));process.exit(0);}function load(file){const c={window:{},console,Math};vm.createContext(c);for(const p of ['js/characters.js',file])vm.runInContext(fs.readFileSync(p,'utf8'),c);return c.window.VCCharacters;}const old=load('/tmp/lucia-ten-before.js'),cur=load('/tmp/lucia-ten-after.js');function sig(root){const rows=[];root.traverse(o=>{const row=[o.type,o.name,o.visible,o.position.toArray(),o.quaternion.toArray(),o.scale.toArray()];if(o.isMesh)row.push(Object.keys(o.geometry.attributes).sort().map(k=>[k,Array.from(o.geometry.attributes[k].array)]),o.geometry.index?Array.from(o.geometry.index.array):null,...(Array.isArray(o.material)?o.material:[o.material]).map(m=>[m.type,m.color?m.color.getHex():null,m.roughness,m.transparent,m.opacity]));rows.push(row);});return JSON.stringify(rows);}for(const id of Object.keys(old.DESIGNS))if(id!=='luciaC')assert(sig(old.build(T,id))===sig(cur.build(T,id)),'Other character changed');const reports=[];for(const merge of [false,true]){const a=old.build(T,'luciaC',{merge}),h=cur.build(T,'luciaC',{merge}),u=h.userData,v=a.userData;assert(u.luciaTenBustAndStomach&&u.m.skin.color.getHex()===v.m.skin.color.getHex());for(let i=0;i<2;i++){assert(sig(u.A[i].sh)===sig(v.A[i].sh),'Shoulders arms or hands changed');assert(sig(u.Lg[i].hp)===sig(v.Lg[i].hp),'Legs hips or seat changed');}for(const name of ['lucia-pelvis-skin-bridge','lucia-fitted-black-briefs'])assert(sig(h.getObjectByName(name))===sig(a.getObjectByName(name)),'Pelvis or briefs changed');h.updateMatrixWorld(true);a.updateMatrixWorld(true);const inv=new T.Matrix4().copy(u.spine.matrixWorld).invert(),oldInv=new T.Matrix4().copy(v.spine.matrixWorld).invert();let core=0,belly=0;for(let k=0;k<u.spine.children.length;k++){const m=u.spine.children[k],b=v.spine.children[k];if(!m.isMesh||m.material!==u.m.skin)continue;assert(b&&b.isMesh&&b.material===v.m.skin);const p=m.geometry.attributes.position,q=b.geometry.attributes.position,M=inv.clone().multiply(m.matrixWorld),B=oldInv.clone().multiply(b.matrixWorld);assert(p.count===q.count);for(let i=0;i<p.count;i++){const now=new T.Vector3().fromBufferAttribute(p,i).applyMatrix4(M),was=new T.Vector3().fromBufferAttribute(q,i).applyMatrix4(B);assert(Math.abs(now.x-was.x)<1e-6&&Math.abs(now.y-was.y)<1e-6&&now.z>=was.z-1e-6);if(was.y>=.320001&&was.y<=.444999&&Math.abs(was.x)<=.119999&&was.z>=.085001){assert(Math.abs(now.z-was.z*1.1)<1e-6,'Core bust not ten percent larger');core++;}if(was.y>=.120001&&was.y<=.219999&&Math.abs(was.x)<=.069999&&was.z>=.065001){assert(Math.abs(now.z-was.z-.006)<1e-6,'Abdomen fullness outside target');belly++;}if(was.y<=.059999||was.y>=.490001)assert(now.distanceTo(was)<1e-6,'Torso outside target changed');}}assert(core>10&&belly>5);const fit=u.luciaTankUNeck,prior=v.luciaTankUNeck,extension=prior.hem-fit.hem;assert(extension>.030&&extension<=.080001,'Tank hem not sufficiently lowered');for(const key of ['neckHalf','neckDepth','strapWidth','strapCenter'])assert(fit[key]===prior[key],'Neckline or strap sizing changed');assert(Math.abs(fit.neckBase-prior.neckBase)<.004);const tank=h.getObjectByName('lucia-dark-grey-tank-top'),bra=h.getObjectByName('lucia-tailored-bra');assert(tank&&bra.visible&&u.luciaTankVisible&&u.luciaOutfit===v.luciaOutfit);assert(tank.material.color.getHex()===0x3b3d40&&tank.material.bumpMap&&tank.material.bumpScale===.00022&&!tank.material.transparent&&tank.material.opacity===1);bra.traverse(o=>{if(o.isMesh)assert(!o.material.transparent&&o.material.opacity===1);});const beforeShorts=a.getObjectByName('lucia-seamless-denim'),shorts=h.getObjectByName('lucia-seamless-denim');if(beforeShorts){assert(shorts&&shorts.visible&&shorts.isSkinnedMesh&&shorts.material.map&&shorts.material.bumpMap&&shorts.material.roughnessMap&&u.luciaBottomOutfit===v.luciaBottomOutfit);assert(shorts.material.color.getHex()===beforeShorts.material.color.getHex());}function hits(meshes,x,y){const origin=new T.Vector3(x,y,1).applyMatrix4(u.spine.matrixWorld),direction=new T.Vector3(0,0,-1).transformDirection(u.spine.matrixWorld);return new T.Raycaster(origin,direction,0,3).intersectObjects(meshes,false).map(hit=>hit.point.clone().applyMatrix4(inv)).filter(p=>p.z>.025);}const under=u.spine.children.filter(o=>o.isMesh&&o.material===u.m.skin);bra.traverse(o=>{if(o.isMesh)under.push(o);});let coverage=0;const profiles=[];for(const y of [fit.hem+.020,.22,.26,.32,.36,.38,.40]){const xs=[-.07,0,.07],p=xs.map(x=>hits([tank],x,y)[0]);if(p.some(q=>!q))continue;for(let i=0;i<xs.length;i++){const beneath=hits(under,xs[i],y)[0];if(beneath)assert(p[i].z-beneath.z>.001,'Tank intersects skin or bra');coverage++;}if(y>=.32)assert(Math.max(...p.map(q=>q.z))-Math.min(...p.map(q=>q.z))<.005,'Chest fabric lost bridged silhouette');profiles.push({y,z:p.map(q=>q.z)});}assert(profiles.some(p=>p.y<prior.hem)&&coverage>=12,'Extended stomach coverage missing');for(const side of [-1,1])for(const y of [.35,.39,.43])assert(hits(bra.children.filter(o=>o.isMesh),side*.08,y).length>0,'Permanent bra coverage missing');for(const angle of [-.7,0,.7]){u.A[0].sh.rotation.x=angle;u.A[1].sh.rotation.x=-angle;u.Lg[0].hp.rotation.x=angle;u.Lg[1].hp.rotation.x=-angle;h.updateMatrixWorld(true);if(shorts)shorts.onBeforeRender();h.traverse(o=>{assert(o.matrixWorld.elements.every(Number.isFinite));if(o.isMesh)for(const key of ['position','normal','uv'])if(o.geometry.attributes[key])assert(Array.from(o.geometry.attributes[key].array).every(Number.isFinite));});}reports.push({merge,measuredBustCoreVertices:core,measuredBellyCoreVertices:belly,previousHem:prior.hem,newHem:fit.hem,hemExtension:extension,coverageChecks:coverage,profiles,fit:u.luciaTenBustAndStomach});}fs.copyFileSync('/tmp/lucia-ten-after.js','js/reference-characters.js');fs.mkdirSync('status',{recursive:true});fs.writeFileSync('status/lucia-bust-ten-longer-tank-stomach-check.json',JSON.stringify({passed:true,branch:process.env.TARGET_BRANCH,reports,bustProjectionIncreaseFromCurrent:.10,maximumAbdomenForwardAddition:.006,desiredHemExtension:.080,braAndTankRefitted:true,permanentUnderwearCoveragePreserved:true,hipsSeatShouldersAndLegsUnchanged:true,denimPreservedIfInstalled:true,scope:'Core forward projection is ten percent above the currently reduced bust, not the original bust or breast volume. Abdomen expands forward slightly, not the whole waist. Hem extension is capped by available torso surface. Numerical neutral-pose and finite-pose checks do not verify all animation clipping, rendered appearance or deployment.'},null,2)+'\n');
          JS
      - name: Publish validated torso and longer tank
        run: |
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/"$TARGET_BRANCH")" || { echo 'Branch changed; rerun against latest.'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- js/reference-characters.js status/lucia-bust-ten-longer-tank-stomach-check.json
          git diff --cached --quiet && exit 0
          git commit -m 'Increase Lucia current bust projection ten percent soften stomach and lower tank hem'
          git push origin HEAD:"refs/heads/$TARGET_BRANCH"
