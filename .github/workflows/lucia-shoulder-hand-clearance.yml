name: Widen Lucia shoulders to clear hands from hips
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lucia-shoulder-hand-clearance.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clearance:
    strategy:
      fail-fast: false
      matrix:
        target: [main, lucia-outfits]
    concurrency:
      group: lucia-u-neck-${{ matrix.target }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --prefix "$RUNNER_TEMP/lucia-shoulders" --no-package-lock --ignore-scripts three@0.128.0 acorn@8
      - name: Prepare outward shoulder joints and extended inner shoulder contours
        run: |
          node <<'JS'
          const fs=require('fs'),acorn=require(process.env.RUNNER_TEMP+'/lucia-shoulders/node_modules/acorn');let s=fs.readFileSync('js/reference-characters.js','utf8');if(s.includes('// LUCIA_SHOULDER_HAND_CLEARANCE_V1'))process.exit(0);if(!s.includes('// LUCIA_U_NECK_STRAPS_V1'))throw Error('Current tank build required');fs.writeFileSync('/tmp/lucia-shoulders-before.js',s);function walk(n,f){f(n);for(const v of Object.values(n)){if(Array.isArray(v)){for(const x of v)if(x&&typeof x.type==='string')walk(x,f);}else if(v&&typeof v.type==='string')walk(v,f);}}const functions=[];walk(acorn.parse(s,{ecmaVersion:'latest'}),n=>{if(n.type==='FunctionDeclaration'&&n.id&&n.id.name==='lucia')functions.push(n);});if(functions.length!==1)throw Error('Lucia builder changed');const node=functions[0],hooks=node.body.body.filter(n=>n.type==='ExpressionStatement'&&n.expression.type==='CallExpression'&&n.expression.callee.name==='blendLuciaArmSeams');if(hooks.length!==1)throw Error('Reviewed pre-seam fitting hook missing');const hook=hooks[0];const helper=String.raw`
           function widenLuciaShoulderClearance(T,h){
            const u=h.userData;if(u.luciaShoulderHandClearance)return;h.updateMatrixWorld(true);const invHips=new T.Matrix4().copy(u.hips.matrixWorld).invert(),hipBox=new T.Box3(),smooth=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t);},isSkin=o=>o.material===u.m.skin||!!(o.material&&o.material.color&&o.material.color.getHex()===u.m.skin.color.getHex());h.traverse(o=>{if(!o.isMesh||!(o.name==='lucia-pelvis-skin-bridge'||(isSkin(o)&&(o.parent===u.hips||u.Lg.some(l=>o.parent===l.hp)))))return;const p=o.geometry.attributes.position,M=invHips.clone().multiply(o.matrixWorld),v=new T.Vector3();for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i).applyMatrix4(M);if(v.y>=-.260&&v.y<=.140)hipBox.expandByPoint(v);}});if(hipBox.isEmpty()||hipBox.max.x<.10||hipBox.min.x>-.10)throw Error('Hip envelope missing');function handPoints(arm){const points=[],invElbow=new T.Matrix4().copy(arm.el.matrixWorld).invert();arm.el.traverse(o=>{if(!o.isMesh||!isSkin(o))return;const p=o.geometry.attributes.position,toElbow=invElbow.clone().multiply(o.matrixWorld),toHips=invHips.clone().multiply(o.matrixWorld),v=new T.Vector3();for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i).applyMatrix4(toElbow);if(v.y<=-.240)points.push(new T.Vector3().fromBufferAttribute(p,i).applyMatrix4(toHips));}});if(points.length<10)throw Error('Hand geometry not identified');return points;}const report=[];for(const arm of u.A){if(arm.sh.parent!==u.spine)throw Error('Unexpected shoulder hierarchy');const original=arm.sh.getWorldPosition(new T.Vector3()).applyMatrix4(invHips),side=Math.sign(original.x);if(!side)throw Error('Shoulder side missing');const hipOuter=side>0?hipBox.max.x:-hipBox.min.x,before=handPoints(arm),innerBefore=Math.min(...before.map(p=>side*p.x)),amount=Math.max(.020,hipOuter+.020-innerBefore);if(amount>.100)throw Error('Required shoulder change exceeds conservative limit');const caps=[];for(const o of arm.sh.children){if(!o.isMesh||!isSkin(o))continue;const M=new T.Matrix4().copy(arm.sh.matrixWorld).invert().multiply(o.matrixWorld),box=new T.Box3().setFromBufferAttribute(o.geometry.attributes.position).applyMatrix4(M),size=box.getSize(new T.Vector3()),center=box.getCenter(new T.Vector3());if(center.y>-.065&&box.max.y>.010&&box.min.y>-.140&&size.y>.060&&size.y<.220)caps.push(o);}if(!caps.length)throw Error('Shoulder cap not identified safely');const desired=original.clone();desired.x+=side*amount;desired.applyMatrix4(u.hips.matrixWorld);arm.sh.position.copy(arm.sh.parent.worldToLocal(desired));h.updateMatrixWorld(true);const moved=arm.sh.getWorldPosition(new T.Vector3()).applyMatrix4(invHips);for(const mesh of caps){const g=mesh.geometry.clone(),p=g.attributes.position,M=invHips.clone().multiply(mesh.matrixWorld),back=M.clone().invert(),v=new T.Vector3();for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i).applyMatrix4(M);const inward=smooth((.035-side*(v.x-moved.x))/.080);v.x-=side*amount*inward;v.applyMatrix4(back);p.setXYZ(i,v.x,v.y,v.z);}p.needsUpdate=true;g.computeVertexNormals();const normal=g.attributes.normal,groups=new Map();for(let i=0;i<p.count;i++){const key=[p.getX(i),p.getY(i),p.getZ(i)].map(x=>Math.round(x*1e5)).join(',');if(!groups.has(key))groups.set(key,[]);groups.get(key).push(i);}for(const ids of groups.values()){const n=new T.Vector3();for(const i of ids)n.add(new T.Vector3().fromBufferAttribute(normal,i));n.normalize();for(const i of ids)normal.setXYZ(i,n.x,n.y,n.z);}normal.needsUpdate=true;g.computeBoundingBox();g.computeBoundingSphere();mesh.geometry=g;mesh.userData.luciaExtendedShoulderCap=true;}h.updateMatrixWorld(true);const after=handPoints(arm),innerAfter=Math.min(...after.map(p=>side*p.x)),clearance=innerAfter-hipOuter;if(clearance<.019)throw Error('Neutral hand clearance insufficient');report.push({side,outwardShift:amount,hipOuter,innerHandBefore:innerBefore,innerHandAfter:innerAfter,neutralClearance:clearance,extendedCaps:caps.length});}u.luciaShoulderHandClearance={arms:report,hipEnvelope:{min:hipBox.min.toArray(),max:hipBox.max.toArray()},scope:'Neutral-pose lateral hand clearance; not all animation collisions.'};
           }
          `;s=s.slice(0,hook.start)+'widenLuciaShoulderClearance(T,h);\n '+s.slice(hook.start);s=s.slice(0,node.start)+helper+s.slice(node.start);s='// LUCIA_SHOULDER_HAND_CLEARANCE_V1\n'+s;acorn.parse(s,{ecmaVersion:'latest'});fs.writeFileSync('/tmp/lucia-shoulders-after.js',s);
          JS
      - name: Verify hand clearance preserved lower body limb lengths weapons and clothing
        run: |
          node <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert'),T=require(process.env.RUNNER_TEMP+'/lucia-shoulders/node_modules/three');if(!fs.existsSync('/tmp/lucia-shoulders-after.js')){assert(fs.readFileSync('js/reference-characters.js','utf8').includes('// LUCIA_SHOULDER_HAND_CLEARANCE_V1'));process.exit(0);}function load(file){const c={window:{},console,Math};vm.createContext(c);for(const p of ['js/characters.js',file])vm.runInContext(fs.readFileSync(p,'utf8'),c);return c.window.VCCharacters;}const old=load('/tmp/lucia-shoulders-before.js'),cur=load('/tmp/lucia-shoulders-after.js');function fullSignature(h){const rows=[];h.traverse(o=>{const r=[o.type,o.name,o.position.toArray(),o.quaternion.toArray(),o.scale.toArray()];if(o.isMesh)r.push(Object.keys(o.geometry.attributes).sort().map(k=>[k,Array.from(o.geometry.attributes[k].array)]),o.geometry.index?Array.from(o.geometry.index.array):null,...(Array.isArray(o.material)?o.material:[o.material]).map(m=>[m.type,m.color?m.color.getHex():null,m.roughness,m.transparent,m.opacity]));rows.push(r);});return JSON.stringify(rows);}for(const id of Object.keys(old.DESIGNS))if(id!=='luciaC')assert(fullSignature(old.build(T,id))===fullSignature(cur.build(T,id)),'Other character changed');function lowerBody(h){const u=h.userData,rows=[];h.traverse(o=>{if(!o.isMesh||!(o.name==='lucia-pelvis-skin-bridge'||o.parent===u.hips||u.Lg.some(l=>o.parent===l.hp||o.parent===l.kn)))return;rows.push([o.name,o.position.toArray(),o.scale.toArray(),Object.keys(o.geometry.attributes).sort().map(k=>[k,Array.from(o.geometry.attributes[k].array)]),o.geometry.index?Array.from(o.geometry.index.array):null]);});return JSON.stringify(rows);}let poses=0;const reports=[];for(const merge of [false,true]){const a=old.build(T,'luciaC',{merge}),h=cur.build(T,'luciaC',{merge}),u=h.userData,v=a.userData,fit=u.luciaShoulderHandClearance;assert(fit&&fit.arms.length===2&&fit.arms.every(x=>x.neutralClearance>=.019&&x.outwardShift>=.020&&x.outwardShift<=.100));assert(lowerBody(a)===lowerBody(h),'Hip width legs pelvis or lower clothing changed');assert(u.m.skin.color.getHex()===v.m.skin.color.getHex());for(let i=0;i<2;i++){assert.deepStrictEqual(u.A[i].el.position.toArray(),v.A[i].el.position.toArray(),'Upper arm length changed');assert.deepStrictEqual(u.A[i].el.scale.toArray(),v.A[i].el.scale.toArray());assert.deepStrictEqual(u.A[i].sh.rotation.toArray(),v.A[i].sh.rotation.toArray(),'Rest arm rotation changed');const before=[],after=[];v.A[i].el.traverse(o=>{if(o.isMesh)before.push([o.name,Array.from(o.geometry.attributes.position.array),o.position.toArray()]);});u.A[i].el.traverse(o=>{if(o.isMesh)after.push([o.name,Array.from(o.geometry.attributes.position.array),o.position.toArray()]);});assert.deepStrictEqual(after,before,'Forearms hands or weapon attachments changed');}for(const name of ['lucia-tailored-bra','lucia-fitted-black-briefs','lucia-dark-grey-tank-outfit'])assert(h.getObjectByName(name)&&h.getObjectByName(name).visible);assert(u.luciaTankVisible&&u.luciaOutfit===v.luciaOutfit&&u.guns.pistol&&u.guns.rifle);assert(u.luciaTankUNeck.neckHalf===v.luciaTankUNeck.neckHalf&&u.luciaTankUNeck.neckDepth===v.luciaTankUNeck.neckDepth&&u.luciaTankUNeck.strapWidth===v.luciaTankUNeck.strapWidth&&Math.abs(u.luciaTankUNeck.neckBase-v.luciaTankUNeck.neckBase)<.003,'Neckline style changed');reports.push({merge,...fit});for(const angle of [-.8,0,.8]){u.A[0].sh.rotation.x=angle;u.A[1].sh.rotation.x=-angle;u.A[0].el.rotation.x=.2;u.A[1].el.rotation.x=.2;h.updateMatrixWorld(true);h.traverse(o=>{assert(o.matrixWorld.elements.every(Number.isFinite));if(o.isMesh)for(const k of ['position','normal'])if(o.geometry.attributes[k])assert(Array.from(o.geometry.attributes[k].array).every(Number.isFinite));});poses++;}}fs.copyFileSync('/tmp/lucia-shoulders-after.js','js/reference-characters.js');fs.mkdirSync('status',{recursive:true});fs.writeFileSync('status/lucia-shoulder-hand-clearance-check.json',JSON.stringify({passed:true,branch:process.env.TARGET_BRANCH,reports,poseChecks:poses,hipWidthAndLegGeometryUnchanged:true,armLengthsForearmsHandsAndWeaponAttachmentsUnchanged:true,currentTankStyleAndBaseGarmentsRetained:true,skinToneAndOtherCharactersUnchanged:true,scope:'Shoulder-root outward shifts and extended shoulder caps, followed by existing seam blending and outfit fitting. Neutral hand clearance and finite-pose tests do not establish all-pose collision freedom, aim accuracy, seamless visual shoulder joints or live deployment.'},null,2)+'\n');
          JS
      - name: Publish validated shoulder adjustment to selected branch
        run: |
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/"$TARGET_BRANCH")" || { echo 'Target branch changed; rerun against latest.'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- js/reference-characters.js status/lucia-shoulder-hand-clearance-check.json
          git diff --cached --quiet && exit 0
          git commit -m 'Move Lucia shoulders outward and extend shoulder caps so resting hands clear hips'
          git push origin HEAD:"refs/heads/$TARGET_BRANCH"
